X('m137_mvtb',{
 why:'The MVT\'s consequences are what make derivatives useful for proofs.',
 idea:['f′ = 0 on an interval means f is constant. f′ = g′ means f and g differ by a constant. f′ &gt; 0 means f is increasing.','Bounded Derivative Theorem: if m ≤ f′ ≤ M on (a, b), then f(a) + m(x − a) ≤ f(x) ≤ f(a) + M(x − a). This turns derivative bounds into value bounds and inequalities.'],
 keys:[['Constant Function Thm','f′ = 0 on an interval ⇒ f constant'],['Antiderivative Thm','f′ = g′ ⇒ f = g + C'],['Increasing Function Thm','f′ &gt; 0 ⇒ f increasing'],['Bounded Derivative','m ≤ f′ ≤ M ⇒ f(a) + m(x − a) ≤ f(x) ≤ f(a) + M(x − a)']],
 ex:[{q:'Show eˣ ≥ 1 + x for x ≥ 0.',s:['Let g(x) = eˣ − 1 − x. Then g(0) = 0.','g′(x) = eˣ − 1 ≥ 0 for x ≥ 0, so g is increasing.','So g(x) ≥ g(0) = 0.'],a:'eˣ ≥ 1 + x'}],
 traps:['Applying the Constant Function Theorem on a domain that isn\'t an interval (1/x has pieces).']});

// ---------- Taylor ----------
X('m137_lhop',{
 why:'L\'Hôpital\'s Rule handles indeterminate forms that algebra can\'t.',
 idea:['For 0/0 or ∞/∞ forms: lim f/g = lim f′/g′, if the second limit exists. Differentiate the top and bottom separately; this is not the quotient rule.','Other forms convert. 0·∞ becomes f/(1/g). ∞ − ∞ becomes one fraction. For 1^∞, 0⁰ and ∞⁰, take ln first, then exponentiate at the end.'],
 keys:[['Rule','0/0 or ∞/∞: lim f/g = lim f′/g′'],['Check','confirm the indeterminate form at every application'],['0·∞','rewrite as a fraction'],['1^∞ etc.','y = f^g, then ln y = g ln f'],['Classic','lim (1 + 1/n)ⁿ = e']],
 ex:[{q:'lim as x → 0⁺ of x ln x.',s:['Form 0·(−∞). Rewrite as ln x/(1/x): −∞/∞.','L\'H: (1/x)/(−1/x²) = −x → 0.'],a:'0'},
  {q:'lim as x → 0 of (1 + 2x)^(1/x).',s:['1^∞. ln y = ln(1 + 2x)/x, a 0/0 form.','L\'H: 2/(1 + 2x) → 2.','y → e².'],a:'e²'}],
 traps:['Using the quotient rule instead of differentiating top and bottom separately.','Applying L\'H to a form that isn\'t indeterminate.']});

X('m137_taylor',{
 why:'Taylor polynomials approximate functions with polynomials that match more and more derivatives.',
 idea:['Tₙ,ₐ(x) = Σₖ₌₀ⁿ f⁽ᵏ⁾(a)/k! · (x − a)ᵏ. It matches f and its first n derivatives at a. T₁ is the linear approximation.','Memorize the Maclaurin polynomials (a = 0) of eˣ, sin x, cos x, ln(1 + x) and 1/(1 − x). Substitute into them to get new ones: e<sup>x²</sup> comes from eˣ with x replaced by x².'],
 keys:[['Tₙ,ₐ','Σ f⁽ᵏ⁾(a)(x − a)ᵏ/k!'],['eˣ','1 + x + x²/2! + x³/3! + ⋯'],['sin x','x − x³/3! + x⁵/5! − ⋯'],['cos x','1 − x²/2! + x⁴/4! − ⋯'],['ln(1 + x)','x − x²/2 + x³/3 − ⋯'],['1/(1 − x)','1 + x + x² + ⋯']],
 ex:[{q:'Find T₄,₀ for f(x) = e^(−x²).',s:['eᵘ ≈ 1 + u + u²/2 with u = −x².','= 1 − x² + x⁴/2.'],a:'T₄(x) = 1 − x² + x⁴/2'}],
 traps:['Forgetting the k! in the denominator.','Expanding about the wrong centre.']});

X('m137_rem',{
 why:'Taylor\'s Theorem bounds the error, so you know how accurate an approximation is.',
 idea:['f(x) = Tₙ,ₐ(x) + Rₙ,ₐ(x), where Rₙ,ₐ(x) = f⁽ⁿ⁺¹⁾(c)/(n + 1)! · (x − a)ⁿ⁺¹ for some c between a and x.','For a bound, replace |f⁽ⁿ⁺¹⁾(c)| by its maximum M on that interval: |R| ≤ M|x − a|ⁿ⁺¹/(n + 1)!.'],
 keys:[['Remainder','Rₙ(x) = f⁽ⁿ⁺¹⁾(c)(x − a)ⁿ⁺¹/(n + 1)!'],['c','some point between a and x'],['Bound','|Rₙ| ≤ M|x − a|ⁿ⁺¹/(n + 1)!'],['sin, cos','M = 1 always works']],
 ex:[{q:'Bound the error using T₃,₀ of sin x to approximate sin(0.1).',s:['n = 3, so you need f⁽⁴⁾ = sin, which has |sin c| ≤ 1.','|R₃| ≤ (0.1)⁴/4! = 0.0001/24.'],a:'Error ≤ 4.2 × 10⁻⁶'}],
 traps:['Using the nth derivative instead of the (n + 1)th.']});

X('m137_bigO',{
 why:'Big-O notation tracks how big an error term is without exact constants.',
 idea:['f(x) = O(g(x)) as x → 0 means |f(x)| ≤ M|g(x)| near 0: f is at most a constant times g. Higher powers of x are smaller near 0, so O(x³) terms are smaller than O(x²) terms.','Taylor\'s Approximation Theorem II gives f(x) = Tₙ,₀(x) + O(xⁿ⁺¹). Use it to compute limits by expanding everything to enough terms.'],
 keys:[['O(g)','|f| ≤ M|g| near 0'],['Sum','O(xᵐ) + O(xⁿ) = O(x^min(m, n))'],['Product','xᵐ·O(xⁿ) = O(xᵐ⁺ⁿ)'],['TAT II','f(x) = Tₙ,₀(x) + O(xⁿ⁺¹)']],
 ex:[{q:'Use Big-O to find lim as x → 0 of (sin x − x)/x³.',s:['sin x = x − x³/6 + O(x⁵).','sin x − x = −x³/6 + O(x⁵).','Divide by x³: −1/6 + O(x²) → −1/6.'],a:'−1/6'}],
 traps:['Expanding too few terms, which leaves 0/0.','Treating O(x²) − O(x²) as 0. It\'s still O(x²).']});

// ===== Rich lessons: CHEM 120 (grounded in Modules 1–6) =====

// ---------- Module 1 ----------
X('chem_mole',{
 why:'Every stoichiometry problem goes through moles. Grams and particles are only the start and the finish.',
 idea:['A mole is 6.022 × 10²³ particles (Avogadro\'s number, N_A). The molar mass M (g/mol) is the mass of one mole, found by adding atomic masses from the formula.','Convert with n = m/M and N = n·N_A. Mass percent of an element is the mass of that element in one mole of the compound, divided by the molar mass.'],
 keys:[['n','m/M (mol = g ÷ g/mol)'],['N','n·N_A, N_A = 6.022 × 10²³ mol⁻¹'],['M','sum of atomic masses in the formula'],['Mass %','(mass of element in 1 mol)/M × 100%'],['Molarity','c = n/V (mol/L)']],
 ex:[{q:'How many molecules are in 36.0 g of H₂O?',s:['M(H₂O) = 2(1.008) + 16.00 = 18.02 g/mol.','n = 36.0/18.02 = 2.00 mol.','N = 2.00 × 6.022 × 10²³.'],a:'1.20 × 10²⁴ molecules'},
  {q:'Mass percent of C in CO₂?',s:['M(CO₂) = 12.01 + 2(16.00) = 44.01 g/mol.','12.01/44.01 × 100%.'],a:'27.29%'}],
 traps:['Using atomic mass for a diatomic: O₂ is 32.00 g/mol, not 16.00.','Rounding molar masses too early.']});

X('chem_balance',{
 why:'Stoichiometry only works with a balanced equation. The coefficients are the mole ratios.',
 idea:['Balancing conserves atoms: every element has the same count on both sides. Only change coefficients, never subscripts, because changing a subscript changes the substance.','Strategy: balance elements that appear in only one reactant and one product first. Leave free elements like O₂ or H₂ until last. Clear fractions at the end by multiplying everything through.'],
 keys:[['Rule','change coefficients, never subscripts'],['Order','unique elements first, free elements last'],['Combustion','CₓHᵧ + O₂ → CO₂ + H₂O; balance C, then H, then O'],['Fractions','allowed temporarily; multiply through at the end']],
 ex:[{q:'Balance C₃H₈ + O₂ → CO₂ + H₂O.',s:['C: 3 CO₂.','H: 8 H gives 4 H₂O.','O on the right: 3(2) + 4(1) = 10, so 5 O₂.'],a:'C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O'},
  {q:'Balance C₂H₆ + O₂ → CO₂ + H₂O.',s:['2 CO₂ and 3 H₂O.','O on the right: 4 + 3 = 7, so 7/2 O₂.','Multiply everything by 2.'],a:'2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O'}],
 traps:['Changing H₂O to H₂O₂ to "balance" oxygen.','Forgetting to double-check every element at the end.']});

X('chem_limiting',{
 why:'Real reactions rarely use exact ratios. The limiting reagent decides how much product you get.',
 idea:['Convert each reactant to moles, then divide by its coefficient in the balanced equation. The smallest result is the limiting reagent; it runs out first. Everything else is in excess.','The theoretical yield comes from the limiting reagent. Percent yield compares what you actually got to that maximum. For solutions, moles = concentration × volume (in L).'],
 keys:[['Limiting','smallest (moles ÷ coefficient)'],['Theoretical yield','calculated from the limiting reagent'],['% yield','actual/theoretical × 100%'],['Solutions','n = cV, with V in litres'],['Excess left','initial − amount used']],
 ex:[{q:'25.0 mL of 0.325 M AgNO₃ is mixed with 30.0 mL of 0.120 M KCl. What mass of AgCl forms? (Module 1 example)',s:['n(Ag⁺) = 0.0250 × 0.325 = 8.13 × 10⁻³ mol.','n(Cl⁻) = 0.0300 × 0.120 = 3.60 × 10⁻³ mol.','1 : 1 ratio, so Cl⁻ is limiting: 3.60 × 10⁻³ mol AgCl.','× 143.32 g/mol.'],a:'0.516 g AgCl'}],
 traps:['Comparing grams instead of moles.','Forgetting to divide by the coefficients when they aren\'t 1.']});

X('chem_precip',{
 why:'Precipitation reactions and net ionic equations show what is really happening in solution.',
 idea:['Strong electrolytes (soluble ionic compounds, strong acids and bases) split completely into ions in water. When two solutions mix, a precipitate forms if any cation–anion pair is insoluble.','Molecular equation → complete ionic equation (split the aqueous strong electrolytes) → cancel the spectator ions that appear unchanged on both sides → net ionic equation.'],
 keys:[['Always soluble','Group 1 cations, NH₄⁺, NO₃⁻, CH₃COO⁻'],['Usually soluble','Cl⁻, Br⁻, I⁻ (except with Ag⁺, Pb²⁺, Hg₂²⁺); SO₄²⁻ (except Ba²⁺, Pb²⁺, Ca²⁺, Sr²⁺)'],['Usually insoluble','CO₃²⁻, PO₄³⁻, S²⁻, OH⁻ (except with Group 1, NH₄⁺; some Group 2)'],['Spectator ions','unchanged on both sides; cancel them'],['Keep together','solids, liquids, gases and weak electrolytes']],
 ex:[{q:'Write the net ionic equation for AgNO₃(aq) + NaCl(aq).',s:['Products: AgCl and NaNO₃. AgCl is insoluble.','Complete ionic: Ag⁺ + NO₃⁻ + Na⁺ + Cl⁻ → AgCl(s) + Na⁺ + NO₃⁻.','Cancel the spectators Na⁺ and NO₃⁻.'],a:'Ag⁺(aq) + Cl⁻(aq) → AgCl(s)'}],
 traps:['Splitting a solid precipitate into ions.','Forgetting to balance charge in the net ionic equation.']});

X('chem_green',{
 why:'Green chemistry metrics measure how wasteful a reaction or process is.',
 idea:['Atom economy is a theoretical measure from the balanced equation: what fraction of the reactant mass ends up in the desired product? Addition reactions with one product have 100% atom economy.','The E-factor is a practical measure: kilograms of waste per kilogram of product. Water is not counted as waste, but substances dissolved in wastewater are. A smaller E-factor is better.'],
 keys:[['% atom economy','(stoichiometric mass of desired product)/(mass of stoichiometric mixture of reactants) × 100%'],['E-factor','mass of waste/mass of product'],['Water','excluded from waste (dissolved substances count)'],['Ideal','100% atom economy and E-factor = 0'],['Process E-factor','(kg raw materials − kg product)/kg product']],
 ex:[{q:'Atom economy for making CaO by CaCO₃ → CaO + CO₂?',s:['Reactant mass: M(CaCO₃) = 100.09 g.','Desired product: M(CaO) = 56.08 g.','56.08/100.09 × 100%.'],a:'56.03%'},
  {q:'A process uses 10.0 kg of raw materials (not counting water) and yields 2.0 kg of product. E-factor?',s:['Waste = 10.0 − 2.0 = 8.0 kg.','8.0/2.0.'],a:'E-factor = 4.0'}],
 traps:['Using actual yield in atom economy. It\'s based on the balanced equation only.','Including water in the E-factor.','Forgetting the coefficients in the reactant mass.']});

// ---------- Module 2 ----------
X('chem_light',{
 why:'Light connects the energy of electrons to what we can measure: colours and wavelengths.',
 idea:['Light is a wave: c = λν, with c = 2.998 × 10⁸ m/s. It also comes in packets called photons, each with energy E = hν = hc/λ. Shorter wavelength means higher frequency and more energy per photon.','The photoelectric effect showed the particle picture: electrons are ejected only above a threshold frequency, whatever the intensity. Brighter light gives more photons, not more energetic ones.'],
 keys:[['c','λν = 2.998 × 10⁸ m/s'],['E (photon)','hν = hc/λ'],['h','6.626 × 10⁻³⁴ J·s'],['Per mole','E × N_A'],['Photoelectric','KE(electron) = hν − Φ (work function)'],['Units','nm = 10⁻⁹ m']],
 ex:[{q:'Find ν and the photon energy for λ = 500. nm.',s:['ν = c/λ = (2.998 × 10⁸)/(5.00 × 10⁻⁷) = 6.00 × 10¹⁴ Hz.','E = hν = (6.626 × 10⁻³⁴)(6.00 × 10¹⁴).'],a:'3.97 × 10⁻¹⁹ J per photon'}],
 traps:['Forgetting to convert nm to m.','Thinking higher intensity means higher energy per photon.']});

X('chem_bohr',{
 why:'The Bohr model explains the line spectrum of hydrogen from quantized energy levels.',
 idea:['In hydrogen, the electron\'s energy is quantized: Eₙ = −R_H/n², with R_H = 2.179 × 10⁻¹⁸ J. n = 1 is the lowest energy (ground state). As n → ∞, E → 0 (ionized).','When the electron drops from n_i to a lower n_f, it emits a photon with energy equal to the energy gap. Absorption goes upward. Bigger jumps give more energy and shorter wavelengths.'],
 keys:[['Eₙ','−R_H/n², R_H = 2.179 × 10⁻¹⁸ J'],['ΔE','R_H(1/n_f² − 1/n_i²) in magnitude'],['Emission','high n → low n (photon out)'],['Absorption','low n → high n (photon in)'],['λ','hc/|ΔE|'],['Ionization from n = 1','R_H per atom']],
 ex:[{q:'Find λ for the transition n = 3 → n = 2 in H.',s:['|ΔE| = 2.179 × 10⁻¹⁸ (1/2² − 1/3²) = 2.179 × 10⁻¹⁸ × 5/36.','|ΔE| = 3.026 × 10⁻¹⁹ J.','λ = hc/ΔE = (6.626 × 10⁻³⁴)(2.998 × 10⁸)/(3.026 × 10⁻¹⁹).'],a:'6.56 × 10⁻⁷ m = 656 nm (red)'}],
 traps:['Mixing up which n goes first. Use the absolute value and think about the direction.','Applying the Bohr formula to atoms with more than one electron.']});

X('chem_debroglie',{
 why:'de Broglie and Heisenberg explain why electrons need quantum mechanics instead of orbits.',
 idea:['de Broglie proposed that matter also has a wavelength: λ = h/(mv). For everyday objects it is far too small to notice. For electrons, it is about the size of an atom.','The Heisenberg Uncertainty Principle says Δx·Δp ≥ h/(4π): you can\'t know a particle\'s position and momentum exactly at the same time. So electrons don\'t have definite trajectories, and Bohr-style orbits fail.'],
 keys:[['de Broglie','λ = h/(mv) = h/p'],['m','in kg (electron: 9.109 × 10⁻³¹ kg)'],['HUP','Δx·Δp ≥ h/(4π)'],['Δp','m·Δv'],['Meaning','no exact trajectories for electrons']],
 ex:[{q:'Find λ for an electron moving at 1.00 × 10⁶ m/s.',s:['λ = h/(mv) = 6.626 × 10⁻³⁴/(9.109 × 10⁻³¹ × 1.00 × 10⁶).'],a:'7.27 × 10⁻¹⁰ m (about the size of an atom)'}],
 traps:['Using grams instead of kilograms.','Reading the HUP as a limit of our instruments. It\'s a property of nature.']});

X('chem_qn',{
 why:'The four quantum numbers label every electron. They underpin configurations and the periodic table.',
 idea:['n (principal) sets the size and energy level: 1, 2, 3, …. ℓ (angular momentum) sets the shape: 0 to n − 1, labelled s, p, d, f. m_ℓ (magnetic) sets the orientation: −ℓ to +ℓ. m_s (spin) is +½ or −½.','The Pauli exclusion principle says no two electrons share all four numbers, so each orbital holds at most 2 electrons, with opposite spins.'],
 keys:[['n','1, 2, 3, …'],['ℓ','0 … n − 1 (s, p, d, f = 0, 1, 2, 3)'],['m_ℓ','−ℓ … +ℓ (2ℓ + 1 orbitals)'],['m_s','±½'],['Orbitals in shell n','n²'],['Electrons in shell n','2n²']],
 ex:[{q:'Is (n, ℓ, m_ℓ, m_s) = (3, 2, −3, +½) allowed?',s:['ℓ = 2 is allowed for n = 3 (ℓ ≤ 2).','m_ℓ must be between −2 and +2.'],a:'No: m_ℓ = −3 is impossible.'},
  {q:'How many orbitals are in the 4f subshell?',s:['f means ℓ = 3.','2ℓ + 1 = 7.'],a:'7 orbitals (14 electrons)'}],
 traps:['Allowing ℓ = n.','Mixing up the labels: ℓ = 2 is d, not p.']});

X('chem_nodes',{
 why:'Nodes describe the shapes of orbitals and are a common test question.',
 idea:['A node is a place where the probability of finding the electron is zero. Radial nodes are spherical shells. Angular nodes are planes or cones through the nucleus.','Count them: angular nodes = ℓ, radial nodes = n − ℓ − 1, total nodes = n − 1.'],
 keys:[['Angular','ℓ'],['Radial','n − ℓ − 1'],['Total','n − 1'],['s orbitals','no angular nodes, spherical'],['p orbitals','one nodal plane']],
 ex:[{q:'How many radial and angular nodes does a 3p orbital have?',s:['n = 3 and ℓ = 1.','Angular = ℓ = 1.','Radial = 3 − 1 − 1 = 1.'],a:'1 radial, 1 angular (2 total)'}],
 traps:['Using n − ℓ for radial nodes. It\'s n − ℓ − 1.']});

// ---------- Module 3 ----------
X('chem_config',{
 why:'Electron configurations explain chemical behaviour and the layout of the periodic table.',
 idea:['Fill orbitals in order of increasing energy (Aufbau): 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d …. Each orbital holds 2 electrons with opposite spins (Pauli). Within a subshell, spread electrons out with parallel spins before pairing (Hund\'s rule).','Know the two exceptions: Cr is [Ar]4s¹3d⁵ and Cu is [Ar]4s¹3d¹⁰, because half-filled and filled d subshells are extra stable.','For transition metal cations, remove the 4s electrons before the 3d electrons.'],
 keys:[['Aufbau order','1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p'],['Pauli','max 2 electrons per orbital, opposite spins'],['Hund','singly occupy, parallel spins, before pairing'],['Exceptions','Cr: 4s¹3d⁵; Cu: 4s¹3d¹⁰'],['Cations','remove ns before (n − 1)d'],['Paramagnetic','has unpaired electrons']],
 ex:[{q:'Write configurations for Fe and Fe³⁺.',s:['Fe (Z = 26): [Ar]4s²3d⁶.','Remove 3 electrons: 4s first (2), then one 3d.'],a:'Fe³⁺: [Ar]3d⁵ (5 unpaired, paramagnetic)'}],
 traps:['Removing 3d before 4s for cations.','Forgetting the Cr and Cu exceptions.']});

X('chem_trend',{
 why:'Periodic trends let you predict properties from position alone.',
 idea:['The key idea is effective nuclear charge, Z_eff: the pull a valence electron actually feels after shielding by inner electrons. Across a period, Z_eff increases, so atoms get smaller and hold their electrons more tightly. Down a group, the valence electrons are in larger shells farther from the nucleus.','Results: atomic radius decreases across and increases down. Ionization energy and electronegativity increase across and decrease down. Cations are smaller than their atoms and anions are larger. In an isoelectronic series, more protons means a smaller ion.'],
 keys:[['Z_eff','increases across a period'],['Radius','smaller to the right, larger down'],['IE₁','larger to the right, smaller down'],['Electronegativity','larger to the right, smaller down; F is highest'],['Ions','cation &lt; atom &lt; anion'],['IE exceptions','Be &gt; B and N &gt; O']],
 ex:[{q:'Order by radius: Na⁺, F⁻, Ne, Mg²⁺, O²⁻.',s:['All have 10 electrons (isoelectronic).','More protons pull harder: O (8) &lt; F (9) &lt; Ne (10) &lt; Na (11) &lt; Mg (12).'],a:'O²⁻ &gt; F⁻ &gt; Ne &gt; Na⁺ &gt; Mg²⁺'}],
 traps:['Thinking more electrons always means larger. Across a period, the radius shrinks.','Forgetting the N &gt; O ionization-energy exception (a paired-electron repulsion in O).']});

// ---------- Module 4 ----------
X('chem_vsepr',{
 why:'VSEPR predicts 3-D shapes, and shape decides polarity and properties.',
 idea:['Electron groups around the central atom (bonds and lone pairs) repel and spread out. A double or triple bond counts as one group. The number of groups sets the electron-group geometry. The molecular shape describes only where the atoms are.','Lone pairs take up more room and squeeze bond angles. A molecule is polar if its bond dipoles don\'t cancel. Symmetric shapes with identical surrounding atoms are nonpolar.'],
 keys:[['2 groups','linear, 180°'],['3','trigonal planar, 120° (1 lone pair: bent)'],['4','tetrahedral, 109.5° (1 LP: trigonal pyramidal; 2 LP: bent)'],['5','trigonal bipyramidal (1 LP: seesaw; 2: T-shaped; 3: linear)'],['6','octahedral (1 LP: square pyramidal; 2: square planar)'],['Polar','bond dipoles don\'t cancel']],
 ex:[{q:'Predict the shape and polarity of SF₄.',s:['S has 6 valence electrons: 4 bonds to F plus 1 lone pair, so 5 groups.','5 groups with 1 lone pair: seesaw.','The asymmetric shape means the dipoles don\'t cancel.'],a:'Seesaw, polar'},
  {q:'Is CO₂ polar?',s:['2 groups on C: linear.','The two equal C=O dipoles point in opposite directions.'],a:'Nonpolar (it has polar bonds)'}],
 traps:['Naming the shape from electron groups instead of atoms (NH₃ is pyramidal, not tetrahedral).','Polar bonds don\'t always make a polar molecule.']});

X('chem_formal',{
 why:'Formal charge picks the best Lewis structure, and resonance describes bonds Lewis structures can\'t.',
 idea:['Formal charge = valence electrons − non-bonding electrons − ½(bonding electrons). The best structure keeps formal charges near zero and puts any negative formal charge on the more electronegative atom.','When more than one valid structure differs only in where the electrons are, the real molecule is a resonance hybrid, an average. Its bonds are intermediate in length and strength.','Ionic bond strength is measured by lattice energy, which grows with ion charge and shrinks with ion size (Coulomb\'s law).'],
 keys:[['FC','V − N − B/2'],['Best structure','FCs near 0; negative FC on the more electronegative atom'],['Resonance','same atoms, different electron placement; the real molecule is the average'],['Bond order (resonance)','total bonds/number of positions'],['Expanded octet','only row 3 and below'],['Lattice energy','∝ |q₁q₂|/(r₁ + r₂)']],
 ex:[{q:'Find the C–O bond order in CO₃²⁻.',s:['Three resonance structures, each with one C=O and two C–O.','Total bonds: 4 spread across 3 positions.'],a:'Bond order 4/3 (all three bonds equal)'},
  {q:'Which has the larger lattice energy, NaCl or MgO?',s:['MgO: charges +2 and −2, so |q₁q₂| = 4. NaCl: 1.','The ions are similar in size.'],a:'MgO, by a lot'}],
 traps:['Counting both electrons of a bond toward FC. Only half counts.','Thinking the molecule flips between resonance structures.']});

// ---------- Module 5 ----------
X('chem_hybrid',{
 why:'Hybridization explains bond angles and counts σ and π bonds in valence bond theory.',
 idea:['In VB theory, atomic orbitals mix (hybridize) to point along the bond directions. The number of electron groups on an atom sets the hybridization: 2 is sp, 3 is sp², 4 is sp³, 5 is sp³d, 6 is sp³d².','Every single bond is one σ bond. A double bond is σ + π, and a triple bond is σ + 2π. π bonds come from unhybridized p orbitals overlapping side by side.'],
 keys:[['2 groups','sp (linear)'],['3','sp² (trigonal planar)'],['4','sp³ (tetrahedral)'],['5','sp³d'],['6','sp³d²'],['Single','1σ'],['Double','1σ + 1π'],['Triple','1σ + 2π']],
 ex:[{q:'Count the σ and π bonds in C₂H₄, and give each carbon\'s hybridization.',s:['Each C has 3 groups (2 H plus C), so sp².','Bonds: 4 C–H (σ) and 1 C=C (σ + π).'],a:'5σ, 1π; each C is sp²'},
  {q:'HCN?',s:['C has 2 groups (H and N), so sp.','H–C σ; C≡N σ + 2π.'],a:'2σ, 2π; C is sp'}],
 traps:['Counting a double bond as two σ bonds.','Forgetting to count lone pairs as groups.']});

X('chem_mo',{
 why:'MO diagrams predict bond order and magnetism, which Lewis structures can\'t.',
 idea:['In MO theory, atomic orbitals combine into molecular orbitals spread over the whole molecule. Bonding orbitals are lower in energy; antibonding orbitals (*) are higher. Fill them like atomic orbitals: lowest first, Pauli, Hund.','The order of the 2p-derived orbitals depends on the molecule. For B₂, C₂ and N₂, π2p lies below σ2p (because of s–p mixing). For O₂, F₂ and Ne₂, σ2p lies below π2p. Unpaired electrons make a molecule paramagnetic.'],
 keys:[['Bond order','(bonding e⁻ − antibonding e⁻)/2'],['BO = 0','molecule not stable'],['B₂, C₂, N₂','σ2s σ*2s π2p σ2p π*2p σ*2p'],['O₂, F₂, Ne₂','σ2s σ*2s σ2p π2p π*2p σ*2p'],['Paramagnetic','any unpaired electrons'],['Higher BO','shorter, stronger bond']],
 ex:[{q:'Use MO theory for O₂: bond order and magnetism.',s:['12 valence electrons.','σ2s² σ*2s² σ2p² π2p⁴ π*2p².','The two π* electrons sit in separate orbitals (Hund), so they\'re unpaired.','BO = (8 − 4)/2 = 2.'],a:'BO 2, paramagnetic (VB theory can\'t explain this)'},

X('chem_kmt',{

 keys:[['KE_avg','(3/2)RT per mole: depends only on T'],['u_rms','√(3RT/M), with M in kg/mol and R = 8.3145 J/(K·mol)'],['Graham','rate₁/rate₂ = √(M₂/M₁)'],['van der Waals','(P + an²/V²)(V − nb) = nRT'],['a','attractions (lower the pressure)'],['b','molecular volume (less free space)'],['Z','PV/(nRT); 1 for an ideal gas']],
 ex:[{q:'Find u_rms for N₂ at 300 K.',s:['M = 0.02802 kg/mol.','u = √(3 × 8.3145 × 300/0.02802).'],a:'≈ 517 m/s'},
  {q:'How much faster does He effuse than CH₄?',s:['√(M(CH₄)/M(He)) = √(16.04/4.003) = √4.01.'],a:'About 2.00 times faster'}],
 traps:['Using g/mol instead of kg/mol in u_rms.','Thinking heavier gases have more average KE at the same T. They have the same KE.']});

 keys:[['Dispersion','all molecules; increase with size and surface area'],['Dipole–dipole','polar molecules'],['H-bond','H–N, H–O or H–F ··· N, O or F'],['Stronger IMF','↑ b.p., ↑ viscosity, ↑ surface tension, ↓ vapour pressure'],['Same size','polar &gt; nonpolar (ICl &gt; Br₂)']],
 ex:[{q:'Rank by boiling point: CH₄, CH₃OH, CH₃Cl.',s:['CH₄: dispersion only, and small.','CH₃Cl: polar, so dipole–dipole plus dispersion.','CH₃OH: has O–H, so hydrogen bonding.'],a:'CH₄ &lt; CH₃Cl &lt; CH₃OH'},

X('phys_lab',{

// ---------- tiny search engine (BM25) ----------
const STOP=new Set('the a an and or of to in is are be for on with as by it this that at from if then so we you your can not no its into than which what when how why does do'.split(' '));
function toks(t){return String(t).toLowerCase().replace(/<[^>]+>/g,' ').replace(/[^a-z0-9α-ωσπ∗*₀-₉⁰-⁹²³ℤℂ≡∀∃⇒]+/g,' ').split(' ').filter(w=>w&&w.length>1&&!STOP.has(w))}
function mkIndex(chunks){const df=new Map();let tot=0;for(const c of chunks){c.tf=new Map();for(const w of toks(c.title+' '+c.text)){c.tf.set(w,(c.tf.get(w)||0)+1)}c.len=[...c.tf.values()].reduce((a,b)=>a+b,0);tot+=c.len;for(const w of c.tf.keys())df.set(w,(df.get(w)||0)+1)}return{chunks,df,avg:tot/Math.max(1,chunks.length),N:chunks.length}}
function search(ix,q,k){if(!ix||!ix.N)return[];const qs=[...new Set(toks(q))];const out=[];for(const c of ix.chunks){let s=0;for(const w of qs){const f=c.tf.get(w);if(!f)continue;const idf=Math.log(1+(ix.N-(ix.df.get(w)||0)+.5)/((ix.df.get(w)||0)+.5));s+=idf*f*2.2/(f+1.2*(.25+.75*c.len/ix.avg))}if(s>0)out.push([s,c])}return out.sort((a,b)=>b[0]-a[0]).slice(0,k).map(x=>x[1])}
function lessonIndex(){if(TUT.lessons)return TUT.lessons;const ch=[];for(const k in LX){const x=LX[k],n=REG[k];if(!n)continue;const t=[x.why,...(x.idea||[]),...(x.keys||[]).map(p=>p.join(': ')),...(x.ex||[]).map(e=>'Example: '+e.q+' '+e.s.join(' ')+' '+(e.a||'')),...(x.traps||[]).map(t=>'Trap: '+t),x.tip||''].join('\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>');ch.push({src:'lesson',k,title:`Lesson: ${n.name} (${n.course.name}, ${n.world.title})`,text:t})}return TUT.lessons=mkIndex(ch)}

// ---------- the student's notes, kept in IndexedDB on this device ----------
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('margin_notes',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('docs',{keyPath:'id'});d.createObjectStore('chunks',{keyPath:'id',autoIncrement:true}).createIndex('doc','doc')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbAll(store){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction(store).objectStore(store).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function notesIndex(){if(TUT.notes)return TUT.notes;try{const ch=await idbAll('chunks');TUT.notes=mkIndex(ch.map(c=>({src:'notes',title:`Notes: ${c.docName}${c.page?`, p. ${c.page}`:''}`,text:c.text})))}catch(e){TUT.notes=mkIndex([])}return TUT.notes}
function chunkText(text,maxLen=1100){const paras=text.replace(/\r/g,'').split(/\n\s*\n|(?<=\.)\s{2,}/);const out=[];let cur='';for(const p of paras){const t=p.replace(/\s+/g,' ').trim();if(!t)continue;if((cur+' '+t).length>maxLen&&cur){out.push(cur);cur=t}else cur=cur?cur+' '+t:t;while(cur.length>maxLen*1.6){out.push(cur.slice(0,maxLen));cur=cur.slice(maxLen)}}if(cur)out.push(cur);return out}
async function pdfPages(file,onProg){let lib;try{lib=await import(new URL('lib/pdf.min.mjs',location.href).href)}catch(e){throw new Error('PDF reading is only available in the phone app. Here, use a .txt or .md file, or a photo of the page.')}
  lib.GlobalWorkerOptions.workerSrc=new URL('lib/pdf.worker.min.mjs',location.href).href;const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;const pages=[];
  for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const tc=await p.getTextContent();let s='';for(const it of tc.items){s+=it.str+(it.hasEOL?'\n':' ')}pages.push(s);if(i%5===0||i===pdf.numPages)onProg(i,pdf.numPages)}return pages}
async function importNotes(files){const st=$('#notestat');const say=t=>{if(st)st.textContent=t};const d=await idb();
  for(const f of files){try{say(`Reading ${f.name}…`);let pages;if(/\.pdf$/i.test(f.name))pages=await pdfPages(f,(i,n)=>say(`Reading ${f.name}: page ${i} of ${n}`));else pages=[await f.text()];
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);let n=0;const tx=d.transaction(['docs','chunks'],'readwrite');const cs=tx.objectStore('chunks');
    pages.forEach((pg,i)=>{for(const c of chunkText(pg)){cs.add({doc:id,docName:f.name.replace(/\.[^.]+$/,''),page:pages.length>1?i+1:0,text:c});n++}});
    tx.objectStore('docs').put({id,name:f.name,pages:pages.length,chunks:n,added:dayStr()});await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=()=>j(tx.error)});
    if(!n)throw new Error(`No text found in ${f.name}. Scanned PDFs have no text layer.`);say(`Added ${f.name}: ${pages.length} page${pages.length>1?'s':''}.`)}catch(e){say(e.message||String(e))}}
  TUT.notes=null;notesModal(true)}
async function deleteDoc(id){const d=await idb();const tx=d.transaction(['docs','chunks'],'readwrite');const ix=tx.objectStore('chunks').index('doc');ix.openCursor(IDBKeyRange.only(id)).onsuccess=e=>{const c=e.target.result;if(c){c.delete();c.continue()}};tx.objectStore('docs').delete(id);await new Promise(r=>tx.oncomplete=r);TUT.notes=null;notesModal(true)}
async function notesModal(keep){const docs=await idbAll('docs').catch(()=>[]);const msg=keep&&$('#notestat')?$('#notestat').textContent:'';
  modal(`<div class="box-h"><h2 class="t-title">Your notes</h2><button class="icon-btn close" data-act="close" aria-label="Close">${ic('x')}</button></div>
   <p class="help" style="margin:0 0 12px">Import lecture notes or modules as PDF, .txt or .md. They stay on this device. When you ask a question, the passages most related to it are sent along, and the tutor uses them first.</p>
   ${docs.length?`<div class="group" style="margin-bottom:12px">${docs.map(d=>`<div class="row"><span class="main-t"><span class="t">${esc(d.name)}</span><span class="s">${d.pages} page${d.pages>1?'s':''}, ${d.chunks} passages</span></span><button class="icon-btn" data-act="notedel" data-id="${d.id}" aria-label="Remove ${esc(d.name)}">${ic('x',16)}</button></div>`).join('')}</div>`:''}
   <label class="btn btn-primary btn-block filebtn">Import files<input type="file" id="notefile" accept=".pdf,.txt,.md,application/pdf,text/plain" multiple></label>
   <p class="help" id="notestat" role="status" style="margin:10px 0 0">${esc(msg)}</p>`)}

// ---------- model routes ----------
async function sampleFn(){if(TUT.sample!==undefined)return TUT.sample;try{TUT.sample=window.claude&&window.claude.use?await Promise.race([window.claude.use('sample'),new Promise(r=>setTimeout(()=>r(null),10500))]):null}catch(e){TUT.sample=null}

async function aiRoute(){if(await sampleFn())return'claude';if(aiCfg())return'key';return null}
function aiE(msg,code){const e=new Error(msg);e.code=code||'api';return e}
function normBase(b){return String(b||'').trim().replace(/\/+$/,'').replace(/\/chat\/completions$/,'')}
function hostOf(u){try{return new URL(u).host}catch(e){return'the server'}}
function scrub(t,key){t=String(t||'');return key&&key.length>6?t.split(key).join('••••'):t}
// One request shape per provider. messages: [{role:'user'|'assistant', content:string, imgs?:[{mime,b64}]}]
function provReq(c,system,messages,max){const P=c.prov;
  if(P==='anthropic')return{url:'https://api.anthropic.com/v1/messages',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:{model:c.model,max_tokens:max,system,messages:messages.map(m=>({role:m.role,content:m.imgs&&m.imgs.length?[...m.imgs.map(i=>({type:'image',source:{type:'base64',media_type:i.mime,data:i.b64}})),{type:'text',text:m.content}]:m.content}))},
    text:j=>(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')};
  if(P==='gemini')return{url:`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model.replace(/^models\//,''))}:generateContent`,headers:{'content-type':'application/json','x-goog-api-key':c.key},
    body:{system_instruction:{parts:[{text:system}]},contents:messages.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content},...(m.imgs||[]).map(i=>({inline_data:{mime_type:i.mime,data:i.b64}}))]})),generationConfig:{maxOutputTokens:max}},
    text:j=>{const c0=(j.candidates||[])[0];if(!c0){const r=j.promptFeedback&&j.promptFeedback.blockReason;if(r)throw aiE(`Gemini blocked this question (${r}). Try rewording it.`);return''}return((c0.content||{}).parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('')}};
  const base=P==='openai'?'https://api.openai.com/v1':P==='openrouter'?'https://openrouter.ai/api/v1':normBase(c.base);
  const body={model:c.model,messages:[{role:'system',content:system},...messages.map(m=>({role:m.role,content:m.imgs&&m.imgs.length?[{type:'text',text:m.content},...m.imgs.map(i=>({type:'image_url',image_url:{url:`data:${i.mime};base64,${i.b64}`}}))]:m.content}))]};
  if(P==='openai')body.max_completion_tokens=max;else body.max_tokens=max;
  return{url:base+'/chat/completions',headers:{'content-type':'application/json',authorization:'Bearer '+c.key},body,
    text:j=>{const ch=(j.choices||[])[0];if(!ch)return'';const m=ch.message||{};return typeof m.content==='string'?m.content:Array.isArray(m.content)?m.content.map(p=>p.text||'').join(''):''}}}
function errMsg(c,s,j){const N=PROV[c.prov].n;let m='',code='';if(j){const e=Array.isArray(j)?j[0]&&j[0].error:j.error;m=typeof e==='string'?e:(e&&e.message)||j.message||'';code=e&&typeof e==='object'?String(e.code||e.type||''):''}m=String(m).replace(/\s+/g,' ').slice(0,180);
  if(s===403&&m&&!/api key not valid|invalid.{0,20}(api )?key|incorrect api key/i.test(m))return`${N} refused the request (403): ${m}`;
  if(s===401||s===403||/api key not valid|invalid.{0,20}(api )?key|incorrect api key/i.test(m))return`${N} rejected the key (${s}). Check it under API key.`;
  if(s===402||code==='insufficient_quota'||/credit|insufficient_quota|billing|current quota/i.test(m))return`Your ${N} account is out of credit, or billing isn’t set up.`;
  if(s===429)return`${N} rate limit reached. Wait a minute, then try again.`;
  if(s===404||/model.{0,40}(not found|does not exist|not exist|invalid)/i.test(m))return`${N} couldn’t use the model “${c.model}”.${m?' '+m:' Check the model name under API key.'}`;
  if(s>=500)return`${N} is having trouble right now (${s}). Try again in a minute.`;
  return`The ${N} request failed (${s}).${m?' '+m:''}`}
async function provFetch(c,system,messages,max,signal){const r=provReq(c,system,messages,max);let res;
  try{res=await fetch(r.url,{method:'POST',signal,headers:r.headers,body:JSON.stringify(r.body)})}
  catch(e){if(e&&e.name==='AbortError')throw e;throw aiE(c.prov==='custom'?`Couldn’t reach ${hostOf(r.url)}. Check the base URL and your connection. The server also has to allow requests from web pages (CORS).`:`Couldn’t reach ${PROV[c.prov].n}. Check your connection and try again.`,'net')}
  let j=null;try{j=await res.json()}catch(_){}
  if(!res.ok)throw aiE(scrub(errMsg(c,res.status,j),c.key));
  return scrub(r.text(j||{}),c.key)}
async function callAI(system,messages,onText,signal){const sm=await sampleFn();
  if(sm){const last=messages[messages.length-1],opts={onText:({text})=>onText(text),signal,cache:false};if(last.blobs&&last.blobs.length)opts.images=last.blobs;
    const r=await sm([{role:'user',content:system+'\n\n---\n\n'+messages[0].content},...messages.slice(1)].map(m=>({role:m.role,content:m.content})),opts);return r.text}
  const c=aiCfg();if(!c)throw aiE('no_ai','no_ai');
  const t=await provFetch(c,system,messages,c.prov==='anthropic'?2000:4000,signal);onText(t);return t}

// ---------- attachments: photos, PDFs and text files sent with one question ----------
const IMG_MAX=1568,TXT_CAP=30000,TXT_TOTAL=60000,MAX_ATT=6;
const nf=n=>n.toLocaleString('en-CA');
function attAccept(){return IN_CLAUDE?(TUT.img?'image/*,':'')+'.txt,.md,text/plain,text/markdown':'image/*,.pdf,application/pdf,.txt,.md,text/plain,text/markdown'}
function attKind(f){const n=f.name||'',t=f.type||'';if(/^image\//.test(t)||/\.(jpe?g|png|webp|gif|heic|heif|avif)$/i.test(n))return'image';if(t==='application/pdf'||/\.pdf$/i.test(n))return'pdf';if(/^text\//.test(t)||/\.(txt|md|markdown|csv)$/i.test(n))return'text';return''}
function b64Of(blob){return new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]||'');fr.onerror=()=>j(fr.error);fr.readAsDataURL(blob)})}
async function decodeImg(f){const heic=/hei[cf]/i.test(f.type)||/\.hei[cf]$/i.test(f.name||'');
  if(window.createImageBitmap){try{return{src:await createImageBitmap(f),done(){this.src.close&&this.src.close()}}}catch(e){}}
  const url=URL.createObjectURL(f);const im=new Image();im.src=url;
  try{await im.decode();return{src:im,done(){URL.revokeObjectURL(url)}}}catch(e){URL.revokeObjectURL(url);throw new Error(heic?'Can’t open this HEIC photo here. Send a screenshot of it instead, or set Camera, Formats to Most Compatible.':'This image can’t be opened. Try a JPEG or PNG.')}}
function drawTo(src,w,h,max,q){const s=Math.min(1,max/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*s));cv.height=Math.max(1,Math.round(h*s));const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(src,0,0,cv.width,cv.height);return cv}
async function prepImage(f,a){if(f.size>40e6)throw new Error('This photo is too large (over 40 MB).');const d=await decodeImg(f);
  try{const w=d.src.width||d.src.naturalWidth,h=d.src.height||d.src.naturalHeight;if(!w||!h)throw new Error('This image can’t be opened. Try a JPEG or PNG.');
    const cv=drawTo(d.src,w,h,IMG_MAX);const blob=await new Promise((r,j)=>cv.toBlob(b=>b?r(b):j(new Error('Couldn’t process this photo.')),'image/jpeg',.85));
    a.blob=blob;a.mime='image/jpeg';a.b64=await b64Of(blob);a.thumb=drawTo(d.src,w,h,160).toDataURL('image/jpeg',.7);a.info=`Photo · ${cv.width}×${cv.height}`;a.file=null}finally{d.done()}}
async function prepDoc(f,a){let pages;
  if(a.kind==='pdf')pages=await pdfPages(f,(i,n)=>{a.info=`Reading page ${i} of ${n}…`;renderAtts()});else pages=[await f.text()];
  const txt=(pages.length>1?pages.map((p,i)=>`[page ${i+1}]\n${p.trim()}`).join('\n\n'):pages[0]).replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  if(!txt.replace(/\[page \d+\]/g,'').trim())throw new Error(a.kind==='pdf'?'No text in this PDF (scanned pages have none). Send a photo of the page instead.':'This file is empty.');
  a.cut=txt.length>TXT_CAP;a.text=txt.slice(0,TXT_CAP);a.total=txt.length;a.pages=pages.length;
  a.info=(a.kind==='pdf'?`PDF · ${pages.length} page${pages.length>1?'s':''}`:'Text file')+(a.cut?` · only the first ${nf(TXT_CAP)} of ${nf(txt.length)} characters are sent`:'')}
function addFiles(files){for(const f of files){
  if(TUT.atts.length>=MAX_ATT){toast(`Up to ${MAX_ATT} attachments per question`,'x');break}
  const kind=attKind(f);const a={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:f.name||'photo.jpg',kind:kind||'file',busy:true,file:f,info:'Reading…'};TUT.atts.push(a);
  if(!kind){a.busy=false;a.err='Only photos, PDFs and .txt or .md files can be attached.';continue}

  a.p=(kind==='image'?prepImage(f,a):prepDoc(f,a)).catch(e=>{a.err=(e&&e.message)||'This file couldn’t be read.'}).finally(()=>{a.busy=false;renderAtts()})}
  renderAtts()}

function renderAtts(){const box=askEl('#atts');if(!box)return;box.hidden=!TUT.atts.length;box.innerHTML=attsHtml(!!box.closest('.inmodal'))}

const TUTOR_SYS=`You are the tutor inside Margin, a study app for a first-year University of Waterloo student taking MATH 135 (algebra and proofs), MATH 137 (calculus), CHEM 120 and PHYS 121.
Ground every answer in the COURSE MATERIAL below. It takes priority over your general knowledge: use its notation, theorem names (TD, DIC, CAD, LDET, FℓT, IVT, MVT…), constants (R_H = 2.179 × 10⁻¹⁸ J, R = 8.3145 L·kPa/(K·mol), g = 9.81 m/s²) and conventions. "Notes" passages are the student's own course notes and outrank "Lesson" passages.
After any claim taken from the material, cite it in square brackets with its label, for example [Notes: CHEM Module 4, p. 16] or [Lesson: Bézout & EEA].
If the material does not cover the question, say so in one short line ("Not in your notes; here's the general idea."), then answer from general knowledge.
Style: informal and brief. Work step by step with short numbered steps when solving. If the student is working on graded assignment questions, guide with hints rather than giving the final answer. Write math in plain Unicode (x², √, ≤, ∑, ∫); no LaTeX. No headings.`;
function ctxBlock(hits){return hits.length?hits.map(h=>`[${h.title}]\n${h.text.slice(0,1400)}`).join('\n\n'):'(No matching passages.)'}

// ---------- view ----------
function viewAsk(){const ctx=TUT.ctx;const k=ctx&&ctx.k&&REG[ctx.k];
  const sug=k?[`Explain ${k.name} simply`,`What's the most common mistake in ${k.name}?`,`Give me a practice question on ${k.name}`]:['Explain the Extended Euclidean Algorithm','Why is O₂ paramagnetic?','When do I use L\'Hôpital\'s Rule?','How do I draw a free-body diagram on an incline?'];
  return`<div class="ask"><div class="ask-h"><div><h1 class="t-title">Ask</h1><p class="t-sub">Answers use your notes first, then the lessons. Sources are cited in brackets. Attach a photo or file with the clip.</p></div></div>
   <div class="ask-tools">${IN_CLAUDE?'':`<button class="btn btn-secondary btn-sm" data-act="aisettings" id="keybtn">${keyBtnHtml()}</button>`}<button class="btn btn-ghost btn-sm" data-act="notes">${ic('book',16)} Your notes</button></div>
   ${k?`<div class="ctxchip">${markEl(ctx.k)}<span>About <b>${k.name}</b>${ctx.q?', this question':''}</span><button class="icon-btn" data-act="askclear" aria-label="Remove topic">${ic('x',15)}</button></div>`:''}
   <div id="aiwarn">${!IN_CLAUDE&&!aiCfg()?noKeyHtml():''}</div>
   <div class="msgs" id="msgs" aria-live="polite">${TUT.msgs.length?TUT.msgs.map(msgHtml).join(''):`<div class="sugs">${sug.map(t=>`<button class="sug" data-act="asksug">${esc(t)}</button>`).join('')}</div>`}</div>
   <div class="composer"><div class="atts" id="atts"${TUT.atts.length?'':' hidden'}>${attsHtml(false)}</div>
   <form class="cform" id="askform"><label class="attbtn filebtn" aria-label="Attach a photo or file">${ic('clip',20)}<input type="file" id="askfile" accept="${attAccept()}" multiple aria-label="Attach a photo or file"></label><textarea id="askin" rows="1" placeholder="Ask about your courses" aria-label="Your question"></textarea><button class="btn btn-primary send" type="submit" id="asksend" aria-label="Send">${ic('chev',18,2.2)}</button></form></div></div>`}
function keyBtnHtml(){const c=aiCfg();return`${ic('key',16)}<span>API key</span><span class="kst${c?' on':''}">${c?'Connected · '+PROV[c.prov].s:'Not set'}</span>`}
function noKeyHtml(){return`<div class="tip keycta">${ic('key',17)}<div><div class="lbl">Connect the tutor</div>Paste an API key from Anthropic, OpenAI, Google Gemini, OpenRouter or any OpenAI-compatible service. It stays on this device.<button class="btn btn-primary btn-block" data-act="aisettings">${ic('key',16)} Add API key</button></div></div>`}
function askRefresh(){const b=$('#keybtn');if(b)b.innerHTML=keyBtnHtml();showRoute()}
function md(t){let h=esc(t);h=h.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\[((?:Notes|Lesson):[^\]\n]{1,120})\]/g,'<span class="cite">$1</span>');
  const lines=h.split('\n');let out='',list=null;for(const l of lines){const m=l.match(/^\s*(\d+)[.)]\s+(.*)$/),b=l.match(/^\s*[-•*]\s+(.*)$/);if(m||b){const tag=m?'ol':'ul';if(list!==tag){if(list)out+=`</${list}>`;out+=`<${tag}>`;list=tag}out+=`<li>${(m?m[2]:b[1])}</li>`}else{if(list){out+=`</${list}>`;list=null}if(l.trim())out+=`<p>${l}</p>`}}if(list)out+=`</${list}>`;return out}
function mattsHtml(m){return m.atts&&m.atts.length?`<div class="matts">${m.atts.map(a=>a.thumb?`<img src="${a.thumb}" alt="${esc(a.name)}">`:`<span class="mfile">${ic('file',14)}<span>${esc(a.name)}</span></span>`).join('')}</div>`:''}
function msgHtml(m){return m.role==='user'?`<div class="msg me">${mattsHtml(m)}${esc(m.show!=null?m.show:m.content)}</div>`:`<div class="msg ai">${m.content?md(m.content):m.err?'':'<span class="typing">Thinking…</span>'}${m.err?`<p class="xerr">${esc(m.err)}</p>`:''}</div>`}
function renderMsgs(){const box=askEl('#msgs');if(!box)return;box.innerHTML=TUT.msgs.map(msgHtml).join('');const last=box.lastElementChild;if(last)last.scrollIntoView({block:'end',behavior:'smooth'})}
async function showRoute(){const w=askEl('#aiwarn');if(!w)return;const r=await aiRoute();document.querySelectorAll('#askfile').forEach(i=>i.accept=attAccept());if(r)return w.innerHTML='';
  w.innerHTML=IN_CLAUDE?`<div class="tip">${ic('hint',17)}<div><div class="lbl">Connect the tutor</div>The tutor needs Claude access. Allow it when Claude asks, or use the phone app with your own API key.</div></div>`:noKeyHtml()}
async function askSend(text,show){if(TUT.busy)return;text=String(text||'');if(!text.trim()&&!TUT.atts.some(a=>!a.err))return;TUT.busy=true;const btn0=askEl('#asksend');if(btn0)btn0.disabled=true;
  await Promise.all(TUT.atts.map(a=>a.p).filter(Boolean));const atts=TUT.atts.filter(a=>!a.err&&!a.busy);TUT.atts=[];renderAtts();
  const imgs=atts.filter(a=>a.kind==='image'),docs=atts.filter(a=>a.kind!=='image');const ctx=TUT.ctx;const k=ctx&&ctx.k;
  const q=text.trim()||(imgs.length?'Help me with what’s in this photo.':'Help me with this file.');
  let room=TXT_TOTAL;const fileBlock=docs.map(a=>{const t=a.text.slice(0,Math.max(0,room));room-=t.length;const cut=a.cut||t.length<a.text.length;return`ATTACHED FILE: ${a.name}${cut?` (only the first ${nf(t.length)} of ${nf(a.total)} characters)`:''}\n${t}`}).join('\n\n');
  const content=q+(imgs.length?`\n\n(${imgs.length} photo${imgs.length>1?'s':''} attached.)`:'')+(fileBlock?'\n\n'+fileBlock:'');
  const qCtx=[q,docs.map(a=>a.text.slice(0,600)).join(' '),k?REG[k].name:'',ctx&&ctx.q?strip(ctx.q.prompt):''].join(' ');
  const notes=search(await notesIndex(),qCtx,5),less=search(lessonIndex(),qCtx,3);if(k&&!less.some(h=>h.k===k)){const own=lessonIndex().chunks.find(c=>c.k===k);if(own)less.unshift(own)}
  let first=`COURSE MATERIAL\n\n${ctxBlock([...notes,...less.slice(0,4)])}`;
  if(ctx&&ctx.q){const qq=ctx.q;const opt=o=>strip(o.html);first+=`\n\nTHE QUESTION THE STUDENT IS LOOKING AT\n${strip(qq.prompt)}\nOptions: ${qq.options.map(opt).join(' | ')}\nCorrect answer: ${opt(qq.options.find(o=>o.key===qq.answer)||{html:qq.answer})}${ctx.picked?`\nStudent picked: ${opt(qq.options.find(o=>o.key===ctx.picked)||{html:ctx.picked})}`:''}\nApp's worked steps: ${(qq.steps||[]).map(strip).join(' / ')}`}
  const history=TUT.msgs.filter(m=>m.content&&!m.err).slice(-6).map(m=>({role:m.role,content:m.content,imgs:m.imgs}));
  const userTurn={role:'user',content,show:show!=null?show:text.trim(),atts:atts.map(a=>({kind:a.kind,name:a.name,thumb:a.thumb})),imgs:imgs.map(a=>({mime:a.mime,b64:a.b64}))};TUT.msgs.push(userTurn);const ai={role:'assistant',content:''};TUT.msgs.push(ai);renderMsgs();
  const messages=[...(history.length?[{role:'user',content:first+'\n\n(Earlier conversation follows.)'},{role:'assistant',content:'Understood.'},...history]:[]),{role:'user',content:(history.length?'':first+'\n\nSTUDENT\'S QUESTION\n')+content,imgs:userTurn.imgs,blobs:imgs.map(a=>a.blob)}];
  let left=TUT.imgMax;for(let i=messages.length-1;i>=0;i--){const m=messages[i];if(!m.imgs||!m.imgs.length)continue;if(left<=0){m.imgs=null;continue}if(m.imgs.length>left)m.imgs=m.imgs.slice(-left);left-=m.imgs.length}
  TUT.abort=new AbortController();
  try{await callAI(TUTOR_SYS,messages,t=>{ai.content=t;renderMsgs()},TUT.abort.signal);if(!ai.content)ai.err='No answer came back. Try again.'}
  catch(e){ai.err=e.code==='no_ai'?'The tutor isn’t connected. Tap API key above to add one, or use Margin in Claude.':e.code==='not_granted'?'Claude access wasn’t allowed. Allow it to use the tutor.':e.code==='rate_limited'?'Too many questions at once. Wait a moment, then try again.':e.code==='image_rejected'||e.code==='images_unavailable'?'Claude couldn’t take that photo here. Try a different one, or describe it in words.':(e.message||'Something went wrong.');
    if(!ai.content){TUT.msgs=TUT.msgs.filter(m=>m!==userTurn);if(atts.length&&!TUT.atts.length){TUT.atts=atts;renderAtts()}}}
  TUT.busy=false;renderMsgs();if(askEl('#asksend'))askEl('#asksend').disabled=false}
function askAbout(k,q,picked,autoQ){TUT.ctx={k,q,picked};TUT.msgs=[];TUT.atts=[];go('ask');if(autoQ)setTimeout(()=>askSend(autoQ),50)}

const dayStr=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayNum=s=>{const[y,m,d]=s.split('-').map(Number);return Math.round(new Date(y,m-1,d,12).getTime()/864e5)};
const today=()=>dayNum(dayStr());const gapDays=(a,b)=>dayNum(b)-dayNum(a);
const dayOffset=n=>{const d=new Date();d.setDate(d.getDate()+n);return d};
function liveStreak(){if(!S.lastDay)return 0;const g=gapDays(S.lastDay,dayStr());if(g<=1)return S.streak;if(g-1<=S.freezes)return S.streak;return 0}
function touchStreak(){const t=dayStr();if(S.lastDay===t)return false;let used=0;if(!S.lastDay)S.streak=1;else{const g=gapDays(S.lastDay,t);if(g===1)S.streak++;else if(g>1&&g-1<=S.freezes){used=g-1;S.freezes-=used;S.streak++}else S.streak=1}S.lastDay=t;S.bestStreak=Math.max(S.bestStreak,S.streak);if(used)toast('A streak freeze covered the missed day');return true}

const ROSE=[[2,1],[3,1],[5,2],[7,3],[7,4]];
function curve(stage,R=52,cx=0,cy=0){const[p,q]=ROSE[stage];const k=p/q;const T=Math.PI*q*((p*q)%2?1:2);const N=420+stage*260;let d='',len=0,px,py;for(let i=0;i<=N;i++){const t=T*i/N,r=R*Math.cos(k*t),x=cx+r*Math.cos(t),y=cy+r*Math.sin(t);d+=(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2);if(i)len+=Math.hypot(x-px,y-py);px=x;py=y}return{d,len:Math.ceil(len)}}

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Your emblem, ${STAGES[stg][1].toLowerCase()}">${inkDefs()}${pct!=null?`<circle class="ring-bg" cx="${c}" cy="${c}" r="${rr}" fill="none" stroke-width="3"/><circle class="ring-fg" cx="${c}" cy="${c}" r="${rr}" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-Math.min(1,pct))}" transform="rotate(-90 ${c} ${c})"/>`:''}<path class="curve ${opt.draw?'draw':''}" style="--len:${cv.len}" d="${cv.d}" stroke="${ink.c}" stroke-width="${opt.sw||1.25}"/></svg>`}

function renderLesson(){const L=LSN,k=L.k,n=REG[k],C=n.course,x=lxOf(k),pg=L.pages[L.page],last=L.page===L.pages.length-1;

  else if(pg.id==='ex'){const e=x.ex[pg.i],sh=L.steps[pg.i]||0,done=sh>=e.s.length;

  else if(pg.id==='check')body=checkHtml();

  focusView(`<div class="qtop lq"><div class="qtop-in"><button class="icon-btn" data-act="lclose" aria-label="Close lesson">${ic('x')}</button><div class="lsegs" role="group" aria-label="Lesson progress: ${pg.t}, ${L.page+1} of ${L.pages.length}">${segs}</div><span class="meta">${pg.t}</span>${L.thenPlay&&!last?`<button class="btn btn-ghost btn-sm lskip" data-act="lessondone" data-id="${k}">Skip to practice</button>`:''}</div></div>
   <article class="read lesson" style="--course:var(--c-${C.id})">${body}

let SW=null;document.addEventListener('touchstart',e=>{if(!LSN||e.touches.length!==1||e.target.closest('.opts,.example,textarea,input'))return;SW={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}},{passive:true});

let BZ=null;

function searchHits(q){q=q.trim().toLowerCase();if(q.length<2)return[];const out=[];for(const c of COURSES)for(const w of c.worlds)for(const n of w.nodes){const x=LX[n.key]||{};const hay=[n.name,w.title,c.name,...(x.keys||[]).map(k=>k[0]+' '+k[1])].join(' ').toLowerCase();const inName=(n.name+' '+w.title).toLowerCase().includes(q);if(inName||hay.includes(q))out.push({n,w,c,score:inName?0:1})}return out.sort((a,b)=>a.score-b.score).slice(0,20)}
function renderSearch(){const box=$('#srch');if(!box)return;const hits=searchHits(SQ);box.innerHTML=SQ.trim().length<2?'':hits.length?`<div class="group">${hits.map(({n,w,c})=>`<button class="row" data-act="node" data-id="${n.key}" style="--course:var(--c-${c.id})">${markEl(n.key)}<span class="main-t"><span class="t">${n.name}</span><span class="s">${c.name}, ${esc(w.title)}</span></span><span class="end">${ic('chev',16)}</span></button>`).join('')}</div>`:`<p class="help" style="padding:8px 2px">No topics match “${esc(SQ.trim())}”. Try a term like gcd, limit or VSEPR.</p>`;document.querySelector('.chapters')&&(document.querySelector('.chapters').hidden=SQ.trim().length>=2)}
document.addEventListener('input',e=>{if(e.target.id==='tsearch'){SQ=e.target.value;renderSearch()}if(e.target.closest&&e.target.closest('.exform')){const x=$('#exerr');if(x)x.textContent=''}});
const APP_VER='2026.11.23.2';
const WHATS_NEW=['Ask works with an API key from any provider (Anthropic, OpenAI, Gemini, OpenRouter or OpenAI-compatible): tap API key in Ask. You can also attach photos, PDFs and text files to a question','Ask: an AI tutor that answers from your own notes first. Import notes in Ask, Your notes. Tap Explain after any answer','Proof Lab in MATH 135, plus proof questions mixed into practice','Upcoming tests: add quiz and exam dates in Settings to get a countdown and focused prep','Diagrams in 14 lessons, and more question types across 11 topics','New CHEM topic: Bond Strength, plus questions on the uncertainty principle, lattice energy and real gases','Search in Courses, a Flag button on questions, and a daily calendar reminder','Bigger touch targets and clearer text on phones'];
function whatsNew(){modal(`<div class="box-h"><h2 class="t-title">What's new</h2><button class="icon-btn close" data-act="close" aria-label="Close">${ic('x')}</button></div><ul class="newlist">${WHATS_NEW.map(t=>`<li>${t}</li>`).join('')}</ul><button class="btn btn-primary btn-block" data-act="close">Got it</button>`)}

function askModal(k,q,picked,autoQ){TUT.ctx={k,q,picked};TUT.msgs=[];TUT.atts=[];modal(`<div class="box-h"><h2 class="t-title">Ask</h2><button class="icon-btn close" data-act="close" aria-label="Close">${ic('x')}</button></div>${viewAsk().replace('<div class="ask"><div class="ask-h">','<div class="ask inmodal"><div class="ask-h" hidden>')}`,true);showRoute();if(autoQ)setTimeout(()=>askSend(autoQ),50);else setTimeout(()=>{const t=$('#askin');if(t)t.focus()},60)}
function settings(confirmReset){const goals=[30,60,100,150];
  modal(`<div class="box-h"><h2 class="t-title">Settings</h2><button class="icon-btn close" data-act="close" aria-label="Close">${ic('x')}</button></div>
   <div class="field"><div><div class="lbl">Your name</div></div><input class="textin" id="nm" style="max-width:180px" value="${esc(S.name)}" aria-label="Your name"></div>
   <div class="field"><div><div class="lbl">Daily goal</div><div class="help">XP you aim for each day</div></div><div class="seg">${goals.map(g=>`<button data-act="goal" data-id="${g}" aria-pressed="${S.goal===g}" class="num">${g}</button>`).join('')}</div></div>
   <div class="field"><div><div class="lbl">Theme</div><div class="help">More in Library, Themes</div></div><div class="seg">${APPEAR.filter(a=>owns(a.id)).map(a=>`<button data-act="appear" data-id="${a.id}" data-stay="1" aria-pressed="${S.appearance===a.id}">${a.n}</button>`).join('')}</div></div>
   <div class="field"><div><div class="lbl">Focus mode</div><div class="help">Hides XP, runs and bonuses while you answer</div></div><button class="switch" role="switch" aria-checked="${!!S.focus}" data-act="tset" data-id="focus" aria-label="Focus mode"></button></div>
   <div class="field"><div><div class="lbl">Type numeric answers</div><div class="help">No options to choose from. Worth 50% more XP.</div></div><button class="switch" role="switch" aria-checked="${!!S.hard}" data-act="tset" data-id="hard" aria-label="Type numeric answers"></button></div>
   <div class="field"><div><div class="lbl">Sound</div></div><button class="switch" role="switch" aria-checked="${!S.muted}" data-act="tset" data-id="muted" aria-label="Sound"></button></div>
   <div class="field kbdrow"><div><div class="lbl">Keyboard</div><div class="help"><span class="kbd">1</span>–<span class="kbd">4</span> answer · <span class="kbd">↵</span> continue · <span class="kbd">H</span> hint · <span class="kbd">F</span> focus · <span class="kbd">Esc</span> close</div></div></div>
   <div class="field"><div><div class="lbl">AI tutor</div><div class="help">${IN_CLAUDE?'Works in Claude without a key':aiCfg()?`Connected · ${PROV[aiCfg().prov].s} (${esc(aiCfg().model)})`:'Add an API key from any provider'}</div></div><button class="btn btn-secondary btn-sm" data-act="aisettings">${!IN_CLAUDE&&aiCfg()?'Change':'Set up'}</button></div>
   <div class="field"><div><div class="lbl">Upcoming tests</div><div class="help">${upcoming().length?upcoming().map(e=>esc(e.title)).slice(0,3).join(', '):'Quizzes, midterms and finals'}</div></div><button class="btn btn-secondary btn-sm" data-act="exams">Manage</button></div>
   <div class="field"><div><div class="lbl">Flagged questions</div><div class="help">${(S.flags||[]).length?`${S.flags.length} flagged`:'Questions you marked as wrong or unclear'}</div></div><button class="btn btn-secondary btn-sm" data-act="flags">View</button></div>
   <div class="field"><div><div class="lbl">Daily reminder</div><div class="help">${window.claude&&window.claude.use?'Available in the phone app':'Adds a repeating event to your calendar'}</div></div>${window.claude&&window.claude.use?'':`<div class="xbtns"><input type="time" id="remt" class="timein" value="${S.remindAt||'19:00'}" aria-label="Reminder time"><button class="btn btn-secondary btn-sm" data-act="remind">Add</button></div>`}</div>
   <div class="field"><div><div class="lbl">Move progress</div><div class="help">Copy a code on one device, paste it on the other</div></div><div class="xbtns"><button class="btn btn-secondary btn-sm" data-act="xfer" data-id="out">Copy</button><button class="btn btn-secondary btn-sm" data-act="xfer" data-id="in">Paste</button></div></div>
   <div class="stack">${confirmReset?`<p style="margin:0 0 4px;font-size:14px">This permanently deletes your progress, history and collection.</p><button class="btn btn-danger btn-block" data-act="reset2">Delete all progress</button><button class="btn btn-ghost btn-block" data-act="settings">Cancel</button>`:`<button class="btn btn-ghost btn-block" data-act="reset" style="color:var(--bad)">Reset progress…</button>`}</div>`);
  const nm=$('#nm');if(nm)nm.addEventListener('change',()=>{const v=nm.value.trim().slice(0,24);if(v){S.name=v;save()}})}
function welcome(){modal(`<div style="display:flex;justify-content:center;margin:4px 0 12px">${emblem(120,null,{draw:true})}</div><h2 class="t-title" style="text-align:center">A calmer way to practise</h2>
  <p style="text-align:center;color:var(--ink-2);line-height:1.6;margin:10px 0 0">${(S.xp||Object.keys(S.stars||{}).length)?'Your four courses, your history and your collection are all still here.':'Your four courses are ready. Already studying in the Claude version? Settings, Move progress brings it here.'} The emblem above is yours: it\'s drawn in the ink you choose and grows more intricate as you level up.</p>
  <div class="group" style="margin-top:20px">${[['today','Today','Your daily goal, what to study next and what\'s due'],['stats','Statistics','Activity, accuracy and mastery over time'],['focus','Focus mode',matchMedia('(pointer:coarse)').matches?'Tap the focus button in a round to hide everything but the question':'Press F in a round to hide everything but the question']].map(([i,t,d])=>`<div class="row"><span class="mark">${ic(i,18)}</span><span class="main-t"><span class="t">${t}</span><span class="s">${d}</span></span></div>`).join('')}</div>
  <div class="stack"><button class="btn btn-primary btn-lg btn-block" data-act="welcome">Start studying</button></div>`)}

// ================= EVENTS =================
const RC={C:'var(--faint)',R:'#3D7BD9',E:'#8E5BD0',L:'var(--gold)'};
for(const k in RC)document.documentElement.style.setProperty('--rc-'+k,RC[k]);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.getAttribute('aria-disabled')==='true')return;const a=b.dataset.act,id=b.dataset.id;ac();
  switch(a){
  case'nav':go(id);break;
  case'course':S.course=id;save();go('courses');break;
  case'world':{const rec=REG[recommended(S.course)].world.key,w=WREG[id];S.open[id]=!(S.open[id]??(id===rec||w.i===0));save();const y=scrollY;go('courses');scrollTo(0,y);break}
  case'node':openNode(id);break;case'start':startRound(b.dataset.type||'node',id);break;case'lesson':closeModal(true);lesson(id,false);break;case'exstep':exStep();break;case'exall':exStep(true);break;case'lessondone':lessonDone(id);break;case'lnext':lgo(LSN.page+1);break;case'lprev':lgo(LSN.page-1);break;case'lgo':lgo(+id);break;case'lopt':lAnswer(b.dataset.k);break;case'lchk':lChkNext();break;case'lretry':LSN.chk=null;renderLesson();break;case'lclose':{const k=LSN&&LSN.k;LSN=null;if(k)go('courses');else go('today');break}case'sheetv':reviewSheet(id);break;case'home2':go('courses');break;case'print':print();break;
  case'wboss':{const w=WREG[id];if(!worldStarred(w)){toast('Earn a pip on every topic in this chapter to unlock its test','lock');return}modal(`<div class="box-h"><span class="mark">${ic('trophy',18)}</span><div><div class="t-label">${CREG[S.course].name}, ${esc(w.title)}</div><h2 class="t-title">Chapter test</h2></div><button class="icon-btn close" data-act="close" aria-label="Close">${ic('x')}</button></div><p style="margin:0;color:var(--ink-2);line-height:1.6">Seven mixed questions from this chapter. You can make two mistakes; a third ends the test. Passing earns an Epic reward, 60 XP and 10 gems.</p><div class="stack"><button class="btn btn-primary btn-lg btn-block" data-act="go" data-t="wboss" data-id="${id}">Begin test</button></div>`);break}
  case'final':if(!finalUnlocked(CREG[S.course])){toast('Pass three chapter tests to unlock the course exam','lock');return}startRound('final');break;
  case'review':startRound('review');break;case'sprint':startSprint();break;case'fix':startRound('fix');break;
  case'go':{const t=b.dataset.t;if(t==='node'||t==='wboss')startRound(t,id);else if(['final','review','fix'].includes(t))startRound(t);else go('today');break}
  case'close':closeModal();break;case'opt':answer(b.dataset.k);break;case'sopt':sAnswer(b.dataset.k);break;case'typed':submitTyped();break;case'cont':next();break;case'hint':useHint();break;
  case'fifty':case'shield':case'skip':usePup(a);break;case'sol':{const s=$('#sol');if(s){s.hidden=false;b.remove()}break}
  case'togglefocus':S.focus=!S.focus;save();if(RD&&!RD.locked)renderQ();toast(S.focus?'Focus mode on':'Focus mode off','focus');break;
  case'quit':modal(`<div class="box-h"><h2 class="t-title">End this round?</h2></div><p style="margin:0;color:var(--ink-2)">Answers so far still count toward mastery, but you won't get a result or reward for this round.</p><div class="stack" style="flex-direction:row;justify-content:flex-end"><button class="btn btn-secondary" data-act="close">Keep going</button><button class="btn btn-primary" data-act="home">End round</button></div>`);break;
  case'home':closeModal(true);go('today');break;
  case'openpending':openPending();break;case'collect':{addXp(+b.dataset.x||0);checkAch();checkQuests();save();if(b.dataset.more){openPending()}else{closeModal(true);if(VIEW.main)go(VIEW.name);else{const r=document.querySelector('.reward.pulse');if(r)r.remove()}}if(QUEUE.length)setTimeout(flushQueue,250);break}
  case'libtab':LIBTAB=id;go('library');break;case'card':cardModal(id);break;
  case'ink':S.ink=id;save();go('library');toast(`${INKS.find(x=>x.id===id).n} ink in use`);break;
  case'appear':S.appearance=id;applyAppearance();save();if(b.dataset.stay)settings();else go('library');break;
  case'buy':{const P={chestR:30,freeze:20,fifty:5,shield:8,skip:4}[id];if(S.gems<P)return;S.gems-=P;if(id==='freeze'){if(S.freezes>=2){S.gems+=P;return}S.freezes++}else if(id==='chestR'){S.pendingChests.push('R');save();openPending();return}else S.inv[id]++;save();go('library');toast('Added');break}
  case'level':levelModal();break;case'settings':settings();break;case'goal':S.goal=+id;save();if(VIEW.main)go(VIEW.name);settings();break;
  case'tset':S[id]=!S[id];save();settings();break;
  case'reset':settings(true);break;case'xfer':transfer(id);break;case'xcopy':xCopy();break;case'remind':addReminder();break;case'exams':EXF=null;exams();break;case'flag':flagQ();break;case'explain':{const q=RD&&RD.queue[RD.i];if(q){const w=document.querySelector('.opt.wrong');const pk=w?w.dataset.k:null;askModal(q.nk,q,pk,pk&&pk!==q.answer?'Explain this question step by step: why is the correct answer right, and where did my answer go wrong?':'Explain this question step by step, and why the correct answer is right.')}break}case'lessonask':askModal(id,null,null,null);break;case'notes':notesModal();break;case'notedel':deleteDoc(id);break;case'askclear':TUT.ctx=null;if(VIEW.main&&VIEW.name==='ask')go('ask');else{const c=document.querySelector('.ctxchip');if(c)c.remove()}break;case'asksug':askSend(b.textContent);break;case'aisettings':aiSettings();break;case'aikeysave':aiKeySave();break;case'aikeydel':aiKeyDel();break;case'aitest':aiTest();break;case'keyshow':keyShow(b);break;case'keypaste':keyPaste();break;case'attdel':attDel(id);break;case'attnote':attNote(id);break;case'flags':flags();break;case'flagcopy':xCopy();break;case'flagclear':S.flags=[];save();flags();break;case'whatsnew':whatsNew();break;case'excourse':exFormRead();EXF.course=id;EXF.worlds=[];exams();break;case'exadd':exAdd();break;case'exdel':S.exams=(S.exams||[]).filter(e=>e.id!==id);save();exams();break;case'xshare':navigator.share({title:'Margin progress',text:encState()}).then(()=>{S.lastBackup=Date.now();save();toast('Progress code shared','check')}).catch(()=>{});break;case'xcheck':{try{XFER=decState($('#xin').value);transfer('confirm')}catch(e){transfer('in',e.message.includes('Margin')||e.message.includes('code')?e.message:'That code couldn’t be read. Copy the whole thing and try again.')}break}case'ximport':{const keep=S.muted;S=merge(XFER);S.v4seen=true;XFER=null;save();applyAppearance();closeModal(true);go('today');toast('Progress imported','check');break}case'reset2':{const keep=S.muted;S=DEF();S.muted=keep;S.v4seen=true;save();closeModal(true);go('today');break}
  case'welcome':S.v4seen=true;save();closeModal(true);break;
  }});
document.addEventListener('keydown',e=>{const mOpen=$('#modal').classList.contains('show');
  if(e.key==='Escape'){if(mOpen){if(!$('#modal').dataset.locked)closeModal();return}if(RD&&!RD.done){document.querySelector('[data-act=quit]')?.click();return}if(BZ){go('today');return}if(!VIEW.main)go('today');return}
  if(mOpen)return;if(e.target.matches('input'))return;
  if($('#sheet').classList.contains('show')){if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}return}
  if(!VIEW.main&&LSN&&!RD&&!BZ){const onBtn=document.activeElement&&document.activeElement.matches('button');const pg=LSN.pages[LSN.page];
    if(pg.id==='check'&&LSN.chk&&!LSN.chk.done){const kk=/^[1-9]$/.test(e.key)?+e.key:0;if(kk&&LSN.chk.picked==null){const o=[...document.querySelectorAll('[data-act=lopt]')][kk-1];if(o)o.click();return}if(e.key==='Enter'&&LSN.chk.picked!=null&&!onBtn){e.preventDefault();lChkNext();return}}
    if(e.key==='ArrowRight'){const b=$('#lnext');if(b&&b.dataset.act==='lnext'){e.preventDefault();b.click()}return}
    if(e.key==='ArrowLeft'){if(LSN.page>0){e.preventDefault();lgo(LSN.page-1)}return}
    if(e.key==='Enter'&&!onBtn){e.preventDefault();if(pg.id==='ex'&&document.querySelector('[data-act=exstep]')){exStep();return}const b=$('#lnext');if(b)b.click();return}
    return}
  if(RD&&!RD.done&&!RD.locked){if(e.key==='h'||e.key==='H'){useHint();return}if(e.key==='f'||e.key==='F'){document.querySelector('[data-act=togglefocus]')?.click();return}}
  const k=/^[1-9]$/.test(e.key)?+e.key:{a:1,b:2,c:3,d:4}[e.key.toLowerCase()]||0;if(k&&((RD&&!RD.done&&!RD.locked)||BZ)){const sel=BZ?'[data-act=sopt]':'[data-act=opt]';const o=[...document.querySelectorAll(sel)][k-1];if(o&&!o.disabled)o.click()}});

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
ensureDaily();syncPass();applyAppearance();go('today');if(S.v4seen&&S.seenVer!==APP_VER&&(S.xp||0)>0)setTimeout(whatsNew,400);S.seenVer=APP_VER;save();if(!S.v4seen)welcome();initCloud();
