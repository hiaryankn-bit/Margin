// ---------- Chemical equation balancer (deterministic, exact arithmetic) ----------
function chemParse(f){const raw=f;f=f.replace(/\s+/g,'').replace(/\((s|l|g|aq)\)/g,'');if(/[\^+-]|\d[+-]$/.test(f))throw new Error(`Ions and charges aren't supported yet (${raw}). Use neutral formulas.`);
 const parts=f.split(/[·*.]/);const tot={};
 parts.forEach((p,pi)=>{let mult=1;const m0=p.match(/^(\d+)(?=[A-Z(\[])/);if(m0&&pi>0){mult=+m0[1];p=p.slice(m0[1].length)}
  const st=[{}];let i=0;while(i<p.length){const ch=p[i];if(ch==='('||ch==='['){st.push({});i++}else if(ch===')'||ch===']'){i++;let n='';while(/\d/.test(p[i]||''))n+=p[i++];if(st.length<2)throw new Error(`Unbalanced brackets in ${raw}`);const g=st.pop(),k=n?+n:1;for(const e in g)st[st.length-1][e]=(st[st.length-1][e]||0)+g[e]*k}
   else if(/[A-Z]/.test(ch)){let e=ch;i++;while(/[a-z]/.test(p[i]||''))e+=p[i++];if(!ELEM.has(e))throw new Error(`“${e}” isn't an element symbol (in ${raw}). Check capital letters.`);let n='';while(/\d/.test(p[i]||''))n+=p[i++];st[st.length-1][e]=(st[st.length-1][e]||0)+(n?+n:1)}
   else throw new Error(`Can't read “${ch}” in ${raw}`)}
  if(st.length!==1)throw new Error(`Unbalanced brackets in ${raw}`);for(const e in st[0])tot[e]=(tot[e]||0)+st[0][e]*mult});
 if(!Object.keys(tot).length)throw new Error(`“${raw}” has no elements`);return{el:tot}}
const ELEM=new Set('H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr'.split(' '));
const gcdN=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
function frc(n,d=1){if(d<0){n=-n;d=-d}const g=gcdN(n,d)||1;return[n/g,d/g]}
const fadd=(a,b)=>frc(a[0]*b[1]+b[0]*a[1],a[1]*b[1]),fmul=(a,b)=>frc(a[0]*b[0],a[1]*b[1]),fdiv=(a,b)=>frc(a[0]*b[1],a[1]*b[0]);
function balance(eq){const sides=eq.replace(/⟶|→|=>|->|=/g,'→').split('→');if(sides.length!==2)throw new Error('Write it as reactants → products, for example Fe + O2 → Fe2O3');
 const L=sides[0].split('+').map(s=>s.trim()).filter(Boolean),Rr=sides[1].split('+').map(s=>s.trim()).filter(Boolean);if(!L.length||!Rr.length)throw new Error('Each side needs at least one formula');
 const sp=[...L,...Rr].map(s=>s.replace(/^\d+\s*(?=[A-Z(\[])/,'').replace(/\s+/g,''));const P=sp.map(chemParse);const els=[...new Set(P.flatMap(p=>Object.keys(p.el)))];
 const M=els.map(e=>P.map((p,j)=>frc((p.el[e]||0)*(j<L.length?1:-1))));const n=sp.length;
 // row-reduce
 let r=0;const piv=[];for(let c=0;c<n&&r<M.length;c++){let k=r;while(k<M.length&&M[k][c][0]===0)k++;if(k===M.length)continue;[M[r],M[k]]=[M[k],M[r]];const pv=M[r][c];M[r]=M[r].map(x=>fdiv(x,pv));for(let i=0;i<M.length;i++)if(i!==r&&M[i][c][0]!==0){const f=M[i][c];M[i]=M[i].map((x,j)=>fadd(x,fmul([-f[0],f[1]],M[r][j])))}piv.push(c);r++}
 const free=[...Array(n).keys()].filter(c=>!piv.includes(c));if(free.length!==1)throw new Error(free.length?'This reaction can be balanced more than one way. Split it into separate reactions.':'This can’t be balanced: check the formulas.');
 const fcol=free[0];const x=Array(n).fill(null);x[fcol]=[1,1];piv.forEach((c,i)=>{x[c]=frc(-M[i][fcol][0],M[i][fcol][1])});
 const lcm=x.reduce((a,v)=>a*v[1]/gcdN(a,v[1]),1);let co=x.map(v=>v[0]*lcm/v[1]);if(co.some(v=>v<=0)){if(co.every(v=>v<0))co=co.map(v=>-v);else throw new Error('No balanced form with all positive coefficients. Check which side each species is on.')}
 const g=co.reduce((a,v)=>gcdN(a,v));co=co.map(v=>v/g);
 const check=els.every(e=>P.reduce((a,p,j)=>a+(p.el[e]||0)*co[j]*(j<L.length?1:-1),0)===0);
 const fmt=(s,c)=>`${c===1?'':c}${s.replace(/(\d+)/g,'<sub>$1</sub>')}`;
 return{html:`${sp.slice(0,L.length).map((s,j)=>fmt(s,co[j])).join(' + ')} → ${sp.slice(L.length).map((s,j)=>fmt(s,co[L.length+j])).join(' + ')}`,co,els,check,P,sp,L:L.length}}
function balancerModal(prev){modal(`<div class="box-h"><span class="mark">${ic('flask',18)}</span><div><div class="t-label">CHEM 120 tools</div><h2 class="t-title">Equation balancer</h2></div><button class="icon-btn close" data-act="close" aria-label="Close">${ic('x')}</button></div>
 <p style="margin:0;color:var(--ink-2);line-height:1.5">Type an unbalanced equation. Margin balances it with exact arithmetic and shows the atom count for each element, so you can check your own answer.</p>
 <form id="balform" class="keyrow" style="margin-top:12px"><input id="balin" class="textin" value="${esc(prev||'')}" placeholder="C3H8 + O2 -> CO2 + H2O" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Equation"><button class="btn btn-primary" type="submit">Balance</button></form><div id="balout" aria-live="polite"></div>`);
 setTimeout(()=>{const i=$('#balin');if(i)i.focus()},50)}
let BAL_LAST=null;
function balRun(){const v=($('#balin')||{}).value||'';const out=$('#balout');try{const b=balance(v);BAL_LAST=b;out.innerHTML=`<div class="balres"><div class="beq">${b.html}</div><table class="baltab"><tr><th>Element</th><th>Left</th><th>Right</th></tr>${b.els.map(e=>{const l=b.P.slice(0,b.L).reduce((a,p,j)=>a+(p.el[e]||0)*b.co[j],0),r=b.P.slice(b.L).reduce((a,p,j)=>a+(p.el[e]||0)*b.co[b.L+j],0);return`<tr><td>${e}</td><td class="num">${l}</td><td class="num">${r}</td></tr>`}).join('')}</table><p class="t-sub" style="font-size:12px">${b.check?'Checked: every element balances.':'Warning: check failed.'} Coefficients are the smallest whole numbers. States like (aq) are ignored.</p></div>${(()=>{try{b.sp.forEach(x=>molarMass(x));return stoichHtml(b)}catch(e){return''}})()}`}catch(e){out.innerHTML=`<p class="xerr">${esc(e.message)}</p>`}}

// =====================================================================
// Math engine for the workspace: parse (calculator syntax or LaTeX), evaluate,
// render to HTML and LaTeX, check that two steps agree, find roots, plot.
// No eval: everything goes through this parser.
// =====================================================================
const MX_FN={sin:Math.sin,cos:Math.cos,tan:Math.tan,sec:x=>1/Math.cos(x),csc:x=>1/Math.sin(x),cot:x=>1/Math.tan(x),asin:Math.asin,acos:Math.acos,atan:Math.atan,arcsin:Math.asin,arccos:Math.acos,arctan:Math.atan,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,ln:Math.log,log:Math.log10,exp:Math.exp,sqrt:Math.sqrt,abs:Math.abs,floor:Math.floor,ceil:Math.ceil};
const MX_CONST={pi:Math.PI,e:Math.E};
const MX_GREEK={alpha:'α',beta:'β',gamma:'γ',delta:'δ',theta:'θ',lambda:'λ',mu:'μ',sigma:'σ',omega:'ω',phi:'φ',tau:'τ',rho:'ρ'};
const MX_NAMES=Object.keys(MX_FN).concat(Object.keys(MX_GREEK),['pi']).sort((a,b)=>b.length-a.length);

// LaTeX and Unicode to calculator syntax
function mxPre(s){s=String(s);
 const grab=(str,i)=>{if(str[i]!=='{'){const m=str.slice(i).match(/^\s*(\\[a-zA-Z]+|.)/);return m?[m[1],i+m[0].length]:['',i]}let d=0,j=i;for(;j<str.length;j++){if(str[j]==='{')d++;else if(str[j]==='}'){d--;if(!d)break}}return[str.slice(i+1,j),j+1]};
 let guard=0;while(/\\[dt]?frac/.test(s)&&guard++<50){const i=s.search(/\\[dt]?frac/);const k=s.indexOf('frac',i)+4;const[a,j]=grab(s,k);const[b,l]=grab(s,j);s=s.slice(0,i)+`((${a})/(${b}))`+s.slice(l)}
 guard=0;while(/\\sqrt/.test(s)&&guard++<50){const i=s.indexOf('\\sqrt');let k=i+5,n=null;if(s[k]==='['){const c=s.indexOf(']',k);n=s.slice(k+1,c);k=c+1}const[a,j]=grab(s,k);s=s.slice(0,i)+(n?`((${a})^(1/(${n})))`:`sqrt(${a})`)+s.slice(j)}
 s=s.replace(/\\left|\\right|\\,|\\;|\\!|\\ /g,'').replace(/\\cdot|\\times/g,'*').replace(/\\div/g,'/').replace(/\\operatorname\{([a-z]+)\}/g,'$1').replace(/\\(arcsin|arccos|arctan|sinh|cosh|tanh|sin|cos|tan|sec|csc|cot|ln|log|exp|pi|alpha|beta|gamma|delta|theta|lambda|mu|sigma|omega|phi|tau|rho)\b/g,'$1 ').replace(/\\infty/g,'∞').replace(/[{]/g,'(').replace(/[}]/g,')');
 s=s.replace(/[×·∙]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\*\*/g,'^').replace(/θ/g,'theta').replace(/α/g,'alpha').replace(/β/g,'beta').replace(/λ/g,'lambda').replace(/ω/g,'omega').replace(/μ/g,'mu');
 return s}

function mxTok(s){const t=[];let i=0;while(i<s.length){const c=s[i];if(/\s/.test(c)){i++;continue}
 const n=s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);if(n){t.push({t:'n',v:+n[1],s:n[1]});i+=n[1].length;continue}
 if(/[a-zA-Z]/.test(c)){const rest=s.slice(i);const nm=MX_NAMES.find(w=>rest.startsWith(w));if(nm){t.push(MX_FN[nm]?{t:'f',v:nm}:nm==='pi'?{t:'c',v:'pi'}:{t:'v',v:nm});i+=nm.length;continue}
  let v=c;i++;const sub=s.slice(i).match(/^_\(?([a-zA-Z0-9]+)\)?/);if(sub){v+='_'+sub[1];i+=sub[0].length}t.push(v==='e'?{t:'c',v:'e'}:{t:'v',v});continue}
 if('+-*/^()|!,'.includes(c)){t.push({t:c});i++;continue}
 if(c==='≡')throw new Error('Add the modulus, like 3x ≡ 6 (mod 9)');
 if(c==='∞')throw new Error('Infinity can’t be evaluated. Use a large number instead.');

function mxParse(src){const T=mxTok(mxPre(src));let p=0,absD=0;const pk=()=>T[p],eat=t=>{if(!T[p]||T[p].t!==t)throw new Error(t===')'?'A bracket isn’t closed':`Expected “${t}”`);return T[p++]};

function triSolve(v){const D=Math.PI/180;let{a,b,c,A,B,C}=v;const known=[a,b,c].filter(x=>x>0).length,ang=[A,B,C].filter(x=>x>0).length;const sols=[];
 if(known+ang!==3)throw new Error('Enter exactly three values');if(!known)throw new Error('At least one side is needed');
 if(ang===2){if(!A)A=180-B-C;else if(!B)B=180-A-C;else C=180-A-B;if(A<=0||B<=0||C<=0)throw new Error('The angles add to 180° or more');const k=a?a/Math.sin(A*D):b?b/Math.sin(B*D):c/Math.sin(C*D);sols.push({a:k*Math.sin(A*D),b:k*Math.sin(B*D),c:k*Math.sin(C*D),A,B,C,how:'Angles add to 180°, then the law of sines'})}

  if(sides[s]>0){// SSA: known angle and its opposite side, plus one other side
   const o=['a','b','c'].find(x=>x!==s&&sides[x]>0),O=o.toUpperCase();const sinO=sides[o]*Math.sin(angs[K]*D)/sides[s];if(sinO>1+1e-12)throw new Error('No triangle has these values');
   for(const cand of[Math.asin(Math.min(1,sinO))/D,180-Math.asin(Math.min(1,sinO))/D]){const third=180-angs[K]-cand;if(third<=1e-9)continue;const T=['A','B','C'].find(x=>x!==K&&x!==O),t=T.toLowerCase();const r={...sides,...angs,[O]:cand,[T]:third};r[t]=sides[s]*Math.sin(third*D)/Math.sin(angs[K]*D);r.how='Law of sines (side-side-angle'+(sols.length?', second solution':'')+')';if(!sols.some(q=>Math.abs(q[O]-cand)<1e-6))sols.push(r)}
   if(sols.length===2)sols[0].how='Law of sines (side-side-angle: this case is ambiguous, two triangles fit)'}
  else{// SAS: angle between two sides
   const[x,y]=['a','b','c'].filter(q=>q!==s);const L=Math.sqrt(sides[x]**2+sides[y]**2-2*sides[x]*sides[y]*Math.cos(angs[K]*D));const r={...sides,...angs,[s]:L};const ac=(p,q,z)=>Math.acos((q*q+z*z-p*p)/(2*q*z))/D;r.A=r.A||ac(r.a,r.b,r.c);r.B=r.B||ac(r.b,r.a,r.c);r.C=r.C||(180-r.A-r.B);r.how='Law of cosines for the third side, then the angles';sols.push(r)}}

function edModal(){S.ed=S.ed||{dh:-50,ea:80,cat:0};const{dh,ea,cat}=S.ed;const W=320,H=220,M=24;const lo=Math.min(0,dh),hi=Math.max(ea,dh,0)+10;const Y=v=>H-M-(v-lo+10)/(hi-lo+20)*(H-2*M);const X=t=>M+t*(W-2*M);

 const e1=ea,e2=cat>Math.max(0,dh)&&cat<ea?cat:null;
 modal(`<div class="box-h"><span class="mark">${ic('flask',18)}</span><div><div class="t-label">CHEM 120 tools</div><h2 class="t-title">Reaction energy diagram</h2></div><button class="icon-btn close" data-act="close" aria-label="Close">${ic('x')}</button></div>
 <div class="fbd-set"><label>ΔH (kJ/mol)<input class="textin num" id="edh" inputmode="decimal" value="${dh}"></label><label>E<sub>a</sub> forward (kJ/mol)<input class="textin num" id="eda" inputmode="decimal" value="${ea}"></label><label>E<sub>a</sub> with catalyst<input class="textin num" id="edc" inputmode="decimal" value="${cat||''}" placeholder="optional"></label></div>
 ${ea<=Math.max(0,dh)?`<p class="xerr">E<sub>a</sub> must be higher than both the reactant and product energies (above ${Math.max(0,dh)} kJ/mol here).</p>`:`<svg viewBox="0 0 ${W} ${H}" class="plot" role="img" aria-label="Energy diagram"><line x1="${M}" x2="${M}" y1="${M}" y2="${H-M}" class="ax"/><line x1="${M}" x2="${W-M}" y1="${H-M}" y2="${H-M}" class="ax"/><text x="8" y="${M-6}" class="gt">E</text><text x="${W-M}" y="${H-6}" class="gt" text-anchor="end">reaction progress</text>
  <line x1="${X(0)}" x2="${X(.35)}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)" stroke-dasharray="3 3"/><line x1="${X(.5)}" x2="${X(1)}" y1="${Y(dh)}" y2="${Y(dh)}" stroke="var(--line-2)" stroke-dasharray="3 3"/><line x1="${X(.32)}" x2="${X(.6)}" y1="${Y(ea)}" y2="${Y(ea)}" stroke="var(--line-2)" stroke-dasharray="3 3"/>
  <path d="${curve(e1)}" fill="none" stroke="var(--c-chem)" stroke-width="2.5"/>${e2!=null?`<path d="${curve(e2)}" fill="none" stroke="var(--c-m137)" stroke-width="2" stroke-dasharray="6 4"/>`:''}
  <line x1="${X(.3)}" x2="${X(.3)}" y1="${Y(0)}" y2="${Y(ea)}" stroke="var(--ink-2)"/><text x="${X(.3)-4}" y="${(Y(0)+Y(ea))/2}" class="gt" text-anchor="end">Eₐ</text><line x1="${X(.9)}" x2="${X(.9)}" y1="${Y(0)}" y2="${Y(dh)}" stroke="var(--ink-2)"/><text x="${X(.9)+4}" y="${(Y(0)+Y(dh))/2}" class="gt">ΔH</text>
  <text x="${X(.02)}" y="${Y(0)-6}" class="gt">reactants</text><text x="${X(.98)}" y="${Y(dh)-6}" class="gt" text-anchor="end">products</text></svg>
 <div class="group"><div class="row"><span class="main-t"><span class="t">${dh<0?'Exothermic':dh>0?'Endothermic':'Thermoneutral'}</span><span class="s">${dh<0?'Products are lower in energy: heat is released':dh>0?'Products are higher in energy: heat is absorbed':'No net energy change'}</span></span></div>

function curve(stage,R=52,cx=0,cy=0){const[p,q]=ROSE[stage];const k=p/q;const T=Math.PI*q*((p*q)%2?1:2);const N=420+stage*260;let d='',len=0,px,py;for(let i=0;i<=N;i++){const t=T*i/N,r=R*Math.cos(k*t),x=cx+r*Math.cos(t),y=cy+r*Math.sin(t);d+=(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2);if(i)len+=Math.hypot(x-px,y-py);px=x;py=y}return{d,len:Math.ceil(len)}}

let BZ=null;

  const best=S.blitz[C.id]||{best:0,times:[]};BZ={c:C.id,pool:pool.map(n=>n.key),score:0,t0:Date.now(),end:Date.now()+60000,times:[],best,q:null,lock:false,wrong:0};BZ.timer=setInterval(sTick,200);sNext()}
function sNext(){let q,t=0;do{q=single(pick(BZ.pool))}while(q.sel&&t++<8);BZ.q=q;BZ.lock=false;sRender()}
function ghostAt(){return BZ.best.times?BZ.best.times.filter(t=>t<=Date.now()-BZ.t0).length:0}
function sRender(){const q=BZ.q,n=REG[q.nk];
  focusView(`<div class="qtop"><div class="qtop-in"><button class="icon-btn" data-act="home" aria-label="End sprint">${ic('x')}</button><div class="bar gold"><i id="sbar" style="width:${Math.max(0,(BZ.end-Date.now())/600)}%;transition:width .2s linear"></i></div><span class="meta num" id="stime">${Math.ceil(Math.max(0,BZ.end-Date.now())/1000)} s</span></div></div>
   <div class="qwrap" style="--course:var(--c-${BZ.c})"><div class="qmeta">${markEl(q.nk)}<span><span style="color:var(--ink);font-weight:500">${n.name}</span><br><span>Sprint</span></span><span class="tag num" style="text-align:right"><span style="font-size:22px;font-weight:600;color:var(--ink)" id="sme">${BZ.score}</span><br><span style="font-size:12px">${BZ.best.best?`your best, at this point: <span id="sg">${ghostAt()}</span>`:'first sprint'}</span></span></div>
   <div class="prompt">${q.prompt}</div><div class="opts ${q.options.length===2?'two':''} ${q.grid?'grid':''}">${q.options.map((o,i)=>`<button class="opt" data-act="sopt" data-k="${o.key}">${i<9?`<span class="kbd k">${i+1}</span>`:''}<span>${o.html}</span><span class="ic">${ic('check',18,2)}</span></button>`).join('')}</div><p class="t-label" style="margin-top:16px">Each correct answer scores a point. A wrong answer costs three seconds and is saved to your mistakes.</p></div>`)}
function sTick(){if(!BZ)return;const left=BZ.end-Date.now();const b=$('#sbar'),t=$('#stime'),g=$('#sg');if(b)b.style.width=Math.max(0,left/600)+'%';if(t)t.textContent=Math.ceil(Math.max(0,left)/1000)+' s';if(g)g.textContent=ghostAt();if(left<=5000&&left>0&&Math.floor(left/1000)!==BZ.lt){BZ.lt=Math.floor(left/1000);sfx('tick')}if(left<=0)sEnd()}
function sAnswer(k){if(!BZ||BZ.lock)return;BZ.lock=true;const q=BZ.q;const ok=k===q.answer;S.stats.ans++;srsPush(q.nk,ok);try{lpRecord(q,ok,{rt:'sprint',ms:Date.now()-(BZ.qt0||Date.now())})}catch(e){}
  document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.k===q.answer)o.classList.add('right');else if(o.dataset.k===k){o.classList.add('wrong');o.querySelector('.ic').innerHTML=ic('x',18,2)}});
  if(ok){BZ.score++;BZ.times.push(Date.now()-BZ.t0);S.stats.cor++;const d=ensureDaily();d.c[REG[q.nk].course.id]=(d.c[REG[q.nk].course.id]||0)+1;sfx('good')}else{BZ.end-=3000;BZ.wrong++;addMistake(q);sfx('bad')}
  const me=$('#sme');if(me)me.textContent=BZ.score;setTimeout(()=>{if(BZ&&Date.now()<BZ.end)sNext()},ok?260:900)}
function sEnd(){if(!BZ)return;clearInterval(BZ.timer);const C=CREG[BZ.c];const prev=BZ.best.best||0;const rec=BZ.score>prev;if(rec)S.blitz[BZ.c]={best:BZ.score,times:BZ.times};
  const d=ensureDaily();d.blitzBest=Math.max(d.blitzBest,BZ.score);d.rounds++;S.stats.rounds++;hist().ms+=60000;const streakUp=touchStreak();const xp=BZ.score*4+10;addXp(xp);const chest=rec&&BZ.score>0?rollChest('R'):BZ.score>=5?rollChest():null;if(chest)S.pendingChests.push(chest);checkQuests();checkAch();save();const sc=BZ.score,w=BZ.wrong;BZ=null;RD={done:true,type:'sprint'};
  focusView(`<div class="qtop"><div class="qtop-in"><button class="icon-btn" data-act="home" aria-label="Close">${ic('x')}</button></div></div><div class="read"><div class="result-h"><h1 class="t-title">${rec?'New personal best':'Time’s up'}</h1><p class="t-sub">${C.name} sprint</p><div class="score num">${sc}</div><p class="muted">${rec&&prev?`Previous best: ${prev}`:prev?`Your best is ${prev}`:'Your first sprint is your baseline.'}</p></div>
   <div class="kpis" style="margin-top:24px;grid-template-columns:repeat(3,1fr)"><div><div class="t-label">XP earned</div><div class="num" style="font-size:22px;font-weight:600;margin-top:4px;color:var(--gold)">+${xp}</div></div><div><div class="t-label">Mistakes</div><div class="num" style="font-size:22px;font-weight:600;margin-top:4px">${w}</div></div><div><div class="t-label">Streak</div><div class="num" style="font-size:22px;font-weight:600;margin-top:4px">${S.streak} days</div></div></div>
   ${chest?`<div class="sec" style="margin-top:20px"><button class="reward pulse" data-act="openpending"><span class="seal" style="--rc:var(--rc-${chest})">${ic('seal',20)}</span><span class="main-t"><span class="t" style="font-weight:500;display:block">${RAR[chest].n} reward earned</span><span class="muted" style="font-size:13px">Open it now, or later from Today.</span></span>${ic('chev')}</button></div>`:''}
   <div class="endbar"><button class="btn btn-secondary btn-lg" data-act="home">Back to Today</button><button class="btn btn-primary btn-lg" data-act="sprint">Sprint again</button></div></div>`);
