/* ===== Installed app (iPhone safe areas) ===== */
html{-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body:before{content:'';position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--bg);z-index:35;pointer-events:none}
.qtop{top:env(safe-area-inset-top)}
body.focus .toasts{top:calc(16px + env(safe-area-inset-top))}
button,a,.opt{touch-action:manipulation}
input,textarea,select{font-size:16px}

/* ===== Tokens ===== */
:root{
  --bg:#F5F5F2;--surface:#FFFFFF;--surface-2:#EEEEEA;--surface-3:#E6E5E0;--line:#E2E1DC;--line-2:#D3D2CC;
  --ink:#16171A;--ink-2:#45464B;--muted:#65666C;--faint:#A3A4A8;
  --primary:#16171A;--on-primary:#FFFFFF;
  --gold:#B8850F;--gold-soft:#F6EDD6;--gold-line:#E3C77F;
  --good:#1C7C51;--good-soft:#E6F2EB;--bad:#BE3B2A;--bad-soft:#F8E7E3;
  --c-m135:#3D63C9;--c-m137:#C9502F;--c-chem:#1D8A66;--c-phys:#B97A10;--course:var(--c-m135);
  --r-sm:6px;--r:10px;--r-lg:14px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --shadow-pop:0 1px 2px rgba(20,20,25,.06),0 12px 32px rgba(20,20,25,.12);
  --ease:cubic-bezier(.2,.7,.2,1);--dur:180ms;
  --math:'STIX Two Text','Times New Roman',serif;
  color-scheme:light}
:root[data-theme="graphite"]{--bg:#111214;--surface:#191A1D;--surface-2:#202124;--surface-3:#28292D;--line:#2A2B2F;--line-2:#3A3B40;--ink:#ECECE8;--ink-2:#BDBEC2;--muted:#8D8E94;--faint:#606167;--primary:#ECECE8;--on-primary:#111214;--gold:#E1AE45;--gold-soft:#2C2413;--gold-line:#6B5422;--good:#45B985;--good-soft:#14281F;--bad:#EC6B57;--bad-soft:#2E1A16;--c-m135:#7C9BF0;--c-m137:#F0805F;--c-chem:#4CC59B;--c-phys:#E2A640;--shadow-pop:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.5);color-scheme:dark}
:root[data-theme="midnight"]{--bg:#0D1117;--surface:#141A23;--surface-2:#1A212C;--surface-3:#222A36;--line:#232B37;--line-2:#323C4A;--ink:#E6EAF0;--ink-2:#B4BCC8;--muted:#8691A1;--faint:#5A6575;--primary:#E6EAF0;--on-primary:#0D1117;--gold:#E2B04B;--gold-soft:#2A2414;--gold-line:#6E5624;--good:#4BBE8A;--good-soft:#132A21;--bad:#EE705C;--bad-soft:#2E1B18;--c-m135:#86A6F5;--c-m137:#F28B6B;--c-chem:#55CBA2;--c-phys:#E5AB48;--shadow-pop:0 16px 40px rgba(0,0,0,.55);color-scheme:dark}
:root[data-theme="chalk"]{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F2F2F2;--surface-3:#E8E8E8;--line:#DADADA;--line-2:#C4C4C4;--ink:#000000;--ink-2:#262626;--muted:#595959;--faint:#8C8C8C;--gold:#8A6100;--good:#0F6B3F;--bad:#A12A1C}
:root[data-theme="fog"]{--bg:#ECEEF0;--surface:#F8F9FA;--surface-2:#E3E6E9;--surface-3:#D9DDE1;--line:#D5D9DE;--line-2:#C3C8CE;--ink:#1B2026;--ink-2:#434A53;--muted:#5A626C;--faint:#9AA1A9}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Geist,ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--r-sm)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.cl,.m{font-family:var(--math);font-size:1.08em;white-space:nowrap}
sup,sub{font-size:.7em;line-height:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Shell ===== */
.shell{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:232px;flex:none;border-right:1px solid var(--line);padding:var(--s5) var(--s3) var(--s4);display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 var(--s2) var(--s5);font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand svg{flex:none}
.nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r);color:var(--ink-2);font-weight:500;font-size:14px;transition:background var(--dur) var(--ease),color var(--dur)}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav .ico{color:var(--muted)}.nav[aria-current="page"] .ico{color:var(--ink)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.side .foot{margin-top:auto;padding:var(--s3) 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.meter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.meter b{font-weight:600;color:var(--ink)}
.main{flex:1;min-width:0;overflow-x:clip}
.page{max-width:760px;margin:0 auto;padding:var(--s6) var(--s5) 120px;animation:pagein 220ms var(--ease) both}
@keyframes pagein{from{opacity:0;transform:translateY(4px)}}
.tabbar{display:none}
@media (max-width:899px){
  .side{display:none}
  .page{padding:var(--s5) var(--s4) 110px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:500;color:var(--muted);border-radius:var(--r)}
  .tab[aria-current="page"]{color:var(--ink)}
}
body.focus .side,body.focus .tabbar{display:none}

/* ===== Type ===== */
.t-title{font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-.02em;margin:0}
.t-sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.t-sec{font-size:14px;font-weight:600;margin:0;letter-spacing:-.005em}
.t-label{font-size:12px;color:var(--muted);font-weight:500}
.t-big{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.sec{margin-top:var(--s6)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.sec-h .link{font-size:13px;color:var(--muted);font-weight:500}
.sec-h .link:hover{color:var(--ink)}

/* ===== Components ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--r);font-weight:500;font-size:14.5px;letter-spacing:-.005em;transition:transform 120ms var(--ease),background var(--dur),opacity var(--dur);white-space:nowrap;user-select:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{color:var(--ink-2)}.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--bad);color:#fff}
.btn-lg{height:48px;font-size:15px;padding:0 22px}
.btn-block{width:100%}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-2);transition:background var(--dur)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;font-size:11px;font-weight:500;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface)}
.group{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;align-items:center;gap:var(--s3);padding:12px var(--s4);min-height:56px;width:100%;transition:background var(--dur)}
.row+.row{border-top:1px solid var(--line)}
button.row:hover,a.row:hover{background:var(--surface-2)}
.group>.row:first-child{border-radius:var(--r-lg) var(--r-lg) 0 0}.group>.row:last-child{border-radius:0 0 var(--r-lg) var(--r-lg)}.group>.row:only-child{border-radius:var(--r-lg)}
.row .main-t,.reward .main-t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.row .t{font-weight:500;font-size:14.5px;line-height:1.35}
.row .s{font-size:13px;color:var(--muted);line-height:1.35;margin-top:1px}
.row .end{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;flex:none}
.chev{color:var(--faint)}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.due{background:var(--ink);color:var(--bg)}
.due-t{color:var(--ink);font-weight:500}
.dotc{width:8px;height:8px;border-radius:50%;background:var(--course);flex:none}
.bar{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width 600ms var(--ease)}
.bar.gold>i{background:var(--gold)}.bar.course>i{background:var(--course)}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:3px;background:var(--surface-2);border-radius:var(--r);gap:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap;height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);transition:background var(--dur),color var(--dur)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 0 0 1px var(--line)}
.seg.full{display:flex}.seg.full button{flex:1 0 auto}
.mark .mg{display:inline-block;white-space:nowrap}.mark sup,.mark sub{font-size:.62em;line-height:0}
.mark{flex:none;width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;font-family:var(--math);font-size:17px;line-height:1;background:var(--surface-2);color:var(--ink);letter-spacing:-.01em;overflow:hidden;white-space:nowrap;position:relative}
.mark.sm{font-size:13px}.mark.xs{font-size:11px}
.mark .stripe{position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--course)}
.pips{display:inline-flex;gap:3px}.pips i{width:6px;height:6px;border-radius:50%;background:var(--surface-3)}.pips i.on{background:var(--gold)}
.lock{color:var(--faint)}
.empty{padding:var(--s5) var(--s4);color:var(--muted);font-size:14px;text-align:center}

/* ===== Today ===== */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:var(--s6);align-items:center;margin-top:var(--s5);padding:var(--s5);background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line)}
.emblem{width:168px;height:168px;position:relative;cursor:pointer}
.emblem svg{display:block}
.emblem .ring-bg{stroke:var(--surface-3)}.emblem .ring-fg{stroke:var(--gold);transition:stroke-dashoffset 900ms var(--ease)}
.curve{fill:none;stroke-linecap:round;stroke-linejoin:round}
.curve.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1600ms var(--ease) 120ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero .stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4) var(--s5)}
.kv .k{font-size:12px;color:var(--muted);font-weight:500}
.kv .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kv .v small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.hero .cta{grid-column:1/-1;display:flex;gap:var(--s2);flex-wrap:wrap}
.hero .cta .btn-primary{flex:1;min-width:220px;justify-content:space-between}
.cta-t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:0}
.cta-t small{font-size:12px;opacity:.65;font-weight:400;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:620px){.hero{grid-template-columns:1fr;justify-items:center;gap:var(--s5);padding:var(--s5) var(--s4)}.hero .stats{width:100%}.hero .cta{width:100%;flex-direction:column}.hero .cta .btn{width:100%;min-width:0;flex:none}.hero .cta .btn-secondary{justify-content:center}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:84px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .col{width:100%;max-width:28px;border-radius:4px;background:var(--surface-3);min-height:3px;transition:height 600ms var(--ease)}
.week .col.on{background:var(--ink)}.week .col.today{background:var(--gold)}
.week .lbl{font-size:12px;color:var(--muted)}

/* ===== Courses ===== */
.course-h{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);margin:var(--s5) 0 var(--s5)}
.chapter{margin-top:var(--s2)}
.chapter:has(.group){margin-bottom:var(--s4)}
.chapter-h{display:flex;align-items:center;gap:var(--s3);width:100%;padding:6px 2px 10px}
.chapter-h .n{font-size:12px;color:var(--muted);font-weight:500;width:46px;flex:none;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chapter-h .t{flex:1;font-weight:600;font-size:14.5px;letter-spacing:-.005em}
.chapter-h .p{font-size:12.5px;color:var(--muted)}
.chapter-h svg{color:var(--faint);transition:transform var(--dur) var(--ease)}
.chapter-h[aria-expanded="false"] svg{transform:rotate(-90deg)}
.mastery{width:72px}
.mastery .bar{margin-top:5px}
.mastery .pct{font-size:12px;color:var(--muted);text-align:right}

/* ===== Stats ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.kpis>div{background:var(--surface);padding:var(--s4)}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}.kpis .t-big{font-size:24px!important}.kpis .t-big small{font-size:14px;color:var(--muted);font-weight:500}}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--surface-3)}
.heat i.l1{background:color-mix(in srgb,var(--gold) 30%,var(--surface-3))}.heat i.l2{background:color-mix(in srgb,var(--gold) 60%,var(--surface-3))}.heat i.l3{background:var(--gold)}.heat i.today{box-shadow:0 0 0 1.5px var(--ink)}
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;align-items:end;height:120px}
.chart .c{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:0;position:relative}
.chart .c i{display:block;border-radius:3px 3px 0 0;background:var(--surface-3);min-height:2px}
.chart .c i.ok{background:var(--ink)}
.chart-x{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;margin-top:6px;font-size:12px;color:var(--muted);text-align:center}
.legend{display:flex;gap:var(--s4);font-size:12px;color:var(--muted);margin-top:var(--s3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}

/* ===== Library ===== */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:var(--s3)}
@media (max-width:620px){.tiles{gap:var(--s2)}.el .sym{font-size:28px}}

.opt:nth-child(2){animation-delay:30ms}.opt:nth-child(3){animation-delay:60ms}.opt:nth-child(4){animation-delay:90ms}.opt:nth-child(n+5){animation-delay:120ms}

/* feedback sheet */

}

<body>
<div class="shell"><nav class="side" id="side" aria-label="Primary"></nav><main class="main" id="app" tabindex="-1"></main></div>
<nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
<div class="sheet" id="sheet" role="region" aria-live="polite"><div class="in" id="sheetIn"></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
// ===== math helpers =====
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mod=(a,m)=>((a%m)+m)%m;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
function egcd(a,b){if(b===0)return[a,1,0];const[g,x,y]=egcd(b,a%b);return[g,y,x-Math.floor(a/b)*y]}
function inv(a,m){a=mod(a,m);if(m===1)return 0;const[g,x]=egcd(a,m);return g===1?mod(x,m):null}
function powmod(b,e,m){let r=1%m;b=mod(b,m);while(e>0){if(e&1)r=r*b%m;b=b*b%m;e=Math.floor(e/2)}return r}

// ===== html helpers =====
const C=x=>`<span class="cl">[${x}]</span>`;
const Z=m=>`ℤ<sub>${m}</sub>`;
const MOD=m=>`(mod ${m})`;
const P=(b,e)=>`${b}<sup>${e}</sup>`;
const INV=x=>`${C(x)}<sup>−1</sup>`;
const pm=k=>k<0?`− ${-k}`:`+ ${k}`;
const par=x=>x<0?`(${x})`:`${x}`;

function buildOptions(correctKey,correctHtml,cands,fill){
  const seen=new Set([String(correctKey)]);const out=[{key:String(correctKey),html:correctHtml}];
  for(const c of cands){if(out.length>=4)break;if(!c)continue;const[k,h]=c;if(k==null||seen.has(String(k)))continue;seen.add(String(k));out.push({key:String(k),html:h})}
  let g=0;while(out.length<4&&g++<300){const[k,h]=fill();if(seen.has(String(k)))continue;seen.add(String(k));out.push({key:String(k),html:h})}
  return shuffle(out);
}
const numOpts=(ans,m,cands,fmt)=>buildOptions(ans,fmt(ans),cands.filter(v=>v!=null&&v>=0&&v<m).map(v=>[v,fmt(v)]),()=>{const v=R(0,m-1);return[v,fmt(v)]});

// x^s mod p with shown work
function powWork(r,s,p){
  if(s===0)return `${P(r,0)} = 1`;
  if(s===1)return `${P(r,1)} = ${r}`;
  if(s<=6){const parts=[];let v=1;for(let k=1;k<=s;k++){v=v*r%p;parts.push(`${P(r,k)} ≡ ${v}`)}return parts.join(', ')}
  const sq=[];let v=r%p,k=1;while(k<=s){sq.push([k,v]);v=v*v%p;k*=2}
  const used=sq.filter(([k])=>s&k);
  const ans=powmod(r,s,p);
  return `squaring: ${sq.map(([k,v])=>`${P(r,k)} ≡ ${v}`).join(', ')}. Since ${s} = ${used.map(([k])=>k).reverse().join(' + ')}, ${P(r,s)} ≡ ${used.map(([,v])=>v).reverse().join('·')} ≡ ${ans}`;
}


// ===== extra helpers & question builders =====
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const sq=x=>`√<span class="ovl">${x}</span>`;
const LIM=(v,a)=>`lim<sub>${v}→${a}</sub>`;
const eq=s=>`<span class="cl">${s}</span>`;
const sub=(b,s)=>`${b}<sub>${s}</sub>`;
const uniq=a=>[...new Set(a)];
const round=(x,d=0)=>{const p=10**d;return Math.round(x*p)/p};
const minus=s=>String(s).replace(/-/g,'−');
// number → string with sig figs, ×10^n for very big/small
function sig(x,s=3){
  if(!isFinite(x))return String(x);if(x===0)return '0';
  const a=Math.abs(x),e=Math.floor(Math.log10(a));
  if(e>=5||e<=-4){const m=x/10**e;let ms=m.toPrecision(s);if(Math.abs(parseFloat(ms))>=10){return sig(x*1.0000001,s)}return `${minus(ms)}×10<sup>${minus(e)}</sup>`}
  let t=x.toPrecision(s);if(t.includes('e'))t=Number(t).toString();return minus(t);
}
const nz=x=>Math.abs(x)<1e-12?0:x;
// simplify fraction
function frac(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;return{n,d}}
function frs(n,d){const f=frac(n,d);if(f.d===1)return minus(f.n);return (f.n<0?'−':'')+fr(Math.abs(f.n),f.d)}
function frt(n,d){const f=frac(n,d);if(f.d===1)return minus(f.n);return minus(`${f.n}/${f.d}`)}

// Multiple choice. correct + wrong are HTML strings; dedupe by text.
function mc(prompt,correct,wrong,steps,hint,extra={}){
  const seen=new Set([String(correct)]);const opts=[{key:'o0',html:String(correct)}];let k=1;
  for(const w of wrong){if(opts.length>=(extra.n||4))break;const s=String(w);if(seen.has(s))continue;seen.add(s);opts.push({key:'o'+(k++),html:s})}
  return{prompt,options:extra.keep?opts:shuffle(opts),answer:'o0',steps:steps||[],hint:hint||'',...extra};
}
// True/false
function tf(prompt,t,expl,hint){return{prompt:`<div class="tf">True or false?</div>${prompt}`,options:[{key:'T',html:'True'},{key:'F',html:'False'}],answer:t?'T':'F',steps:[`<b>${t?'True':'False'}.</b> ${expl}`],hint:hint||'Check the hypotheses carefully, or look for a counterexample.'}}
// Numeric: MC with formatted numbers + typed in hard mode. o: {wrong:[], fmt, tol (relative), abs, unit, pre, post, int}
function nq(prompt,value,o={}){
  const fmt=o.fmt||(v=>o.int?minus(String(Math.round(v))):sig(v,o.s||3));
  const unit=o.unit?` ${o.unit}`:'';
  const right=fmt(value)+unit;const seen=new Set([right]);const opts=[{key:'o0',html:right}];let k=1;
  const cand=[...(o.wrong||[])];
  const facs=o.int?[1,-1,2,-2,3,5]:[2,0.5,1.5,0.75,1.25,0.8,3,-1];
  for(const f of facs)cand.push(o.int?value+f*(o.step||1):value*f);
  for(const w of cand){if(opts.length>=4)break;if(w==null||!isFinite(w))continue;if(o.pos&&w<=0)continue;if(o.nonneg&&w<0)continue;const s=fmt(w)+unit;if(seen.has(s))continue;seen.add(s);opts.push({key:'o'+(k++),html:s})}
  const tol=o.int?0:(o.tol??0.02);
  return{prompt,options:shuffle(opts),answer:'o0',steps:o.steps||[],hint:o.hint||'',num:{value,tol,abs:o.abs,int:!!o.int,mod:o.mod,pre:o.pre||'',post:(o.post||'')+(o.unit?' '+o.unit:''),show:right}};
}
// Find the wrong line in an argument
function errq(title,lines,bad,expl,hint){
  const box=`<div class="proof">${lines.map((l,i)=>`<div><b>${i+1}.</b> ${l}</div>`).join('')}</div>`;
  const opts=lines.map((_,i)=>({key:'L'+i,html:`Line ${i+1}`}));
  return{prompt:`<div class="tf">Find the error</div>${title}${box}<div class="sub">Which line is the <b>first</b> one that's wrong?</div>`,options:opts,answer:'L'+bad,steps:[`<b>Line ${bad+1}</b> is wrong. ${expl}`],hint:hint||'Check each line: does it really follow from the lines before it?',grid:true};
}
// Multi-part problem: shared stem, a sequence of parts
function multi(stem,parts){return{multi:parts.map((p,i)=>({...p,prompt:`<div class="stem">${stem}</div><div class="part">Part ${'abcdefg'[i]})</div>${p.prompt}`,partOf:[i+1,parts.length]}))}}
// Bank: items {q,a,w:[...],e,h} | {q,t,e} | {err:[lines],bad,q,e}; avoids recent repeats
function bank(items){const recent=[];return()=>{let i,g=0;do{i=Math.floor(Math.random()*items.length)}while(recent.includes(i)&&g++<20);recent.push(i);if(recent.length>Math.min(4,items.length-1))recent.shift();
  const it=items[i];if(typeof it==='function')return it();
  if(it.err)return errq(it.q||'',it.err,it.bad,it.e,it.h);
  if('t' in it)return tf(it.q,it.t,it.e,it.h);
  return mc(it.q,it.a,it.w,[it.e],it.h)}}
const mix=(...gs)=>()=>pick(gs)();

// ===== 8.6 Warm-up =====
function genWarm(){
  const v=pick(['add','mul','neg','rep','expr']);const m=R(5,15);
  const fmt=x=>C(x);
  if(v==='add'||v==='mul'||v==='expr'){
    let a,b,c=0,raw,shown,rawExpr;
    if(v==='add'){a=R(-2*m,3*m);b=R(2,3*m);raw=a+b;shown=`${C(a)} + ${C(b)}`;rawExpr=`${a} + ${b}`}
    else if(v==='mul'){a=R(-m,2*m);b=R(2,2*m);if(a===0)a=m+1;raw=a*b;shown=`${C(a)}${C(b)}`;rawExpr=`${par(a)}·${b}`}
    else{a=R(2,2*m);b=R(2,2*m);c=R(-m,2*m);raw=a*b+c;shown=`${C(a)}${C(b)} ${c<0?'−':'+'} ${C(Math.abs(c))}`;rawExpr=`${a}·${b} ${pm(c)}`}
    const ans=mod(raw,m),q=Math.floor(raw/m);
    return{prompt:`In ${Z(m)}, compute ${shown}.<div class="sub">Give the representative from 0 to ${m-1}.</div>`,
      options:numOpts(ans,m,[mod(ans+1,m),mod(-ans,m),Math.abs(raw)%m,mod(ans-1,m)],fmt),answer:String(ans),
      num:{value:ans,mod:m,pre:'[',post:']'},
      hint:`Do the integer arithmetic first, then reduce mod ${m} (add or subtract ${m}s until you land in 0…${m-1}).`,
      steps:[`By definition of ${Z(m)} arithmetic: ${shown} = ${C(rawExpr)} = ${C(raw)}.`,`${raw} = ${m}·${par(q)} + ${ans}, so ${raw} ≡ ${ans} ${MOD(m)}.`,`Answer: ${C(ans)}.`]};
  }
  if(v==='neg'){
    let a=R(1,3*m);if(a%m===0)a++;const ans=mod(-a,m);
    return{prompt:`What is the additive inverse of ${C(a)} in ${Z(m)}?<div class="sub">Representative from 0 to ${m-1}.</div>`,
      options:numOpts(ans,m,[a%m,mod(ans+1,m),mod(m-a,m+1)],fmt),answer:String(ans),num:{value:ans,mod:m,pre:'[',post:']'},
      hint:`The additive inverse is ${C('−a')}: the class that adds to ${C(0)}.`,
      steps:[`The additive inverse of ${C(a)} is ${C(-a)}.`,`${-a} ≡ ${ans} ${MOD(m)}, so it's ${C(ans)}.`,`Check: ${C(a)} + ${C(ans)} = ${C(a+ans)} = ${C(0)} since ${m} | ${a+ans} ✓`]};
  }
  // rep
  const a=R(0,m-1),k=pick([-2,-1,2,3]);const val=a+k*m;
  const bad=[a+k*(m+1),a+k*(m-1),val+1,a-k*m+1,a+m+2].filter(x=>mod(x,m)!==a);
  return{prompt:`Which of these is equal to ${C(a)} in ${Z(m)}?`,
    options:buildOptions(val,C(val),bad.map(x=>[x,C(x)]),()=>{let x=R(-3*m,4*m);if(mod(x,m)===a)x++;return[x,C(x)]}),answer:String(val),

// ===== 8.6 Inverses =====

// ===== 8.6 MAT =====
const setKey=a=>a.length?a.join(','):'none';

// ===== 8.6 Systems =====

  steps.push(`Sub into eq. 1: ${C(a1)}${C('x')} = ${C(c1)} − ${C(b1)}${C(Y)} = ${C(F)}. ${a1===1?`So ${C('x')} = ${C(X)}.`:`${INV(a1)} = ${C(ai)}, so ${C('x')} = ${C(ai)}${C(F)} = ${C(X)}.`}`);

    options:buildOptions(key(X,Y),html(X,Y),[[key(Y,X),html(Y,X)],[key(X,mod(-Y,p)),html(X,mod(-Y,p))],[key(mod(X+1,p),Y),html(mod(X+1,p),Y)]],()=>{const x=R(0,p-1),y=R(0,p-1);return[key(x,y),html(x,y)]}),
    answer:key(X,Y),hint:`Eliminate one variable like normal algebra. You can't divide in ${Z('p')}: multiply by an inverse instead.`,steps};

// ===== 8.7 Fermat =====

// ===== 8.7 Polynomial congruences =====

    options:buildOptions(solKey(sols),html(sols),cands.map(a=>[solKey(a),html(a)]),fill),answer:solKey(sols),
    hint:`Reduce coefficients mod ${p}, then use x<sup>${p}</sup> ≡ x to knock ${p-1} off each exponent at a time. Then test x = 0…${p-1}.`,
    steps:[`By Corollary 15, x<sup>${p}</sup> ≡ x ${MOD(p)} for <i>every</i> integer x, so x<sup>e</sup> ≡ x<sup>e−${p-1}</sup>: reduce exponents until they're in 1…${p-1}.`,
      `${show(c1,e1)} ≡ ${show(c1%p,re(e1))} (since ${c1} ≡ ${c1%p} and ${tl(e1)}).`,

function toFrac(x,maxD=2000){if(!isFinite(x))return null;const s=Math.sign(x);x=Math.abs(x);let h1=1,h0=0,k1=0,k0=1,b=x;for(let i=0;i<25;i++){const a=Math.floor(b);[h1,h0]=[a*h1+h0,h1];[k1,k0]=[a*k1+k0,k1];if(k1>maxD)return null;if(Math.abs(x-h1/k1)<1e-9)return{n:s*h1,d:k1};b=1/(b-a);if(!isFinite(b))break}return Math.abs(x-h1/k1)<1e-9?{n:s*h1,d:k1}:null}

const AM={H:1.008,He:4.003,Li:6.94,Be:9.012,B:10.81,C:12.01,N:14.01,O:16.00,F:19.00,Ne:20.18,Na:22.99,Mg:24.31,Al:26.98,Si:28.09,P:30.97,S:32.06,Cl:35.45,Ar:39.95,K:39.10,Ca:40.08,Mn:54.94,Fe:55.85,Cu:63.55,Zn:65.38,Br:79.90,Ag:107.87,I:126.90,Ba:137.33,Pb:207.2};
function parseF(f){const st=[{}];let i=0;while(i<f.length){const ch=f[i];if(ch==='('){st.push({});i++}else if(ch===')'){i++;let n='';while(/\d/.test(f[i]||''))n+=f[i++];const t=st.pop(),m=+n||1;for(const k in t)st[st.length-1][k]=(st[st.length-1][k]||0)+t[k]*m}else{let el=ch;i++;while(/[a-z]/.test(f[i]||''))el+=f[i++];let n='';while(/\d/.test(f[i]||''))n+=f[i++];st[st.length-1][el]=(st[st.length-1][el]||0)+(+n||1)}}return st[0]}
const MM=f=>{const c=parseF(f);let m=0;for(const k in c)m+=AM[k]*c[k];return m};
const CF=f=>f.replace(/(\d+)/g,'<sub>$1</sub>');

function gMole(){const f=pick(COMP),M=MM(f);const v=R(0,3);
  if(v===0){const g=round(R(5,250)+Math.random(),1),n=g/M;return nq(`How many moles are in ${g} g of ${CF(f)}?`,n,{s:3,unit:'mol',wrong:[g*M,M/g,n*2],steps:[`M(${CF(f)}) = ${sig(M,5)} g/mol.`,`n = m/M = ${g}/${sig(M,5)} = ${sig(n,3)} mol.`],hint:'n = m / M.'})}
  if(v===1){const n=round(R(1,40)/10,2),m=n*M;return nq(`What is the mass of ${n} mol of ${CF(f)}?`,m,{s:3,unit:'g',wrong:[n/M,M,m/2],steps:[`M = ${sig(M,5)} g/mol.`,`m = nM = ${n}·${sig(M,5)} = ${sig(m,3)} g.`]})}
  if(v===2){const g=R(5,100),N=g/M*NA;return nq(`How many molecules (formula units) are in ${g} g of ${CF(f)}?`,N,{s:3,wrong:[g*NA,N*10,g/M],steps:[`n = ${g}/${sig(M,5)} = ${sig(g/M,4)} mol.`,`N = n·N<sub>A</sub> = ${sig(N,3)}.`]})}
  const c=parseF(f),els=Object.keys(c).filter(e=>e!=='H'||Object.keys(c).length<3);const el=pick(Object.keys(c));const pct=AM[el]*c[el]/M*100;
  return nq(`What is the mass percent of ${el} in ${CF(f)}?`,pct,{s:3,unit:'%',wrong:[AM[el]/M*100,c[el]/Object.values(c).reduce((a,b)=>a+b,0)*100,100-pct],pos:true,steps:[`Mass of ${el} per mole: ${c[el]}·${AM[el]} = ${sig(AM[el]*c[el],5)} g.`,`÷ M = ${sig(M,5)} g/mol, ×100 = ${sig(pct,3)}%.`],hint:'(mass of element in 1 mol) / (molar mass) × 100.'});}
function gBalance(){if(Math.random()<.65){const x=R(1,8),y=2*R(1,x+1);let a=1,o2=x+y/4,co2=x,h2o=y/2;let k=1;while(!Number.isInteger(o2*k)||!Number.isInteger(h2o*k))k++;a*=k;o2*=k;co2*=k;h2o*=k;
    const f=`C${x>1?x:''}H${y}`;const ask=pick(['O2','H2O','CO2']);const val={O2:o2,H2O:h2o,CO2:co2}[ask];
    return nq(`Balance with the smallest whole numbers:<div class="sys">__ ${CF(f)} + __ O₂ → __ CO₂ + __ H₂O</div>What is the coefficient of <b>${CF(ask)}</b>?`,val,{int:true,pos:true,wrong:[val+1,val-1,val*2,x+y],steps:[`Balance C: ${x} CO₂ per ${CF(f)}. Balance H: ${y/2} H₂O.`,`O needed: 2·${x} + ${y/2} = ${2*x+y/2} atoms ⇒ ${o2/k} O₂.`,k>1?`Multiply everything by ${k} to clear fractions: ${a} ${CF(f)} + ${o2} O₂ → ${co2} CO₂ + ${h2o} H₂O.`:`${a} ${CF(f)} + ${o2} O₂ → ${co2} CO₂ + ${h2o} H₂O.`],hint:'Balance C, then H, then O last (O₂ can take fractions; clear them at the end).'});}
  return bank([{q:'Balance: __ Al + __ O₂ → __ Al₂O₃. Coefficient of O₂?',a:'3',w:['2','4','6'],e:'4 Al + 3 O₂ → 2 Al₂O₃.'},{q:'Balance: __ Fe₂O₃ + __ CO → __ Fe + __ CO₂. Coefficient of CO?',a:'3',w:['1','2','4'],e:'Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂.'},{q:'Balance: __ NH₃ + __ O₂ → __ NO + __ H₂O. Coefficient of O₂?',a:'5',w:['4','6','3'],e:'4 NH₃ + 5 O₂ → 4 NO + 6 H₂O.'},{q:'Balance: __ C₂H₅OH + __ O₂ → __ CO₂ + __ H₂O. Coefficient of O₂?',a:'3',w:['2','7/2','6'],e:'C₂H₅OH + 3 O₂ → 2 CO₂ + 3 H₂O (remember the O already in ethanol).'},{q:'Balance: __ KClO₃ → __ KCl + __ O₂. Coefficient of O₂?',a:'3',w:['2','1','6'],e:'2 KClO₃ → 2 KCl + 3 O₂.'}])();}
const RXN=[{r:[[2,'H2'],[1,'O2']],p:[2,'H2O'],s:'2 H₂ + O₂ → 2 H₂O'},{r:[[1,'N2'],[3,'H2']],p:[2,'NH3'],s:'N₂ + 3 H₂ → 2 NH₃'},{r:[[1,'CH4'],[2,'O2']],p:[1,'CO2'],s:'CH₄ + 2 O₂ → CO₂ + 2 H₂O'},{r:[[1,'Fe2O3'],[3,'CO']],p:[2,'Fe'],s:'Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂'},{r:[[2,'Al'],[3,'Cl2']],p:[2,'AlCl3'],s:'2 Al + 3 Cl₂ → 2 AlCl₃'},{r:[[1,'C3H8'],[5,'O2']],p:[3,'CO2'],s:'C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O'}];
function gLimiting(){const X=pick(RXN);const[[ca,A],[cb,B]]=X.r;const[cp,Pf]=X.p;const mA=round(R(10,120)+Math.random(),1),mB=round(R(10,120)+Math.random(),1);
  const nA=mA/MM(A),nB=mB/MM(B);const limA=nA/ca<nB/cb;const lim=limA?A:B;const nP=(limA?nA/ca:nB/cb)*cp;const mP=nP*MM(Pf);const act=round(mP*(R(55,95)/100),1);const py=act/mP*100;
  return multi(`${X.s}<br>You react <b>${mA} g ${CF(A)}</b> with <b>${mB} g ${CF(B)}</b>.`,[
   mc('Which reactant is limiting?',CF(lim),[CF(limA?B:A),'Neither (exact ratio)','Whichever has less mass'],[`n(${CF(A)}) = ${sig(nA,3)} mol, n(${CF(B)}) = ${sig(nB,3)} mol.`,`Divide by coefficients: ${sig(nA/ca,3)} vs ${sig(nB/cb,3)}. The smaller one, <b>${CF(lim)}</b>, is limiting.`],'Compare moles ÷ coefficient, not grams.',{keep:true}),
   nq(`Theoretical yield of ${CF(Pf)} (g)?`,mP,{s:3,unit:'g',wrong:[(limA?nB/cb:nA/ca)*cp*MM(Pf),mP*ca,mA+mB],steps:[`n(${CF(Pf)}) = ${sig(limA?nA:nB,3)} mol ${CF(lim)} × ${cp}/${limA?ca:cb} = ${sig(nP,3)} mol.`,`m = ${sig(nP,3)} × ${sig(MM(Pf),5)} = ${sig(mP,3)} g.`]}),
   nq(`If ${act} g of ${CF(Pf)} is actually collected, what is the percent yield?`,py,{s:3,unit:'%',wrong:[mP/act*100,act/(mA+mB)*100,100-py],steps:[`% yield = actual/theoretical × 100 = ${act}/${sig(mP,4)} × 100 = ${sig(py,3)}%.`]})]);}

const GREEN=[{r:[[1,'C2H4'],[1,'H2O']],d:[1,'C2H5OH'],s:'C₂H₄ + H₂O → C₂H₅OH'},{r:[[1,'CaCO3']],d:[1,'CaO'],s:'CaCO₃ → CaO + CO₂',dn:'CaO'},{r:[[2,'NaCl'],[1,'H2SO4']],d:[2,'HCl'],s:'2 NaCl + H₂SO₄ → Na₂SO₄ + 2 HCl',dn:'HCl'},{r:[[1,'C6H12O6']],d:[2,'C2H5OH'],s:'C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂',dn:'C₂H₅OH'},{r:[[1,'Fe2O3'],[3,'CO']],d:[2,'Fe'],s:'Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂',dn:'Fe'},{r:[[1,'CH4'],[1,'H2O']],d:[3,'H2'],s:'CH₄ + H₂O → CO + 3 H₂',dn:'H₂'},{r:[[1,'N2'],[3,'H2']],d:[2,'NH3'],s:'N₂ + 3 H₂ → 2 NH₃'}];

  if(v<.5){const X=pick(GREEN);const top=X.d[0]*MM(X.d[1]),bot=X.r.reduce((s,[c,f])=>s+c*MM(f),0);const ae=top/bot*100;
    return nq(`Calculate the % atom economy for making ${X.dn||CF(X.d[1])}:<div class="sys">${X.s}</div>`,ae,{s:3,unit:'%',tol:.01,wrong:[MM(X.d[1])/bot*100,100-ae||50,top/MM(X.r[0][1])*100],steps:[`% AE = (stoichiometric mass of desired product) / (total stoichiometric mass of reactants) × 100.`,`= ${X.d[0]}·${sig(MM(X.d[1]),4)} / ${sig(bot,5)} × 100 = ${sig(ae,3)}%.`,ae>99.9?'Every reactant atom ends up in the product: an addition reaction.':''],hint:'Use coefficients × molar masses.'});}

function gLight(){const v=R(0,3);const lam=R(120,900);const lm=lam*1e-9;const nu=cL/lm,E=hP*nu;
  if(v===0)return nq(`What is the frequency of light with λ = ${lam} nm?`,nu,{s:3,unit:'s⁻¹',wrong:[cL/lam,lm/cL,nu*1e-9],steps:['c = λν ⇒ ν = c/λ.',`ν = (2.998×10⁸ m/s)/(${lam}×10⁻⁹ m) = ${sig(nu,3)} s⁻¹.`],hint:'Convert nm to m first.'});
  if(v===1)return nq(`What is the energy of ONE photon with λ = ${lam} nm?`,E,{s:3,unit:'J',wrong:[hP*cL/lam,E*NA,hP/lm],steps:['E = hν = hc/λ.',`E = (6.626×10⁻³⁴)(2.998×10⁸)/(${lam}×10⁻⁹) = ${sig(E,3)} J.`]});
  if(v===2)return nq(`What is the energy of one MOLE of photons with λ = ${lam} nm (in kJ/mol)?`,E*NA/1000,{s:3,unit:'kJ/mol',wrong:[E*NA,E/1000,E*NA/1e6],steps:[`Per photon: ${sig(E,3)} J.`,`× N<sub>A</sub> = ${sig(E*NA,3)} J/mol = ${sig(E*NA/1000,3)} kJ/mol.`]});
  const phi=round(R(30,70)/10,1)*1e-19;const lam2=R(150,Math.floor(hP*cL/phi*1e9)-10);const KE=hP*cL/(lam2*1e-9)-phi;
  return nq(`A metal has work function Φ = ${sig(phi,2)} J. Light of λ = ${lam2} nm hits it. Max kinetic energy of the ejected electrons?`,KE,{s:3,unit:'J',wrong:[hP*cL/(lam2*1e-9),phi,hP*cL/(lam2*1e-9)+phi],pos:true,steps:['Photoelectric effect: E<sub>k</sub> = hν − Φ.',`hν = hc/λ = ${sig(hP*cL/(lam2*1e-9),3)} J.`,`E<sub>k</sub> = ${sig(hP*cL/(lam2*1e-9),3)} − ${sig(phi,2)} = ${sig(KE,3)} J.`]});}

  if(v===1){const h=round(R(5,50)/10,1);const sh=pick([['solid sphere',2/5],['solid cylinder (disk)',1/2],['hoop (thin ring)',1],['hollow sphere',2/3]]);const vv=Math.sqrt(2*G*h/(1+sh[1]));

function pLab(){const v=R(0,2);
  if(v===0){const L_=round(R(40,150)/100,2),dL=pick([.001,.002,.005]),T=2*Math.PI*Math.sqrt(L_/G);const Tm=round(T,3),dT=pick([.005,.01,.02]);const g=4*Math.PI**2*L_/(Tm*Tm);const dg=g*Math.sqrt((dL/L_)**2+(2*dT/Tm)**2);
    return nq(`Pendulum lab: L = ${L_} ± ${dL} m, T = ${Tm} ± ${dT} s. With g = 4π²L/T², what is the uncertainty δg?`,dg,{s:2,tol:.05,unit:'m/s²',wrong:[g*Math.sqrt((dL/L_)**2+(dT/Tm)**2),g*(dL/L_+2*dT/Tm)*2,g*dT/Tm],steps:[`g = 4π²(${L_})/(${Tm})² = ${sig(g,4)} m/s².`,'Products/powers: add RELATIVE uncertainties in quadrature, power 2 doubles T\'s relative uncertainty.',`δg/g = √((${dL}/${L_})² + (2·${dT}/${Tm})²) = ${sig(dg/g,3)}.`,`δg = ${sig(dg,2)} m/s².`],hint:'δg/g = √((δL/L)² + (2δT/T)²).'});}
  if(v===1){let a;do{a=round(9.6+Math.random()*.5,2)}while(Math.abs(a-9.81)<.005);const da=round(R(2,15)/100,2),b=9.81,db=.01;const t=Math.abs(a-b)/Math.sqrt(da*da+db*db);
    return nq(`Your measured g = ${a} ± ${da} m/s². Accepted g = ${b} ± ${db} m/s². Compute t′ = |a − b|/√(δa² + δb²).`,t,{s:2,tol:.05,wrong:[Math.abs(a-b)/(da+db),Math.abs(a-b)/da/10,Math.abs(a-b)],nonneg:true,steps:[`t′ = |${a} − ${b}|/√(${da}² + ${db}²) = ${sig(Math.abs(a-b),2)}/${sig(Math.sqrt(da*da+db*db),2)} = ${sig(t,2)}.`,t<1?'t′ &lt; 1: the values agree within uncertainty.':t>3?'t′ &gt; 3: the values disagree.':'1 ≤ t′ ≤ 3: inconclusive (that\'s the usual guideline, but check your lab manual\'s exact wording).']});}
  const x=R(20,90),dx=R(1,4),y=R(10,60),dy=R(1,3);const q=x*y;const dq=q*Math.sqrt((dx/x)**2+(dy/y)**2);const isProd=Math.random()<.5;
  if(isProd)return nq(`q = xy with x = ${x} ± ${dx} and y = ${y} ± ${dy} (independent). δq?`,dq,{s:2,tol:.05,wrong:[dx+dy,dx*dy,q*(dx/x+dy/y)*1.6],steps:[`q = ${q}.`,`δq/q = √((${dx}/${x})² + (${dy}/${y})²) = ${sig(dq/q,3)}.`,`δq = ${sig(dq,2)}.`]});
  const s=x+y,ds=Math.sqrt(dx*dx+dy*dy);return nq(`s = x + y with x = ${x} ± ${dx} and y = ${y} ± ${dy} (independent). δs?`,ds,{s:2,tol:.05,wrong:[dx+dy,s*(dx/x+dy/y),dx*dy],steps:['Sums/differences: add ABSOLUTE uncertainties in quadrature.',`δs = √(${dx}² + ${dy}²) = ${sig(ds,2)}.`]});}

// ===== MATH 135 proof practice =====
// Each proof: lines [{t, why}] and bad lines [{t, err}] (a tempting wrong line and why it fails).
// proofQ turns one proof into 4 parts: next line, justification, find the bad line, why it is wrong.
const PF={};
const pf=(k,thm,lines,bad)=>{(PF[k]=PF[k]||[]).push({thm,lines:lines.map(([t,why])=>({t,why})),bad:bad.map(([t,err])=>({t,err}))})};

pf('m135_div','Prove: if a | b and b | c, then a | c.',[
 ['Assume a | b and b | c.','Assumption'],
 ['Then b = ka and c = ℓb for some integers k and ℓ.','Definition of divisibility'],
 ['Substituting, c = ℓ(ka) = (ℓk)a.','Algebra'],
 ['ℓk is an integer, since integers are closed under multiplication.','Closure of ℤ'],
 ['Therefore a | c.','Definition of divisibility']],[
 ['Then b = ka and c = kb for some integer k.','It reuses k for two different integers, which secretly assumes the two multipliers are equal.'],
 ['So c/a = ℓk, which is an integer.','It divides by a, which might be 0, and divisibility is defined without division.'],
 ['Since a | c, write c = ma for some integer m.','It uses the conclusion a | c as a step, so the argument is circular.']]);

pf('m135_div','Prove: if a | b and a | c, then a | (3b − 2c).',[
 ['Assume a | b and a | c.','Assumption'],
 ['Then b = ka and c = ℓa for some integers k and ℓ.','Definition of divisibility'],
 ['3b − 2c = 3ka − 2ℓa = (3k − 2ℓ)a.','Algebra'],
 ['3k − 2ℓ is an integer.','Closure of ℤ'],
 ['Therefore a | (3b − 2c).','Definition of divisibility']],[
 ['Then b = ka and c = ka for some integer k.','Using one k for both forces b = c, which is not given.'],
 ['Since a | (3b − 2c), write 3b − 2c = ma.','That assumes the conclusion.'],
 ['So 3b − 2c = (3k + 2ℓ)a.','The algebra is wrong: −2ℓa gives −2ℓ, not +2ℓ.']]);

pf('m135_method','Prove: if n² is even, then n is even.',[
 ['We prove the contrapositive: if n is odd, then n² is odd.','Contrapositive'],
 ['Assume n is odd, so n = 2k + 1 for some integer k.','Definition of odd'],
 ['Then n² = 4k² + 4k + 1 = 2(2k² + 2k) + 1.','Algebra'],
 ['2k² + 2k is an integer, so n² is odd.','Definition of odd'],
 ['By the contrapositive, if n² is even then n is even.','Contrapositive']],[
 ['We prove the converse: if n is even, then n² is even.','The converse is a different statement, so proving it proves nothing here.'],
 ['Assume n² is even, so n² = 2k and n = √(2k), which is even.','√(2k) need not be an integer, let alone even.'],
 ['Then n² = 2k + 1 as well.','It reuses k from n = 2k + 1, which is false (try n = 3).']]);

pf('m135_ind','Prove: 1 + 2 + ⋯ + n = n(n + 1)/2 for all n ≥ 1.',[
 ['Base case n = 1: the left side is 1 and the right side is 1(2)/2 = 1.','Base case'],
 ['Assume 1 + 2 + ⋯ + k = k(k + 1)/2 for some k ≥ 1.','Inductive hypothesis'],
 ['Then 1 + ⋯ + k + (k + 1) = k(k + 1)/2 + (k + 1).','Inductive hypothesis'],
 ['= (k + 1)(k + 2)/2.','Algebra'],
 ['By the Principle of Mathematical Induction, the formula holds for all n ≥ 1.','POMI']],[
 ['Assume 1 + 2 + ⋯ + n = n(n + 1)/2 for all n ≥ 1.','That assumes the whole statement. The hypothesis is for one arbitrary k.'],
 ['Checking n = 2 and n = 3 also works, so it holds for all n.','Examples never prove a ∀ statement.'],
 ['So the sum up to k + 1 is (k + 1)(k + 2)/2, as required.','It states the goal without deriving it from the hypothesis.']]);

pf('m135_ind','Prove: 3 | (4ⁿ − 1) for all n ≥ 0.',[
 ['Base case n = 0: 4⁰ − 1 = 0, and 3 | 0.','Base case'],
 ['Assume 3 | (4ᵏ − 1) for some k ≥ 0, so 4ᵏ − 1 = 3m for some integer m.','Inductive hypothesis'],
 ['Then 4ᵏ⁺¹ − 1 = 4·4ᵏ − 1 = 4(3m + 1) − 1.','Inductive hypothesis'],
 ['= 12m + 3 = 3(4m + 1).','Algebra'],
 ['So 3 | (4ᵏ⁺¹ − 1), and by POMI the statement holds for all n ≥ 0.','POMI']],[
 ['Then 4ᵏ⁺¹ − 1 = 4(4ᵏ − 1), so 3 divides it.','4(4ᵏ − 1) = 4ᵏ⁺¹ − 4, not 4ᵏ⁺¹ − 1.'],
 ['Assume 3 | (4ⁿ − 1) for every n ≥ 0.','That assumes the conclusion instead of one case k.'],
 ['Since 3 | (4ᵏ⁺¹ − 1), we get 3 | (4ᵏ − 1).','This runs backwards: the step must go from k to k + 1.']]);

pf('m135_setlogic','Prove: A ∩ B ⊆ A ∪ B.',[
 ['Let x ∈ A ∩ B be arbitrary.','Definition of ⊆'],
 ['Then x ∈ A and x ∈ B.','Definition of ∩'],
 ['In particular, x ∈ A.','Logic'],
 ['So x ∈ A or x ∈ B, which means x ∈ A ∪ B.','Definition of ∪'],
 ['Since x was arbitrary, A ∩ B ⊆ A ∪ B.','Definition of ⊆']],[
 ['Let x = 1, which is in A ∩ B.','A specific element proves nothing about every element.'],
 ['Then x ∈ A or x ∈ B, so x ∈ A ∩ B.','"Or" does not give membership in the intersection.'],
 ['Therefore A ∪ B ⊆ A ∩ B.','That is the reverse inclusion, which is false in general.']]);

pf('m135_gcdprops','Prove: if gcd(a, b) = 1 and a | bc, then a | c.',[
 ['Assume gcd(a, b) = 1 and a | bc.','Assumption'],
 ['There are integers x, y with ax + by = 1.','Bézout\'s Lemma'],
 ['Multiplying by c: a(cx) + (bc)y = c.','Algebra'],
 ['a | a and a | bc, so a divides a(cx) + (bc)y.','DIC'],
 ['That combination equals c, so a | c.','Algebra']],[
 ['Since a | bc, a | b or a | c.','That is PAD, which needs a to be prime (6 | 4·9 but 6 ∤ 4 and 6 ∤ 9).'],
 ['Dividing ax + by = 1 by a gives x + by/a = 1/a.','Division leaves the integers, and a could be 0.'],
 ['Since gcd(a, b) = 1, a = 1.','Coprime does not mean a = 1 (gcd(4, 9) = 1).']]);

pf('m135_gcdprops','Prove: gcd(a, a + 1) = 1 for every integer a.',[
 ['Let x = −1 and y = 1.','Choice of witnesses'],
 ['Then a·x + (a + 1)·y = −a + a + 1 = 1.','Algebra'],
 ['So there are integers x, y with ax + (a + 1)y = 1.','Logic'],
 ['By CCT, gcd(a, a + 1) = 1.','CCT']],[
 ['By Bézout\'s Lemma, ax + (a + 1)y = 1 means gcd(a, a + 1) = 1.','Bézout goes the other way. Reaching 1 needs CCT (or GCD CT).'],
 ['a and a + 1 are both prime, so their gcd is 1.','Most consecutive integers are not both prime (8 and 9).'],
 ['So gcd(a, a + 1) = (a + 1) − a.','A difference is not automatically the gcd.']]);

pf('m135_cong','Prove: if a ≡ b (mod m), then a² ≡ b² (mod m).',[
 ['Assume a ≡ b (mod m), so m | (a − b).','Definition of congruence'],
 ['Then a − b = km for some integer k.','Definition of divisibility'],
 ['a² − b² = (a − b)(a + b) = km(a + b).','Algebra'],
 ['k(a + b) is an integer, so m | (a² − b²).','Definition of divisibility'],
 ['Therefore a² ≡ b² (mod m).','Definition of congruence']],[
 ['a² − b² = (a − b)², so m | (a² − b²).','(a − b)² = a² − 2ab + b², not a² − b².'],
 ['Since a ≡ b, a = b, so a² = b².','Congruent numbers need not be equal (2 ≡ 7 mod 5).'],
 ['Divide both sides of a ≡ b by a to get 1 ≡ b/a.','Division is not allowed in congruences without an inverse.']]);

pf('m135_cong','Prove: n² ≡ 0 or 1 (mod 4) for every integer n.',[
 ['Every integer n is even or odd.','Cases (parity)'],
 ['Case 1: n = 2k. Then n² = 4k² ≡ 0 (mod 4).','Algebra'],
 ['Case 2: n = 2k + 1. Then n² = 4k² + 4k + 1 ≡ 1 (mod 4).','Algebra'],
 ['The cases cover every integer, so n² ≡ 0 or 1 (mod 4).','Cases (parity)']],[
 ['Checking n = 1, 2, 3 gives 1, 0, 1, so it holds for all n.','Examples cannot prove a statement about every integer.'],
 ['Case 1: n = 2k. Then n² = 2k² ≡ 0 (mod 4).','(2k)² = 4k², not 2k², and 2k² need not be divisible by 4.'],
 ['Case 2: n = 2k + 1. Then n² = 4k² + 1.','The middle term 4k is missing from (2k + 1)².']]);

pf('m135_inv','Prove: in ℤₘ, if [a] has an inverse, it is unique.',[
 ['Suppose [b] and [c] are both inverses of [a].','Assumption'],
 ['Then [a][b] = [1] and [a][c] = [1].','Definition of inverse'],
 ['[b] = [b][1] = [b]([a][c]).','Algebra'],
 ['= ([b][a])[c] = [1][c] = [c].','Associativity and commutativity'],
 ['So [b] = [c]: the inverse is unique.','Conclusion']],[
 ['Since [a][b] = [1], [b] = [1]/[a].','Division is not defined in ℤₘ.'],
 ['Then b = 1/a and c = 1/a, so b = c.','1/a is not an integer, and classes are not fractions.'],
 ['Then [a][b] = [1], so [b] = [1].','Only [a] = [1] would give that.']]);

pf('m135_flt','Prove: if p is prime and p ∤ a, then a^(2(p−1)) ≡ 1 (mod p).',[
 ['p is prime and p ∤ a.','Assumption'],
 ['a^(p−1) ≡ 1 (mod p).','FℓT'],
 ['Squaring both sides: (a^(p−1))² ≡ 1² (mod p).','PC (powers)'],
 ['So a^(2(p−1)) ≡ 1 (mod p).','Exponent rules']],[
 ['By FℓT, aᵖ ≡ 1 (mod p).','FℓT gives a^(p−1) ≡ 1; aᵖ ≡ a.'],
 ['Reducing the exponent mod p, 2(p − 1) ≡ −2, so a^(2(p−1)) ≡ a⁻².','Exponents reduce mod p − 1, never mod p.'],
 ['Since p ∤ a, a ≡ 1 (mod p).','p ∤ a only means a ≢ 0.']]);

pf('m135_cstd','Prove: z·z̄ = |z|² for every z ∈ ℂ.',[
 ['Write z = x + yi with x, y ∈ ℝ.','Standard form'],
 ['Then z̄ = x − yi.','Definition of conjugate'],
 ['z·z̄ = (x + yi)(x − yi) = x² − y²i².','Algebra'],
 ['= x² + y², since i² = −1.','i² = −1'],
 ['= |z|², by the definition of modulus.','Definition of modulus']],[
 ['Then z̄ = −x + yi.','The conjugate flips the sign of the imaginary part, not the real part.'],
 ['z·z̄ = x² − y².','i² = −1 turns −y²i² into +y².'],
 ['Write z = x + yi with x, y ∈ ℂ.','x and y must be real for standard form.']]);

pf('m135_cpoly','Prove: if p(x) has real coefficients and p(z) = 0, then p(z̄) = 0.',[
 ['Write p(x) = aₙxⁿ + ⋯ + a₁x + a₀ with every aₖ ∈ ℝ.','Assumption'],

// Reasons offered as distractors for the "what justifies" part.
const PF_REASONS=['Assumption','Definition of divisibility','Algebra','Closure of ℤ','DIC','TD','Bézout\'s Lemma','CCT','GCD CT','PAD','Inductive hypothesis','Base case','POMI','Contrapositive','Definition of odd','Definition of congruence','PC (powers)','FℓT','Definition of ⊆','Definition of ∩','Definition of ∪','Logic','Definition of conjugate','Definition of modulus','i² = −1','Definition of inverse','Associativity and commutativity','Cases (parity)','PCJ (conjugates of sums, products, powers)','Conjugate of a real number','Exponent rules','Standard form'];

function proofQ(P){const L=P.lines,n=L.length,num=(arr)=>`<ol class="pf">${arr.map(l=>`<li>${l}</li>`).join('')}</ol>`;const parts=[];
 // a) next line
 const k=1+Math.floor(Math.random()*(n-2));const b1=pick(P.bad);const later=L.slice(k+1).map(l=>l.t);
 parts.push(mc(`<div class="pf-l">Proof so far</div>${num(L.slice(0,k).map(l=>l.t))}Which line comes next?`,L[k].t,[b1.t,...(later.length?[pick(later)]:[]),...P.bad.filter(b=>b!==b1).map(b=>b.t)],
  [`Next is line ${k+1}: ${L[k].t} (${L[k].why}).`,`Not “${b1.t}”: ${b1.err}`],'What does the last line give you, and what does the goal still need?'));
 // b) justification
 const js=L.map((l,i)=>i).filter(i=>!/^(Assumption|Conclusion)$/.test(L[i].why));const j=pick(js);const others=shuffle(PF_REASONS.filter(r=>r!==L[j].why&&!L.some(l=>l.why===r))).slice(0,3);
 parts.push(mc(`${num(L.map(l=>l.t))}What justifies line ${j+1}?`,L[j].why,others,[`Line ${j+1} follows from ${L[j].why}.`],'Name the definition or theorem the line uses.'));
 // c) find the bad line, d) why it fails
 const f=1+Math.floor(Math.random()*(n-1));const b2=pick(P.bad);const shown=L.map((l,i)=>i===f?b2.t:l.t);const nums=shuffle(L.map((_,i)=>i).filter(i=>i!==f)).slice(0,3);
 parts.push(mc(`${num(shown)}One line is wrong. Which one?`,`Line ${f+1}`,nums.map(i=>`Line ${i+1}`),[`Line ${f+1} is wrong. It should be: ${L[f].t}`],'Check each line against only the lines above it.',{keep:false}));
 const errs=shuffle(P.bad.filter(b=>b!==b2).map(b=>b.err).concat(['Nothing is wrong with it; another line is the problem.']));
 parts.push(mc(`Line ${f+1} said: “${b2.t}”. Why is it wrong?`,b2.err,errs,[b2.err]));
 return multi(`<b>${P.thm}</b>`,parts)}

 if(v<.4){const r=pick(RX);const sb=r.br.reduce((s,[b,n])=>s+n*BE[b],0),sf=r.fm.reduce((s,[b,n])=>s+n*BE[b],0),dH=sb-sf;const fmt=a=>a.map(([b,n])=>`${n} × ${b} (${BE[b]})`).join(' + ');

// ---------- Proofs ----------
X('m135_div',{

X('m135_rec',{

X('m135_ind',{

X('m135_divalg',{

 idea:['For any integer a and positive integer b, there are unique integers q and r with a = qb + r and 0 ≤ r &lt; b. q is the quotient and r is the remainder.','The remainder is never negative. For negative a, round the quotient down, so −17 = (−4)(5) + 3, not (−3)(5) − 2.'],

X('m135_gcd',{

 keys:[['GCD WR','a = qb + r ⇒ gcd(a, b) = gcd(b, r)'],['gcd(a, 0)','|a|'],['Coprime','gcd(a, b) = 1'],['Signs','gcd(a, b) = gcd(|a|, |b|)']],

X('m135_eea',{
 why:'The EEA is how you actually solve Diophantine equations, find inverses and run RSA.',
 idea:['Bézout\'s Lemma: gcd(a, b) = ax + by for some integers x, y. The Extended Euclidean Algorithm finds such x and y alongside the gcd.','Keep a table with columns x, y, r, q. Start with rows (1, 0, a) and (0, 1, b). Each new row is (row two up) − q·(row one up), where q is the quotient of the two remainders above. Stop when r = 0; the row just above gives gcd = ax + by.'],
 keys:[['Bézout (BL)','∃x, y ∈ ℤ, ax + by = gcd(a, b)'],['Starting rows','(1, 0, a) and (0, 1, b)'],['New row','Rᵢ = Rᵢ₋₂ − qᵢ·Rᵢ₋₁'],['Check','always verify ax + by = d at the end']],
 ex:[{q:'Find x, y with 56x + 15y = gcd(56, 15).',s:['Rows: (1, 0, 56), (0, 1, 15).','q = 3: (1, −3, 11).','q = 1: (−1, 4, 4).','q = 2: (3, −11, 3).','q = 1: (−4, 15, 1). Next q = 3 gives r = 0, so gcd = 1.'],a:'56(−4) + 15(15) = −224 + 225 = 1.'}],

X('m135_inv',{
 why:'Inverses are how you "divide" in ℤₘ.',
 idea:['[a] has an inverse [a]⁻¹ when [a][b] = [1]. INV ℤₘ: [a] has an inverse exactly when gcd(a, m) = 1.','To find it, solve ax + my = 1 with the EEA. Then [a]⁻¹ = [x]. For small m, you can also test values.'],
 keys:[['INV ℤₘ','[a]⁻¹ exists ⇔ gcd(a, m) = 1'],['Find it','EEA: ax + my = 1 ⇒ [a]⁻¹ = [x]'],['ℤₚ, p prime','every non-zero class is invertible'],['Zero divisors','classes with gcd(a, m) &gt; 1 have no inverse']],
 ex:[{q:'Find [11]⁻¹ in ℤ₂₆.',s:['gcd(11, 26) = 1, so it exists.','EEA: 26 = 2·11 + 4, 11 = 2·4 + 3, 4 = 3 + 1.','Back-substitute: 1 = 4 − 3 = 3·4 − 11 = 3·26 − 7·11.','So 11·(−7) ≡ 1, and −7 ≡ 19.'],a:'[11]⁻¹ = [19]. Check: 11·19 = 209 = 8·26 + 1. ✓'}],
 traps:['Giving a negative representative without reducing.','Claiming an inverse exists when gcd ≠ 1.']});

X('m135_mat',{
 why:'Multi-step ℤₘ problems combine the rules into one calculation, the way exam questions do.',
 idea:['Treat equations in ℤₘ like ordinary algebra. Collect terms, then multiply by the inverse of the coefficient. Only "divide" when an inverse exists.','Reduce at every step to keep numbers small, and check the final answer by substituting it back.'],
 keys:[['Solve [a][x] = [c]','[x] = [a]⁻¹[c] when gcd(a, m) = 1'],['Squares','[x]² = [c]: test every class (m is small)'],['Reduce often','keep representatives between 0 and m − 1']],
 ex:[{q:'Solve [4][x] + [3] = [1] in ℤ₉.',s:['[4][x] = [1] − [3] = [−2] = [7].','[4]⁻¹ = [7] because 28 ≡ 1 (mod 9).','[x] = [7][7] = [49] = [4].'],a:'[x] = [4]. Check: 16 + 3 = 19 ≡ 1. ✓'}],
 traps:['Subtracting incorrectly when moving terms across.','Dividing when gcd(a, m) ≠ 1, where there may be 0 or several solutions.']});

X('m135_sys',{
 why:'Systems in ℤₘ use the same elimination you know from linear algebra.',
 idea:['Solve by substitution or elimination, multiplying by inverses instead of dividing. In ℤₚ with p prime, every non-zero coefficient has an inverse, so elimination always works.','When m isn\'t prime, a coefficient might not be invertible. Then look for another way to eliminate, or test values.'],
 keys:[['Elimination','scale an equation so the coefficients match, then subtract'],['Substitution','isolate a variable using an inverse'],['Check','substitute into both equations']],
 ex:[{q:'In ℤ₇: [2]x + [3]y = [1] and x + y = [2].',s:['From the second equation, x = [2] − y.','Substitute: [2]([2] − y) + [3]y = [1], so [4] + y = [1].','y = [−3] = [4], and x = [2] − [4] = [5].'],a:'x = [5], y = [4]. Check: 10 + 12 = 22 ≡ 1. ✓'}],
 traps:['Checking only one equation.']});

// ---------- FLT ----------
X('m135_flt',{
 why:'FℓT makes enormous powers easy, and it is the engine behind RSA.',
 idea:['Fermat\'s Little Theorem: if p is prime and p ∤ a, then a^(p−1) ≡ 1 (mod p).','To compute a^N mod p: reduce the base mod p, write N = q(p − 1) + r, and then a^N ≡ (a^(p−1))^q · a^r ≡ a^r. So the exponent reduces mod p − 1, not mod p.'],
 keys:[['FℓT','p prime, p ∤ a ⇒ a^(p−1) ≡ 1 (mod p)'],['Corollary','a^p ≡ a (mod p) for every integer a'],['Exponents','reduce mod p − 1'],['Hypotheses','state "p is prime and p ∤ a" each time']],
 ex:[{q:'Find 3¹⁰⁰ mod 13.',s:['13 is prime and 13 ∤ 3, so 3¹² ≡ 1 (mod 13).','100 = 8·12 + 4, so 3¹⁰⁰ ≡ 3⁴.','3⁴ = 81 = 6·13 + 3.'],a:'3¹⁰⁰ ≡ 3 (mod 13).'}],
 traps:['Reducing the exponent mod p instead of p − 1.','Using FℓT with a composite modulus.','Forgetting p ∤ a. If p | a, then a^N ≡ 0.']});

X('m135_poly',{
 why:'Polynomial congruences mod a prime become a finite search once FℓT shrinks the powers.',
 idea:['To solve f(x) ≡ 0 (mod p): reduce the coefficients mod p, use xᵖ ≡ x (true for every x) to knock exponents down, then test every x from 0 to p − 1.','Since p is small in these problems, testing is fast and complete.'],
 keys:[['Corollary of FℓT','xᵖ ≡ x (mod p) for all x'],['Lower exponents','x^(k) ≡ x^(k − (p − 1)) for x ≢ 0; check x = 0 separately'],['Then','test x = 0, 1, …, p − 1']],
 ex:[{q:'Solve x¹⁰ + x ≡ 2 (mod 5).',s:['Test x = 0: 0 ≢ 2.','For x ≢ 0: x⁴ ≡ 1, so x¹⁰ = x⁸·x² ≡ x².','Need x² + x ≡ 2. Test x = 1: 2 ✓. x = 2: 6 ≡ 1. x = 3: 12 ≡ 2 ✓. x = 4: 20 ≡ 0.'],a:'x ≡ 1 or 3 (mod 5).'}],
 traps:['Forgetting x ≡ 0, where x^(p−1) ≡ 1 fails.','Reducing coefficients mod p − 1. Coefficients reduce mod p, exponents mod p − 1.']});

X('m135_trap',{
 why:'These questions test whether you check hypotheses, which is where most marks are lost.',
 idea:['Before using any theorem, check its hypotheses. FℓT needs p prime and p ∤ a. Inverses need gcd(a, m) = 1. CRT needs coprime moduli. CD needs gcd(c, m) = 1 to cancel c.','Also check the answer\'s modulus. CRT gives a unique answer mod m₁m₂, not m₁ + m₂.'],
 keys:[['FℓT','p prime and p ∤ a'],['INV ℤₘ','gcd(a, m) = 1'],['CRT','gcd(m₁, m₂) = 1, answer mod m₁m₂'],['CD','gcd(c, m) = 1 to cancel c'],['LCT','gcd(a, m) | c to be solvable']],
 ex:[{q:'Is 2⁸ ≡ 1 (mod 9) by FℓT?',s:['9 isn\'t prime, so FℓT doesn\'t apply.','Compute directly: 2⁶ = 64 ≡ 1 (mod 9), so 2⁸ ≡ 2² = 4.'],a:'No. 2⁸ ≡ 4 (mod 9).'}],
 traps:['Applying a theorem because the numbers "look right".']});

// ---------- CRT ----------
X('m135_crt2',{
 why:'CRT combines information about remainders mod different numbers into one answer.',
 idea:['If gcd(m₁, m₂) = 1, the system n ≡ a₁ (mod m₁), n ≡ a₂ (mod m₂) has exactly one solution mod m₁m₂.','Method: write n = a₁ + m₁x, substitute into the second congruence, solve for x mod m₂, then substitute back.'],
 keys:[['CRT','gcd(m₁, m₂) = 1 ⇒ unique solution mod m₁m₂'],['Step 1','n = a₁ + m₁x'],['Step 2','a₁ + m₁x ≡ a₂ (mod m₂), solve for x'],['Step 3','substitute back and reduce mod m₁m₂']],
 ex:[{q:'Solve n ≡ 2 (mod 5), n ≡ 3 (mod 7).',s:['n = 2 + 5x.','2 + 5x ≡ 3 (mod 7), so 5x ≡ 1. Since 5·3 = 15 ≡ 1, x ≡ 3 (mod 7).','x = 3 + 7k, so n = 2 + 5(3 + 7k) = 17 + 35k.'],a:'n ≡ 17 (mod 35). Check: 17 = 3·5 + 2 and 17 = 2·7 + 3. ✓'}],
 traps:['Giving the answer mod m₁ + m₂ or mod m₂.','Not checking that the moduli are coprime.']});

X('m135_crt3',{
 why:'Three-congruence systems are just CRT applied twice.',
 idea:['With pairwise coprime moduli, solve the first two congruences to get one congruence mod m₁m₂. Then combine that with the third.','The final answer is unique mod m₁m₂m₃.'],
 keys:[['Pairwise coprime','gcd(mᵢ, mⱼ) = 1 for every pair'],['Combine','two at a time'],['Answer','unique mod m₁m₂m₃']],
 ex:[{q:'Solve n ≡ 1 (mod 3), n ≡ 2 (mod 4), n ≡ 3 (mod 5).',s:['First two: n = 1 + 3x ≡ 2 (mod 4), so 3x ≡ 1 and x ≡ 3. Then n ≡ 10 (mod 12).','With the third: n = 10 + 12y ≡ 3 (mod 5), so 2y ≡ 3 and y ≡ 4. Then n = 58.'],a:'n ≡ 58 (mod 60).'}],
 traps:['Assuming pairwise coprime without checking: 4 and 6 share a 2.']});

X('m135_crtd',{
 why:'Exam CRT questions hide the system inside words or linear congruences.',
 idea:['"Leaves remainder a when divided by m" means n ≡ a (mod m). If a congruence looks like bx + k ≡ r, isolate x first using an inverse.','SM (Splitting Modulus): with gcd(m₁, m₂) = 1, n ≡ a (mod m₁m₂) ⇔ n ≡ a (mod m₁) and n ≡ a (mod m₂). Use it to split a big composite modulus into small pieces, or to merge equal remainders.'],
 keys:[['Words','"remainder a on division by m" means n ≡ a (mod m)'],['Isolate','bx ≡ c ⇒ x ≡ b⁻¹c'],['SM','coprime m₁, m₂: same residue mod each ⇔ same residue mod m₁m₂']],
 ex:[{q:'Solve 3x ≡ 2 (mod 5) and 2x ≡ 1 (mod 7).',s:['3⁻¹ ≡ 2 (mod 5), so x ≡ 4 (mod 5).','2⁻¹ ≡ 4 (mod 7), so x ≡ 4 (mod 7).','Same remainder, coprime moduli: SM gives x ≡ 4 (mod 35).'],a:'x ≡ 4 (mod 35).'}],
 traps:['Running CRT before isolating x.']});

// ---------- RSA ----------
X('m135_rsa',{
 why:'RSA puts the EEA, inverses and FℓT together in one computation.',
 idea:['Setup: choose primes p and q, set n = pq and φ = (p − 1)(q − 1). Pick e with gcd(e, φ) = 1. Find d with ed ≡ 1 (mod φ) and 0 &lt; d &lt; φ.','The public key is (e, n). The private key is (d, n). Encrypt with C ≡ Mᵉ (mod n) and decrypt with R ≡ Cᵈ (mod n), where 0 ≤ M &lt; n.'],
 keys:[['n','pq'],['φ','(p − 1)(q − 1)'],['e','gcd(e, φ) = 1'],['d','ed ≡ 1 (mod φ), found with the EEA'],['Encrypt','C ≡ Mᵉ (mod n)'],['Decrypt','R ≡ Cᵈ (mod n), which gives back M']],
 ex:[{q:'p = 5, q = 11, e = 3. Find d and encrypt M = 2.',s:['n = 55 and φ = 4·10 = 40.','3d ≡ 1 (mod 40): 3·27 = 81 = 2·40 + 1, so d = 27.','C ≡ 2³ = 8 (mod 55).'],a:'d = 27 and C = 8. Check: 8²⁷ ≡ 2 (mod 55).'}],
 traps:['Using n instead of φ when finding d.','Choosing an e that shares a factor with φ.']});

X('m135_rsac',{
 why:'Concept questions check that you understand why RSA works and what is secret.',
 idea:['Anyone can encrypt with (e, n). Only someone who knows d can decrypt, and finding d requires φ = (p − 1)(q − 1), which requires factoring n. Factoring large n is believed to be hard, and that is the whole security argument.','Why decryption works: ed = 1 + kφ, so M^(ed) = M·(M^(p−1))^(k(q−1)) ≡ M (mod p) by FℓT, and similarly mod q. Splitting the modulus then gives M^(ed) ≡ M (mod n).'],
 keys:[['Public','(e, n)'],['Private','d, plus p and q'],['Security','factoring n is hard'],['Correctness','FℓT mod p and mod q, then SM']],
 ex:[{q:'If an attacker learns p and q, can they decrypt?',s:['With p and q they can compute φ = (p − 1)(q − 1).','Then the EEA gives d from e.'],a:'Yes. Protecting the factors is the whole point.'}],
 traps:['Thinking e must be secret.']});

// ---------- Complex ----------
X('m135_cstd',{
 why:'Standard form a + bi is how you add, multiply and divide complex numbers.',
 idea:['A complex number is z = a + bi with a, b ∈ ℝ and i² = −1. Add and multiply like polynomials, replacing i² with −1.','To divide, multiply the top and bottom by the conjugate of the bottom. This makes the denominator a real number.'],
 keys:[['i²','−1'],['Conjugate','z̄ = a − bi'],['Modulus','|z| = √(a² + b²)'],['z·z̄','|z|²'],['Division','(top·w̄)/|w|²'],['Re, Im','Re(z) = a, Im(z) = b (real numbers)']],
 ex:[{q:'Write (3 + 2i)/(1 − i) in standard form.',s:['Multiply top and bottom by 1 + i.','Top: (3 + 2i)(1 + i) = 3 + 3i + 2i + 2i² = 1 + 5i.','Bottom: 1² + 1² = 2.'],a:'1/2 + (5/2)i'}],
 traps:['Saying Im(z) = bi. It\'s just b.','Forgetting the i² term when multiplying.']});

X('m135_cpolar',{
 why:'Polar form makes multiplication, powers and roots easy.',
 idea:['Every non-zero z can be written z = r(cos θ + i sin θ), where r = |z| and θ is the angle from the positive real axis.','Find θ from the point (a, b): check which quadrant it is in, then use the reference angle. tan⁻¹(b/a) alone gives the wrong quadrant half the time.'],
 keys:[['r','|z| = √(a² + b²)'],['θ','cos θ = a/r, sin θ = b/r'],['PMC','r₁e^(iθ₁)·r₂e^(iθ₂) = r₁r₂e^(i(θ₁+θ₂))'],['Special angles','π/6, π/4, π/3 and their reflections']],
 ex:[{q:'Write −1 + √3·i in polar form.',s:['r = √(1 + 3) = 2.','The point (−1, √3) is in quadrant II. The reference angle is π/3, so θ = π − π/3 = 2π/3.'],a:'2(cos 2π/3 + i sin 2π/3)'}],
 traps:['Using tan⁻¹(b/a) directly, which gives −π/3 here (wrong quadrant).']});

X('m135_dm',{
 why:'De Moivre turns a huge power into one multiplication of an angle.',
 idea:['DMT: (r(cos θ + i sin θ))ⁿ = rⁿ(cos nθ + i sin nθ).','Convert to polar form, raise r to the power and multiply the angle, reduce the angle mod 2π, then convert back to standard form if asked.'],
 keys:[['DMT','(re^(iθ))ⁿ = rⁿe^(inθ)'],['Reduce','nθ mod 2π'],['Convert back','a = rⁿ cos(nθ), b = rⁿ sin(nθ)']],
 ex:[{q:'Compute (1 + i)⁸.',s:['1 + i = √2(cos π/4 + i sin π/4).','(√2)⁸ = 16 and 8·π/4 = 2π.','cos 2π = 1 and sin 2π = 0.'],a:'(1 + i)⁸ = 16.'}],

X('m135_roots',{
 why:'Complex roots have a geometric structure, so you can write all n of them at once.',
 idea:['CNRT: for w = r(cos θ + i sin θ) ≠ 0, the equation zⁿ = w has exactly n distinct solutions.','They are z_k = r^(1/n)(cos((θ + 2kπ)/n) + i sin((θ + 2kπ)/n)) for k = 0, 1, …, n − 1. They lie evenly spaced on a circle of radius r^(1/n), 2π/n apart.'],
 keys:[['Count','n distinct roots'],['Modulus','r^(1/n), the positive real root'],['Angles','(θ + 2kπ)/n, k = 0…n − 1'],['Spacing','2π/n apart, forming a regular n-gon']],
 ex:[{q:'Solve z³ = 8i.',s:['8i = 8(cos π/2 + i sin π/2).','r^(1/3) = 2. Angles: (π/2 + 2kπ)/3 = π/6, 5π/6, 3π/2.','Values: 2e^(iπ/6) = √3 + i, 2e^(i5π/6) = −√3 + i, 2e^(i3π/2) = −2i.'],a:'z = √3 + i, −√3 + i, −2i'}],
 traps:['Adding 2kπ after dividing by n instead of before.','Listing only one root.']});

X('m135_cpoly',{
 why:'Polynomial factoring over ℂ is tested through the FTA, CJRT and the Factor Theorem.',
 idea:['FTA: every polynomial of degree n ≥ 1 with complex coefficients has a root in ℂ, so it factors into n linear factors.','CJRT: if the coefficients are real and z is a root, then z̄ is also a root. Pairing z and z̄ gives a real quadratic factor x² − 2Re(z)x + |z|².','Factor Theorem: c is a root ⇔ (x − c) is a factor. Rational Roots Theorem: rational roots p/q have p | constant term and q | leading coefficient.'],
 keys:[['FTA','degree n ⇒ n roots in ℂ, counted with multiplicity'],['CJRT','real coefficients: non-real roots come in conjugate pairs'],['Pair factor','(x − z)(x − z̄) = x² − 2Re(z)x + |z|²'],['FT','f(c) = 0 ⇔ (x − c) | f(x)'],['RRT','p | a₀, q | aₙ'],['RFRP','real polynomials factor into real linear and quadratic factors']],
 ex:[{q:'f(x) = x³ − 3x² + 4x − 2 has root 1 + i. Factor f over ℝ and ℂ.',s:['Real coefficients, so 1 − i is also a root.','Pair factor: x² − 2x + 2.','Divide: f(x) = (x − 1)(x² − 2x + 2).'],a:'Over ℂ: (x − 1)(x − (1 + i))(x − (1 − i)).'}],
 traps:['Using CJRT when the coefficients aren\'t all real.']});

// ---------- Proof Lab ----------
X('m135_prooflab',{
 why:'Most marks on MATH 135 tests are for written proofs. This topic practises building them line by line.',
 idea:['A proof is a chain where every line follows from the hypotheses, definitions, theorems or earlier lines. Before writing, name what you are given and what you must show, then unfold every definition into an equation.',
  'Each Proof Lab question works on one complete proof from the course in four parts: choose the next line, name what justifies a line, find the line that has been swapped for a wrong one, then say why it is wrong. Those are the same skills markers check.'],
 keys:[['Prove ∀x ∈ S, P(x)','Let x ∈ S be arbitrary. … Hence P(x).'],['Prove A ⇒ B','Assume A. … Therefore B.'],['Contrapositive','Assume ¬B. … Therefore ¬A.'],['a | b in a proof','write b = ka; use a new letter for each integer'],['S ⊆ T','Let x ∈ S. … So x ∈ T.'],['Induction','base case, then IH for one arbitrary k, then show k + 1'],['gcd = 1','find x, y with ax + by = 1, then cite CCT']],
 ex:[{q:'Prove: if a | b, then a | b².',s:['Assume a | b, so b = ka for some integer k (definition of divisibility).','Then b² = k²a² = (k²a)a (algebra).','k²a is an integer (closure of ℤ).'],a:'Therefore a | b² (definition of divisibility).'}],
 traps:['Starting from the conclusion and working backwards on the page.','Reusing one letter (k) for two different integers.','Dividing. Divisibility proofs never need it.','Citing Bézout to conclude gcd = 1. That direction needs CCT or GCD CT.','Proving a ∀ statement with examples.'],
 tip:'Write the justification in brackets after every line. If you can\'t name one, the line probably doesn\'t follow.'});

// ---------- Absolute values ----------
X('m137_abs',{
 why:'Absolute value inequalities are the language of ε–N and ε–δ proofs.',
 idea:['Read |x − a| as "the distance from x to a". Then |x − a| &lt; δ means x is within δ of a: the interval (a − δ, a + δ).','|A| &lt; B unfolds to −B &lt; A &lt; B, one double inequality. |A| &gt; B unfolds to A &gt; B or A &lt; −B, two separate pieces. When both sides have absolute values, split at the points where each inside changes sign.'],
 keys:[['|x − a| &lt; δ','a − δ &lt; x &lt; a + δ'],['|A| &lt; B','−B &lt; A &lt; B'],['|A| &gt; B','A &gt; B or A &lt; −B'],['|ab|','|a||b|'],['|x|²','x²']],
 ex:[{q:'Solve |2x − 3| &lt; 5.',s:['−5 &lt; 2x − 3 &lt; 5.','Add 3: −2 &lt; 2x &lt; 8.','Divide by 2: −1 &lt; x &lt; 4.'],a:'x ∈ (−1, 4)'},
  {q:'Solve |x − 1| &gt; |x + 3|.',s:['Distance to 1 is greater than distance to −3.','The midpoint of 1 and −3 is −1, so the points closer to −3 are those left of −1.','Check: square both sides, (x − 1)² &gt; (x + 3)², so −2x + 1 &gt; 6x + 9 and x &lt; −1.'],a:'x &lt; −1'}],
 traps:['Writing |A| &gt; B as −B &gt; A &gt; B, which is impossible.','Squaring an inequality whose sides might be negative. With absolute values on both sides it\'s safe.']});

X('m137_tri',{
 why:'The triangle inequality is how you bound the error terms in limit proofs.',
 idea:['|a + b| ≤ |a| + |b|: the length of a sum is at most the sum of the lengths. The reverse form, ||a| − |b|| ≤ |a − b|, gives you a lower bound.','In proofs you usually add and subtract the same thing, then split: |x − y| = |(x − z) + (z − y)| ≤ |x − z| + |z − y|.'],
 keys:[['Triangle Inequality','|a + b| ≤ |a| + |b|'],['Triangle Inequality II','||a| − |b|| ≤ |a − b|'],['Equality','when a and b have the same sign (or one is 0)'],['Add-and-subtract','|x − y| ≤ |x − z| + |z − y|']],
 ex:[{q:'If |x − 2| &lt; 1, bound |x + 5|.',s:['x + 5 = (x − 2) + 7.','|x + 5| ≤ |x − 2| + 7 &lt; 1 + 7.'],a:'|x + 5| &lt; 8'}],
 traps:['Assuming |a + b| = |a| + |b|. That only holds when a and b have the same sign.','Using the inequality backwards to get a lower bound. Use the reverse form for that.']});

// ---------- Sequences ----------
X('m137_rec',{
 why:'Recursive sequences combine computation, induction and the MCT.',
 idea:['A recursive sequence gives a₁ and a rule aₙ₊₁ = f(aₙ). Compute a few terms to see the pattern: increasing or decreasing, and bounded or not.','If the sequence converges to L, then L must satisfy L = f(L), because aₙ and aₙ₊₁ have the same limit. This finds the candidate limit. You still need the MCT, or another argument, to show the limit exists.'],
 keys:[['Recursive','a₁ given, aₙ₊₁ = f(aₙ)'],['Fixed point','if aₙ → L then L = f(L)'],['Plan','show monotone + bounded (by induction), then MCT, then solve L = f(L)']],
 ex:[{q:'a₁ = 1, aₙ₊₁ = √(2 + aₙ). Find the limit, assuming it exists.',s:['a₂ = √3 ≈ 1.73 and a₃ = √(2 + 1.73) ≈ 1.93. Increasing, apparently bounded by 2.','L = √(2 + L), so L² = L + 2 and (L − 2)(L + 1) = 0.','The terms are positive, so L ≠ −1.'],a:'L = 2'}],
 traps:['Solving L = f(L) and stopping. That only says what the limit would be if it exists.','Keeping a root that\'s impossible given the signs of the terms.']});

X('m137_seqlim',{

 idea:['For rational expressions in n, divide the top and bottom by the highest power of n in the denominator. Terms like c/nᵏ go to 0.','For square-root differences, multiply by the conjugate. For terms squeezed between two things with the same limit, use the Squeeze Theorem. Useful scale: ln n ≪ nᵖ ≪ rⁿ ≪ n! as n → ∞.'],
 keys:[['Rational','divide by the highest power in the denominator'],['Conjugate','√A − √B = (A − B)/(√A + √B)'],['Squeeze','aₙ ≤ bₙ ≤ cₙ, aₙ, cₙ → L ⇒ bₙ → L'],['rⁿ','→ 0 if |r| &lt; 1; diverges if |r| &gt; 1 or r = −1'],['Growth','ln n ≪ nᵖ ≪ rⁿ (r &gt; 1) ≪ n!']],
 ex:[{q:'Find lim (3n² − n)/(5n² + 2).',s:['Divide the top and bottom by n².','(3 − 1/n)/(5 + 2/n²) → 3/5.'],a:'3/5'},

 traps:['"∞ − ∞ = 0". That form is indeterminate, so use the conjugate.','Comparing only leading coefficients when the degrees differ.']});

X('m137_epsN',{

 keys:[['Definition','∀ε &gt; 0, ∃N, n &gt; N ⇒ |aₙ − L| &lt; ε'],['Scratch','solve |aₙ − L| &lt; ε for n'],['Simplify','replacing |aₙ − L| by a larger, simpler bound is fine'],['N','may depend on ε (and usually does)']],

 traps:['Choosing an N that depends on n.','Writing only the scratch work. The proof must start with "Let ε &gt; 0".']});

X('m137_sup',{
 why:'LUBs and the MCT guarantee that limits exist even when you can\'t compute them.',
 idea:['An upper bound M of a set S satisfies x ≤ M for every x ∈ S. The least upper bound, lub(S) or sup(S), is the smallest such M. The Least Upper Bound Property says every non-empty set of reals that is bounded above has one.','The MCT applies that idea to sequences: a sequence that is monotone and bounded converges. An increasing bounded-above sequence converges to the lub of its terms.','Subsequences of a convergent sequence converge to the same limit. If two subsequences have different limits, the sequence diverges.'],
 keys:[['lub(S)','an upper bound, and ≤ every other upper bound'],['max(S)','lub(S), if it belongs to S'],['MCT','monotone + bounded ⇒ convergent'],['Subsequences','aₙ → L ⇒ every subsequence → L'],['Divergence trick','two subsequences with different limits ⇒ diverges']],
 ex:[{q:'S = {1 − 1/n : n ∈ ℕ}. Find lub(S) and decide whether S has a max.',s:['Every element is &lt; 1, so 1 is an upper bound.','Any M &lt; 1 is beaten by 1 − 1/n for large n.','1 is never attained.'],a:'lub(S) = 1, and S has no maximum.'},
  {q:'Does aₙ = (−1)ⁿ converge?',s:['The even terms give 1; the odd terms give −1.','Two subsequences with different limits.'],a:'No, it diverges.'}],
 traps:['Confusing lub with max. The lub doesn\'t have to be in the set.','Saying "bounded ⇒ convergent". (−1)ⁿ is bounded and diverges.']});

// ---------- Series ----------
X('m137_geo',{
 why:'Geometric series are the one kind of series you can sum exactly.',
 idea:['Σ rⁿ adds powers of a fixed ratio r. Its partial sums are Sₖ = (1 − r^(k+1))/(1 − r), and r^(k+1) → 0 exactly when |r| &lt; 1.','So Σₙ₌₀^∞ rⁿ = 1/(1 − r) for |r| &lt; 1, and the series diverges otherwise. For a general geometric series, the sum is (first term)/(1 − r).'],
 keys:[['Geometric Series Test','Σ arⁿ converges ⇔ |r| &lt; 1 (with a ≠ 0)'],['Sum','first term/(1 − r)'],['Partial sum','Sₖ = (1 − r^(k+1))/(1 − r)']],
 ex:[{q:'Find Σₙ₌₂^∞ 3·(2/5)ⁿ.',s:['r = 2/5, so |r| &lt; 1 and it converges.','First term (n = 2): 3·4/25 = 12/25.','Sum = (12/25)/(1 − 2/5) = (12/25)/(3/5).'],a:'4/5'}],
 traps:['Using 1/(1 − r) when the series doesn\'t start at n = 0. Use the actual first term.','Forgetting to check |r| &lt; 1.']});

 keys:[['Convergent series','partial sums Sₖ converge'],['Divergence Test','aₙ ↛ 0 ⇒ Σ aₙ diverges'],['Not a test','aₙ → 0 proves nothing'],['Harmonic','Σ 1/n diverges']],
 ex:[{q:'Does Σ n/(n + 1) converge?',s:['aₙ = n/(n + 1) → 1 ≠ 0.'],a:'It diverges, by the Divergence Test.'}],
