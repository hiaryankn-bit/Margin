// ---------- Absolute values ----------
X('m137_abs',{
 why:'Absolute value inequalities are the language of ε–N and ε–δ proofs.',
 idea:['Read |x − a| as "the distance from x to a". Then |x − a| &lt; δ means x is within δ of a: the interval (a − δ, a + δ).','|A| &lt; B unfolds to −B &lt; A &lt; B, one double inequality. |A| &gt; B unfolds to A &gt; B or A &lt; −B, two separate pieces. When both sides have absolute values, split at the points where each inside changes sign.'],
 keys:[['|x − a| &lt; δ','a − δ &lt; x &lt; a + δ'],['|A| &lt; B','−B &lt; A &lt; B'],['|A| &gt; B','A &gt; B or A &lt; −B'],['|ab|','|a||b|'],['|x|²','x²']],
 ex:[{q:'Solve |2x − 3| &lt; 5.',s:['−5 &lt; 2x − 3 &lt; 5.','Add 3: −2 &lt; 2x &lt; 8.','Divide by 2: −1 &lt; x &lt; 4.'],a:'x ∈ (−1, 4)'},
  {q:'Solve |x − 1| &gt; |x + 3|.',s:['Distance to 1 is greater than distance to −3.','The midpoint of 1 and −3 is −1, so the points closer to −3 are those left of −1.','Check: square both sides, (x − 1)² &gt; (x + 3)², so −2x + 1 &gt; 6x + 9 and x &lt; −1.'],a:'x &lt; −1'}],
 traps:['Writing |A| &gt; B as −B &gt; A &gt; B, which is impossible.','Squaring an inequality whose sides might be negative. With absolute values on both sides it\'s safe.']});

X('m137_tri',{
 why:'The triangle inequality is how you bound the error terms in limit proofs.',
 idea:['|a + b| ≤ |a| + |b|: the length of a sum is at most the sum of the lengths. The reverse form, ||a| − |b|| ≤ |a − b|, gives you a lower bound.','In proofs you usually add and subtract the same thing, then split: |x − y| = |(x − z) + (z − y)| ≤ |x − z| + |z − y|.'],
 keys:[['Triangle Inequality','|a + b| ≤ |a| + |b|'],['Triangle Inequality II','||a| − |b|| ≤ |a − b|'],['Equality','when a and b have the same sign (or one is 0)'],['Add-and-subtract','|x − y| ≤ |x − z| + |z − y|']],
 ex:[{q:'If |x − 2| &lt; 1, bound |x + 5|.',s:['x + 5 = (x − 2) + 7.','|x + 5| ≤ |x − 2| + 7 &lt; 1 + 7.'],a:'|x + 5| &lt; 8'}],
 traps:['Assuming |a + b| = |a| + |b|. That only holds when a and b have the same sign.','Using the inequality backwards to get a lower bound. Use the reverse form for that.']});

X('m137_rec',{

 keys:[['Recursive','a₁ given, aₙ₊₁ = f(aₙ)'],['Fixed point','if aₙ → L then L = f(L)'],['Plan','show monotone + bounded (by induction), then MCT, then solve L = f(L)']],

X('m137_seqlim',{

X('m137_epsN',{

 keys:[['Definition','∀ε &gt; 0, ∃N, n &gt; N ⇒ |aₙ − L| &lt; ε'],['Scratch','solve |aₙ − L| &lt; ε for n'],['Simplify','replacing |aₙ − L| by a larger, simpler bound is fine'],['N','may depend on ε (and usually does)']],

 idea:['Balancing conserves atoms: every element has the same count on both sides. Only change coefficients, never subscripts, because changing a subscript changes the substance.','Strategy: balance elements that appear in only one reactant and one product first. Leave free elements like O₂ or H₂ until last. Clear fractions at the end by multiplying everything through.'],
 keys:[['Rule','change coefficients, never subscripts'],['Order','unique elements first, free elements last'],['Combustion','CₓHᵧ + O₂ → CO₂ + H₂O; balance C, then H, then O'],['Fractions','allowed temporarily; multiply through at the end']],
 ex:[{q:'Balance C₃H₈ + O₂ → CO₂ + H₂O.',s:['C: 3 CO₂.','H: 8 H gives 4 H₂O.','O on the right: 3(2) + 4(1) = 10, so 5 O₂.'],a:'C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O'},
  {q:'Balance C₂H₆ + O₂ → CO₂ + H₂O.',s:['2 CO₂ and 3 H₂O.','O on the right: 4 + 3 = 7, so 7/2 O₂.','Multiply everything by 2.'],a:'2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O'}],
 traps:['Changing H₂O to H₂O₂ to "balance" oxygen.','Forgetting to double-check every element at the end.']});

X('chem_limiting',{
 why:'Real reactions rarely use exact ratios. The limiting reagent decides how much product you get.',
 idea:['Convert each reactant to moles, then divide by its coefficient in the balanced equation. The smallest result is the limiting reagent; it runs out first. Everything else is in excess.','The theoretical yield comes from the limiting reagent. Percent yield compares what you actually got to that maximum. For solutions, moles = concentration × volume (in L).'],
 keys:[['Limiting','smallest (moles ÷ coefficient)'],['Theoretical yield','calculated from the limiting reagent'],['% yield','actual/theoretical × 100%'],['Solutions','n = cV, with V in litres'],['Excess left','initial − amount used']],
 ex:[{q:'25.0 mL of 0.325 M AgNO₃ is mixed with 30.0 mL of 0.120 M KCl. What mass of AgCl forms? (Module 1 example)',s:['n(Ag⁺) = 0.0250 × 0.325 = 8.13 × 10⁻³ mol.','n(Cl⁻) = 0.0300 × 0.120 = 3.60 × 10⁻³ mol.','1 : 1 ratio, so Cl⁻ is limiting: 3.60 × 10⁻³ mol AgCl.','× 143.32 g/mol.'],a:'0.516 g AgCl'}],
 traps:['Comparing grams instead of moles.','Forgetting to divide by the coefficients when they aren\'t 1.']});

X('chem_precip',{
 why:'Precipitation reactions and net ionic equations show what is really happening in solution.',
 idea:['Strong electrolytes (soluble ionic compounds, strong acids and bases) split completely into ions in water. When two solutions mix, a precipitate forms if any cation–anion pair is insoluble.','Molecular equation → complete ionic equation (split the aqueous strong electrolytes) → cancel the spectator ions that appear unchanged on both sides → net ionic equation.'],
 keys:[['Always soluble','Group 1 cations, NH₄⁺, NO₃⁻, CH₃COO⁻'],['Usually soluble','Cl⁻, Br⁻, I⁻ (except with Ag⁺, Pb²⁺, Hg₂²⁺); SO₄²⁻ (except Ba²⁺, Pb²⁺, Ca²⁺, Sr²⁺)'],['Usually insoluble','CO₃²⁻, PO₄³⁻, S²⁻, OH⁻ (except with Group 1, NH₄⁺; some Group 2)'],['Spectator ions','unchanged on both sides; cancel them'],['Keep together','solids, liquids, gases and weak electrolytes']],
 ex:[{q:'Write the net ionic equation for AgNO₃(aq) + NaCl(aq).',s:['Products: AgCl and NaNO₃. AgCl is insoluble.','Complete ionic: Ag⁺ + NO₃⁻ + Na⁺ + Cl⁻ → AgCl(s) + Na⁺ + NO₃⁻.','Cancel the spectators Na⁺ and NO₃⁻.'],a:'Ag⁺(aq) + Cl⁻(aq) → AgCl(s)'}],
 traps:['Splitting a solid precipitate into ions.','Forgetting to balance charge in the net ionic equation.']});

X('chem_green',{
 why:'Green chemistry metrics measure how wasteful a reaction or process is.',
 idea:['Atom economy is a theoretical measure from the balanced equation: what fraction of the reactant mass ends up in the desired product? Addition reactions with one product have 100% atom economy.','The E-factor is a practical measure: kilograms of waste per kilogram of product. Water is not counted as waste, but substances dissolved in wastewater are. A smaller E-factor is better.'],
 keys:[['% atom economy','(stoichiometric mass of desired product)/(mass of stoichiometric mixture of reactants) × 100%'],['E-factor','mass of waste/mass of product'],['Water','excluded from waste (dissolved substances count)'],['Ideal','100% atom economy and E-factor = 0'],['Process E-factor','(kg raw materials − kg product)/kg product']],
 ex:[{q:'Atom economy for making CaO by CaCO₃ → CaO + CO₂?',s:['Reactant mass: M(CaCO₃) = 100.09 g.','Desired product: M(CaO) = 56.08 g.','56.08/100.09 × 100%.'],a:'56.03%'},
  {q:'A process uses 10.0 kg of raw materials (not counting water) and yields 2.0 kg of product. E-factor?',s:['Waste = 10.0 − 2.0 = 8.0 kg.','8.0/2.0.'],a:'E-factor = 4.0'}],
 traps:['Using actual yield in atom economy. It\'s based on the balanced equation only.','Including water in the E-factor.','Forgetting the coefficients in the reactant mass.']});

X('chem_light',{
 why:'Light connects the energy of electrons to what we can measure: colours and wavelengths.',
 idea:['Light is a wave: c = λν, with c = 2.998 × 10⁸ m/s. It also comes in packets called photons, each with energy E = hν = hc/λ. Shorter wavelength means higher frequency and more energy per photon.','The photoelectric effect showed the particle picture: electrons are ejected only above a threshold frequency, whatever the intensity. Brighter light gives more photons, not more energetic ones.'],
 keys:[['c','λν = 2.998 × 10⁸ m/s'],['E (photon)','hν = hc/λ'],['h','6.626 × 10⁻³⁴ J·s'],['Per mole','E × N_A'],['Photoelectric','KE(electron) = hν − Φ (work function)'],['Units','nm = 10⁻⁹ m']],
 ex:[{q:'Find ν and the photon energy for λ = 500. nm.',s:['ν = c/λ = (2.998 × 10⁸)/(5.00 × 10⁻⁷) = 6.00 × 10¹⁴ Hz.','E = hν = (6.626 × 10⁻³⁴)(6.00 × 10¹⁴).'],a:'3.97 × 10⁻¹⁹ J per photon'}],
 traps:['Forgetting to convert nm to m.','Thinking higher intensity means higher energy per photon.']});

X('chem_bohr',{
 why:'The Bohr model explains the line spectrum of hydrogen from quantized energy levels.',
 idea:['In hydrogen, the electron\'s energy is quantized: Eₙ = −R_H/n², with R_H = 2.179 × 10⁻¹⁸ J. n = 1 is the lowest energy (ground state). As n → ∞, E → 0 (ionized).','When the electron drops from n_i to a lower n_f, it emits a photon with energy equal to the energy gap. Absorption goes upward. Bigger jumps give more energy and shorter wavelengths.'],
 keys:[['Eₙ','−R_H/n², R_H = 2.179 × 10⁻¹⁸ J'],['ΔE','R_H(1/n_f² − 1/n_i²) in magnitude'],['Emission','high n → low n (photon out)'],['Absorption','low n → high n (photon in)'],['λ','hc/|ΔE|'],['Ionization from n = 1','R_H per atom']],
 ex:[{q:'Find λ for the transition n = 3 → n = 2 in H.',s:['|ΔE| = 2.179 × 10⁻¹⁸ (1/2² − 1/3²) = 2.179 × 10⁻¹⁸ × 5/36.','|ΔE| = 3.026 × 10⁻¹⁹ J.','λ = hc/ΔE = (6.626 × 10⁻³⁴)(2.998 × 10⁸)/(3.026 × 10⁻¹⁹).'],a:'6.56 × 10⁻⁷ m = 656 nm (red)'}],
 traps:['Mixing up which n goes first. Use the absolute value and think about the direction.','Applying the Bohr formula to atoms with more than one electron.']});

X('chem_debroglie',{
 why:'de Broglie and Heisenberg explain why electrons need quantum mechanics instead of orbits.',
 idea:['de Broglie proposed that matter also has a wavelength: λ = h/(mv). For everyday objects it is far too small to notice. For electrons, it is about the size of an atom.','The Heisenberg Uncertainty Principle says Δx·Δp ≥ h/(4π): you can\'t know a particle\'s position and momentum exactly at the same time. So electrons don\'t have definite trajectories, and Bohr-style orbits fail.'],
 keys:[['de Broglie','λ = h/(mv) = h/p'],['m','in kg (electron: 9.109 × 10⁻³¹ kg)'],['HUP','Δx·Δp ≥ h/(4π)'],['Δp','m·Δv'],['Meaning','no exact trajectories for electrons']],
 ex:[{q:'Find λ for an electron moving at 1.00 × 10⁶ m/s.',s:['λ = h/(mv) = 6.626 × 10⁻³⁴/(9.109 × 10⁻³¹ × 1.00 × 10⁶).'],a:'7.27 × 10⁻¹⁰ m (about the size of an atom)'}],
 traps:['Using grams instead of kilograms.','Reading the HUP as a limit of our instruments. It\'s a property of nature.']});

X('chem_qn',{
 why:'The four quantum numbers label every electron. They underpin configurations and the periodic table.',
 idea:['n (principal) sets the size and energy level: 1, 2, 3, …. ℓ (angular momentum) sets the shape: 0 to n − 1, labelled s, p, d, f. m_ℓ (magnetic) sets the orientation: −ℓ to +ℓ. m_s (spin) is +½ or −½.','The Pauli exclusion principle says no two electrons share all four numbers, so each orbital holds at most 2 electrons, with opposite spins.'],
 keys:[['n','1, 2, 3, …'],['ℓ','0 … n − 1 (s, p, d, f = 0, 1, 2, 3)'],['m_ℓ','−ℓ … +ℓ (2ℓ + 1 orbitals)'],['m_s','±½'],['Orbitals in shell n','n²'],['Electrons in shell n','2n²']],
 ex:[{q:'Is (n, ℓ, m_ℓ, m_s) = (3, 2, −3, +½) allowed?',s:['ℓ = 2 is allowed for n = 3 (ℓ ≤ 2).','m_ℓ must be between −2 and +2.'],a:'No: m_ℓ = −3 is impossible.'},
  {q:'How many orbitals are in the 4f subshell?',s:['f means ℓ = 3.','2ℓ + 1 = 7.'],a:'7 orbitals (14 electrons)'}],
 traps:['Allowing ℓ = n.','Mixing up the labels: ℓ = 2 is d, not p.']});

X('chem_nodes',{

 idea:['A node is a place where the probability of finding the electron is zero. Radial nodes are spherical shells. Angular nodes are planes or cones through the nucleus.','Count them: angular nodes = ℓ, radial nodes = n − ℓ − 1, total nodes = n − 1.'],
 keys:[['Angular','ℓ'],['Radial','n − ℓ − 1'],['Total','n − 1'],['s orbitals','no angular nodes, spherical'],['p orbitals','one nodal plane']],
 ex:[{q:'How many radial and angular nodes does a 3p orbital have?',s:['n = 3 and ℓ = 1.','Angular = ℓ = 1.','Radial = 3 − 1 − 1 = 1.'],a:'1 radial, 1 angular (2 total)'}],

// ---------- Module 3 ----------
X('chem_config',{
 why:'Electron configurations explain chemical behaviour and the layout of the periodic table.',
 idea:['Fill orbitals in order of increasing energy (Aufbau): 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d …. Each orbital holds 2 electrons with opposite spins (Pauli). Within a subshell, spread electrons out with parallel spins before pairing (Hund\'s rule).','Know the two exceptions: Cr is [Ar]4s¹3d⁵ and Cu is [Ar]4s¹3d¹⁰, because half-filled and filled d subshells are extra stable.','For transition metal cations, remove the 4s electrons before the 3d electrons.'],
 keys:[['Aufbau order','1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p'],['Pauli','max 2 electrons per orbital, opposite spins'],['Hund','singly occupy, parallel spins, before pairing'],['Exceptions','Cr: 4s¹3d⁵; Cu: 4s¹3d¹⁰'],['Cations','remove ns before (n − 1)d'],['Paramagnetic','has unpaired electrons']],
 ex:[{q:'Write configurations for Fe and Fe³⁺.',s:['Fe (Z = 26): [Ar]4s²3d⁶.','Remove 3 electrons: 4s first (2), then one 3d.'],a:'Fe³⁺: [Ar]3d⁵ (5 unpaired, paramagnetic)'}],
 traps:['Removing 3d before 4s for cations.','Forgetting the Cr and Cu exceptions.']});

X('chem_trend',{
 why:'Periodic trends let you predict properties from position alone.',
 idea:['The key idea is effective nuclear charge, Z_eff: the pull a valence electron actually feels after shielding by inner electrons. Across a period, Z_eff increases, so atoms get smaller and hold their electrons more tightly. Down a group, the valence electrons are in larger shells farther from the nucleus.','Results: atomic radius decreases across and increases down. Ionization energy and electronegativity increase across and decrease down. Cations are smaller than their atoms and anions are larger. In an isoelectronic series, more protons means a smaller ion.'],
 keys:[['Z_eff','increases across a period'],['Radius','smaller to the right, larger down'],['IE₁','larger to the right, smaller down'],['Electronegativity','larger to the right, smaller down; F is highest'],['Ions','cation &lt; atom &lt; anion'],['IE exceptions','Be &gt; B and N &gt; O']],
 ex:[{q:'Order by radius: Na⁺, F⁻, Ne, Mg²⁺, O²⁻.',s:['All have 10 electrons (isoelectronic).','More protons pull harder: O (8) &lt; F (9) &lt; Ne (10) &lt; Na (11) &lt; Mg (12).'],a:'O²⁻ &gt; F⁻ &gt; Ne &gt; Na⁺ &gt; Mg²⁺'}],
 traps:['Thinking more electrons always means larger. Across a period, the radius shrinks.','Forgetting the N &gt; O ionization-energy exception (a paired-electron repulsion in O).']});

// ---------- Module 4 ----------
X('chem_vsepr',{
 why:'VSEPR predicts 3-D shapes, and shape decides polarity and properties.',
 idea:['Electron groups around the central atom (bonds and lone pairs) repel and spread out. A double or triple bond counts as one group. The number of groups sets the electron-group geometry. The molecular shape describes only where the atoms are.','Lone pairs take up more room and squeeze bond angles. A molecule is polar if its bond dipoles don\'t cancel. Symmetric shapes with identical surrounding atoms are nonpolar.'],
 keys:[['2 groups','linear, 180°'],['3','trigonal planar, 120° (1 lone pair: bent)'],['4','tetrahedral, 109.5° (1 LP: trigonal pyramidal; 2 LP: bent)'],['5','trigonal bipyramidal (1 LP: seesaw; 2: T-shaped; 3: linear)'],['6','octahedral (1 LP: square pyramidal; 2: square planar)'],['Polar','bond dipoles don\'t cancel']],
 ex:[{q:'Predict the shape and polarity of SF₄.',s:['S has 6 valence electrons: 4 bonds to F plus 1 lone pair, so 5 groups.','5 groups with 1 lone pair: seesaw.','The asymmetric shape means the dipoles don\'t cancel.'],a:'Seesaw, polar'},
  {q:'Is CO₂ polar?',s:['2 groups on C: linear.','The two equal C=O dipoles point in opposite directions.'],a:'Nonpolar (it has polar bonds)'}],
 traps:['Naming the shape from electron groups instead of atoms (NH₃ is pyramidal, not tetrahedral).','Polar bonds don\'t always make a polar molecule.']});

X('chem_formal',{
 why:'Formal charge picks the best Lewis structure, and resonance describes bonds Lewis structures can\'t.',
 idea:['Formal charge = valence electrons − non-bonding electrons − ½(bonding electrons). The best structure keeps formal charges near zero and puts any negative formal charge on the more electronegative atom.','When more than one valid structure differs only in where the electrons are, the real molecule is a resonance hybrid, an average. Its bonds are intermediate in length and strength.','Ionic bond strength is measured by lattice energy, which grows with ion charge and shrinks with ion size (Coulomb\'s law).'],
 keys:[['FC','V − N − B/2'],['Best structure','FCs near 0; negative FC on the more electronegative atom'],['Resonance','same atoms, different electron placement; the real molecule is the average'],['Bond order (resonance)','total bonds/number of positions'],['Expanded octet','only row 3 and below'],['Lattice energy','∝ |q₁q₂|/(r₁ + r₂)']],
 ex:[{q:'Find the C–O bond order in CO₃²⁻.',s:['Three resonance structures, each with one C=O and two C–O.','Total bonds: 4 spread across 3 positions.'],a:'Bond order 4/3 (all three bonds equal)'},
  {q:'Which has the larger lattice energy, NaCl or MgO?',s:['MgO: charges +2 and −2, so |q₁q₂| = 4. NaCl: 1.','The ions are similar in size.'],a:'MgO, by a lot'}],
 traps:['Counting both electrons of a bond toward FC. Only half counts.','Thinking the molecule flips between resonance structures.']});

X('chem_hybrid',{
 why:'Hybridization explains bond angles and counts σ and π bonds in valence bond theory.',
 idea:['In VB theory, atomic orbitals mix (hybridize) to point along the bond directions. The number of electron groups on an atom sets the hybridization: 2 is sp, 3 is sp², 4 is sp³, 5 is sp³d, 6 is sp³d².','Every single bond is one σ bond. A double bond is σ + π, and a triple bond is σ + 2π. π bonds come from unhybridized p orbitals overlapping side by side.'],
 keys:[['2 groups','sp (linear)'],['3','sp² (trigonal planar)'],['4','sp³ (tetrahedral)'],['5','sp³d'],['6','sp³d²'],['Single','1σ'],['Double','1σ + 1π'],['Triple','1σ + 2π']],
 ex:[{q:'Count the σ and π bonds in C₂H₄, and give each carbon\'s hybridization.',s:['Each C has 3 groups (2 H plus C), so sp².','Bonds: 4 C–H (σ) and 1 C=C (σ + π).'],a:'5σ, 1π; each C is sp²'},
  {q:'HCN?',s:['C has 2 groups (H and N), so sp.','H–C σ; C≡N σ + 2π.'],a:'2σ, 2π; C is sp'}],

X('chem_mo',{
 why:'MO diagrams predict bond order and magnetism, which Lewis structures can\'t.',
 idea:['In MO theory, atomic orbitals combine into molecular orbitals spread over the whole molecule. Bonding orbitals are lower in energy; antibonding orbitals (*) are higher. Fill them like atomic orbitals: lowest first, Pauli, Hund.','The order of the 2p-derived orbitals depends on the molecule. For B₂, C₂ and N₂, π2p lies below σ2p (because of s–p mixing). For O₂, F₂ and Ne₂, σ2p lies below π2p. Unpaired electrons make a molecule paramagnetic.'],
 keys:[['Bond order','(bonding e⁻ − antibonding e⁻)/2'],['BO = 0','molecule not stable'],['B₂, C₂, N₂','σ2s σ*2s π2p σ2p π*2p σ*2p'],['O₂, F₂, Ne₂','σ2s σ*2s σ2p π2p π*2p σ*2p'],['Paramagnetic','any unpaired electrons'],['Higher BO','shorter, stronger bond']],
 ex:[{q:'Use MO theory for O₂: bond order and magnetism.',s:['12 valence electrons.','σ2s² σ*2s² σ2p² π2p⁴ π*2p².','The two π* electrons sit in separate orbitals (Hund), so they\'re unpaired.','BO = (8 − 4)/2 = 2.'],a:'BO 2, paramagnetic (VB theory can\'t explain this)'},
  {q:'B₂?',s:['6 valence electrons: σ2s² σ*2s² π2p².','The two π electrons are unpaired.','BO = (4 − 2)/2 = 1.'],a:'BO 1, paramagnetic'}],
 traps:['Using the O₂ ordering for N₂ or B₂.','Pairing up degenerate π* electrons in O₂.']});

X('chem_vbmo',{
 why:'Knowing what each theory does well, and where it fails, is a common concept question.',
 idea:['Valence bond theory describes bonds as overlapping orbitals localized between two atoms. It explains shapes with hybridization and is intuitive for organic molecules.','MO theory delocalizes electrons over the whole molecule. It predicts bond order, magnetism and excited states, and it handles resonance naturally. The classic case where VB fails: O₂ is paramagnetic. A Lewis or VB picture pairs every electron, but MO correctly puts 2 unpaired electrons in π*.'],
 keys:[['VB','localized bonds, hybrid orbitals, shapes'],['MO','delocalized orbitals, bond order, magnetism'],['O₂','MO predicts paramagnetism; VB doesn\'t'],['Antibonding','raises energy; only MO includes it']],
 ex:[{q:'Why does MO explain O₂ better than a Lewis structure?',s:['The Lewis structure O=O has all electrons paired, which predicts diamagnetic.','Experiment: O₂ is attracted to a magnet.','MO: 2 unpaired electrons in π*2p.'],a:'MO correctly predicts paramagnetism.'}],
 traps:['Thinking one theory is "right" and the other "wrong". They are models with different strengths.']});

X('chem_gas',{
 why:'The ideal gas law connects pressure, volume, temperature and amount in one equation.',
 idea:['PV = nRT. Temperature must be in kelvin. Match R to your units. With P in kPa and V in L, R = 8.3145 L·kPa/(K·mol).','For a fixed amount of gas changing conditions, P₁V₁/T₁ = P₂V₂/T₂. For molar mass, combine with n = m/M. Real gases deviate most at high pressure and low temperature.'],
 keys:[['Ideal gas law','PV = nRT'],['R','8.3145 L·kPa/(K·mol) = 0.083145 L·bar/(K·mol)'],['T','K = °C + 273.15'],['Pressure','1 bar = 100 kPa; 1 atm = 101.325 kPa = 760 Torr'],['Fixed n','P₁V₁/T₁ = P₂V₂/T₂'],['Molar mass','M = mRT/(PV)']],
 ex:[{q:'A 0.474 g gas sample occupies 0.250 L at 100 °C and 101 kPa. Find M. (Module 6, Example 6-3)',s:['T = 373.15 K.','n = PV/RT = (101 × 0.250)/(8.3145 × 373.15) = 8.14 × 10⁻³ mol.','M = 0.474/8.14 × 10⁻³.'],a:'M ≈ 58.2 g/mol'}],

X('chem_kmt',{
 why:'Kinetic molecular theory explains why gases behave as they do, and when they stop behaving ideally.',
 idea:['KMT assumptions: molecules are tiny and far apart, in constant random motion, and they collide elastically. They don\'t attract or repel except when colliding. Average kinetic energy is proportional to kelvin temperature: KE_avg = (3/2)RT per mole.','So at the same temperature, all gases have the same average KE, and lighter molecules move faster: u_rms = √(3RT/M). By Graham\'s law, lighter gases effuse faster: rate₁/rate₂ = √(M₂/M₁).','Real gases deviate when molecules are crowded (high P) or slow (low T), because their volume and attractions start to matter. The van der Waals equation corrects for both.'],
 keys:[['KE_avg','(3/2)RT per mole: depends only on T'],['u_rms','√(3RT/M), with M in kg/mol and R = 8.3145 J/(K·mol)'],['Graham','rate₁/rate₂ = √(M₂/M₁)'],['van der Waals','(P + an²/V²)(V − nb) = nRT'],['a','attractions (lower the pressure)'],['b','molecular volume (less free space)'],['Z','PV/(nRT); 1 for an ideal gas']],
 ex:[{q:'Find u_rms for N₂ at 300 K.',s:['M = 0.02802 kg/mol.','u = √(3 × 8.3145 × 300/0.02802).'],a:'≈ 517 m/s'},
  {q:'How much faster does He effuse than CH₄?',s:['√(M(CH₄)/M(He)) = √(16.04/4.003) = √4.01.'],a:'About 2.00 times faster'}],
 traps:['Using g/mol instead of kg/mol in u_rms.','Thinking heavier gases have more average KE at the same T. They have the same KE.']});

X('chem_imf',{
 why:'Intermolecular forces explain boiling points, vapour pressure, viscosity and surface tension.',
 idea:['London dispersion forces act between all molecules and grow with size (more polarizable electron clouds). Dipole–dipole forces add to them for polar molecules. Hydrogen bonds are especially strong dipole interactions: an H bonded to N, O or F attracted to a lone pair on another N, O or F.','Stronger IMFs mean a higher boiling point, higher viscosity, higher surface tension and lower vapour pressure. Compare similar-sized molecules by polarity and H-bonding; compare different sizes by dispersion.'],
 keys:[['Dispersion','all molecules; increase with size and surface area'],['Dipole–dipole','polar molecules'],['H-bond','H–N, H–O or H–F ··· N, O or F'],['Stronger IMF','↑ b.p., ↑ viscosity, ↑ surface tension, ↓ vapour pressure'],['Same size','polar &gt; nonpolar (ICl &gt; Br₂)']],
 ex:[{q:'Rank by boiling point: CH₄, CH₃OH, CH₃Cl.',s:['CH₄: dispersion only, and small.','CH₃Cl: polar, so dipole–dipole plus dispersion.','CH₃OH: has O–H, so hydrogen bonding.'],a:'CH₄ &lt; CH₃Cl &lt; CH₃OH'},
  {q:'Why is the boiling point of CCl₄ much higher than CH₄?',s:['Both are nonpolar, so dispersion only.','CCl₄ is much larger with more electrons, so it is more polarizable.'],a:'Much stronger dispersion forces in CCl₄.'}],
 traps:['Calling any molecule with H an H-bonder. The H must be on N, O or F.','Thinking IMFs break covalent bonds when boiling.']});

 idea:['Bond energy (bond dissociation energy) is the energy needed to break a particular covalent bond, typically a few hundred kJ/mol. The same amount is released when the bond forms.','Three trends from Module 4: smaller atoms form shorter, stronger bonds (compare H₂ with Cl₂); higher bond order gives a shorter, stronger bond, though a double bond is not twice a single; and polarity matters too.','To estimate ΔH for a gas-phase reaction, add the energies of every bond broken and subtract the energies of every bond formed.'],
 keys:[['ΔH (estimate)','Σ(bonds broken) − Σ(bonds formed)'],['Breaking','costs energy (+)'],['Forming','releases energy (−)'],['Bond order ↑','shorter, stronger: C−C 347, C=C 611, C≡C 837 kJ/mol'],['Atom size ↑','longer, weaker: H−F 565, H−Cl 431, H−Br 364, H−I 297'],['Exception','F−F (159) is weaker than Cl−Cl (243): lone pairs on small F atoms repel']],
 ex:[{q:'Estimate ΔH for H₂ + Cl₂ → 2 HCl.',s:['Broken: H−H (436) + Cl−Cl (243) = 679 kJ.','Formed: 2 × H−Cl (431) = 862 kJ.','ΔH ≈ 679 − 862.'],a:'ΔH ≈ −183 kJ (exothermic)'},
  {q:'Estimate ΔH for N₂ + 3 H₂ → 2 NH₃.',s:['Broken: N≡N (946) + 3 × H−H (436) = 2254 kJ.','Formed: 6 × N−H (389) = 2334 kJ.'],a:'ΔH ≈ −80 kJ'}],
 traps:['Subtracting the wrong way round: it is broken minus formed.','Forgetting coefficients and how many bonds each molecule has (NH₃ has 3 N−H bonds).','Thinking a double bond is exactly twice as strong as a single bond.'],
 tip:'Draw every molecule\'s Lewis structure before counting bonds.'});

X('phys_vec',{
 why:'Almost every 2-D mechanics problem starts by splitting vectors into components.',
 idea:['A vector has a magnitude and a direction. Resolve it into perpendicular components, then work with each axis separately. With θ measured from the +x axis: Aₓ = A cos θ and Aᵧ = A sin θ.','To go back: A = √(Aₓ² + Aᵧ²) and θ = tan⁻¹(Aᵧ/Aₓ), then fix the quadrant using the signs of the components. Add vectors by adding their components.'],
 keys:[['Components','Aₓ = A cos θ, Aᵧ = A sin θ (θ from +x)'],['Magnitude','√(Aₓ² + Aᵧ²)'],['Direction','tan⁻¹(Aᵧ/Aₓ), then check the quadrant'],['Addition','add x parts and y parts separately'],['Dot product','A·B = AB cos φ = AₓBₓ + AᵧBᵧ'],['Cross product','|A × B| = AB sin φ (right-hand rule)']],
 ex:[{q:'Add A = 5.0 m at 30° and B = 3.0 m at 120°.',s:['A: (4.33, 2.50).','B: (3 cos 120°, 3 sin 120°) = (−1.50, 2.60).','Sum: (2.83, 5.10).','Magnitude √(2.83² + 5.10²) = 5.83 m. Angle tan⁻¹(5.10/2.83) = 61°.'],a:'5.8 m at 61° above +x'}],
 traps:['Using sin for x when θ is measured from +x.','Trusting tan⁻¹ in quadrants II and III. Add 180° when Aₓ &lt; 0.']});

X('phys_units',{
 why:'Unit mistakes and sloppy significant figures cost easy marks on every problem.',
 idea:['Convert everything to SI before substituting: m, kg, s. Check dimensions: both sides of an equation must have the same units, which catches many algebra errors.','Significant figures: for × and ÷, the answer keeps the fewest sig figs of any input. For + and −, it keeps the fewest decimal places. Round only at the end.'],
 keys:[['km/h → m/s','divide by 3.6'],['× and ÷','fewest significant figures'],['+ and −','fewest decimal places'],['Prefixes','k = 10³, c = 10⁻², m = 10⁻³, μ = 10⁻⁶, n = 10⁻⁹'],['Dimensional check','both sides have the same units']],
 ex:[{q:'Convert 72 km/h to m/s.',s:['72 km/h × (1000 m/1 km) × (1 h/3600 s).'],a:'20 m/s'},
  {q:'Compute 12.1 × 0.0300 with correct sig figs.',s:['12.1 has 3 sig figs and 0.0300 has 3.','12.1 × 0.0300 = 0.363.'],a:'0.363'}],
 traps:['Squared units: 1 cm² = 10⁻⁴ m², not 10⁻² m².','Rounding intermediate answers.']});

X('phys_kin',{
 why:'The constant-acceleration equations solve every 1-D motion problem with constant a.',
 idea:['With constant acceleration there are five quantities: Δx, v₀, v, a and t. Each equation leaves one out. List what you know and what you want, then pick the equation without the quantity you neither know nor need.','For free fall, a = −g with up positive, g = 9.81 m/s². At the top of a vertical throw, v = 0 but a is still −g.'],
 keys:[['No Δx','v = v₀ + at'],['No v','Δx = v₀t + ½at²'],['No t','v² = v₀² + 2aΔx'],['No a','Δx = ½(v₀ + v)t'],['Free fall','a = −9.81 m/s² (up positive)'],['Top of flight','v = 0, a = −g']],
 ex:[{q:'A ball is thrown up at 15 m/s. Find the maximum height.',s:['At the top, v = 0. a = −9.81 and Δx is unknown, with no t needed.','0 = 15² − 2(9.81)Δx.','Δx = 225/19.62.'],a:'11.5 m'},
  {q:'A car brakes from 25 m/s to rest in 50 m. Find a.',s:['No t: 0 = 25² + 2a(50).'],a:'a = −6.25 m/s²'}],
 traps:['Mixed sign conventions: choose positive once and stick to it.','Setting a = 0 at the top of the flight.']});

X('phys_graph',{
 why:'Reading motion graphs is tested constantly through concept questions.',
 idea:['On an x–t graph, the slope is velocity. On a v–t graph, the slope is acceleration and the area under the curve is displacement (area below the axis counts as negative).','An object speeds up when v and a have the same sign, and slows down when they have opposite signs. Average velocity is displacement/time; average speed is distance/time. They differ when the object turns around.'],
 keys:[['x–t slope','velocity'],['v–t slope','acceleration'],['v–t area','displacement'],['Speeding up','v and a have the same sign'],['Avg velocity','Δx/Δt'],['Avg speed','total distance/Δt']],
 ex:[{q:'A runner goes 100 m east and back to the start in 40 s. Average velocity and average speed?',s:['Displacement = 0.','Distance = 200 m.'],a:'Average velocity 0; average speed 5.0 m/s'}],
 traps:['Thinking negative acceleration always means slowing down.','Confusing distance with displacement.']});

X('phys_proj',{
 why:'Projectiles combine two 1-D problems that share the same time.',
 idea:['Treat x and y separately. Horizontally, velocity is constant (ignoring air resistance): x = v₀ cos θ · t. Vertically, acceleration is −g: y = v₀ sin θ · t − ½gt².','The time links the two directions. Solve for t in one direction, then use it in the other. For launches over level ground, the range formula is R = v₀² sin(2θ)/g, which is largest at 45°.'],
 keys:[['x','vₓ = v₀ cos θ (constant)'],['y','vᵧ = v₀ sin θ − gt'],['Time of flight (level)','T = 2v₀ sin θ/g'],['Range (level)','R = v₀² sin 2θ/g'],['Max height','H = (v₀ sin θ)²/(2g)'],['Horizontal launch from h','t = √(2h/g)']],
 ex:[{q:'A ball rolls off a 1.25 m table at 3.0 m/s. Where does it land?',s:['Vertical: 1.25 = ½(9.81)t², so t = 0.505 s.','Horizontal: x = 3.0 × 0.505.'],a:'1.5 m from the table'}],
 traps:['Using the level-ground formulas when the heights differ.','Giving vₓ an acceleration.']});

X('phys_rel',{
 why:'Relative velocity handles boats in rivers, planes in wind and moving observers.',
 idea:['Velocities add as vectors through a common reference frame: v_{A/C} = v_{A/B} + v_{B/C}. Read it as "A relative to C equals A relative to B plus B relative to C".','For a river crossing, the time to cross depends only on the component of the boat\'s velocity straight across. The current pushes the boat downstream for that time.'],
 keys:[['Chain rule','v_{A/C} = v_{A/B} + v_{B/C}'],['Reverse','v_{B/A} = −v_{A/B}'],['Crossing time','width/(across component)'],['Drift','v_current × crossing time'],['Straight across','aim upstream so the components cancel']],
 ex:[{q:'A boat moves at 4.0 m/s relative to the water, aimed straight across a 120 m river flowing at 3.0 m/s. Time and drift?',s:['Crossing time = 120/4.0 = 30 s.','Drift = 3.0 × 30 = 90 m.','Ground speed = √(4² + 3²) = 5.0 m/s.'],a:'30 s, 90 m downstream'}],
 traps:['Adding speeds as plain numbers instead of vectors.']});

X('phys_circ',{
 why:'Uniform circular motion has acceleration even at constant speed.',
 idea:['Moving in a circle at constant speed, the velocity keeps changing direction. That takes a centripetal acceleration a_c = v²/r, pointing toward the centre.','The period T is the time for one revolution, so v = 2πr/T. If the speed is also changing, there is a tangential acceleration too, and the total acceleration has both parts.'],
 keys:[['a_c','v²/r, toward the centre'],['v','2πr/T'],['a_c (period form)','4π²r/T²'],['Non-uniform','a = √(a_c² + a_t²)']],
 ex:[{q:'A car takes a 50 m radius curve at 20 m/s. Find a_c.',s:['a_c = 20²/50.'],a:'8.0 m/s² toward the centre'}],
 traps:['Thinking constant speed means zero acceleration.','Calling centripetal force a separate force on a free-body diagram. It\'s the net inward force.']});

X('phys_incline',{
 why:'Inclines with friction are the classic Newton\'s second law problem.',
 idea:['Tilt the axes to match the slope. Gravity splits into mg sin θ down the slope and mg cos θ into the surface, so N = mg cos θ (with no other perpendicular forces).','Kinetic friction f_k = μ_k N opposes sliding. Static friction adjusts as needed up to μ_s N. An object on an incline starts to slip when tan θ &gt; μ_s.'],
 keys:[['Along the slope','mg sin θ (down the slope)'],['Normal','N = mg cos θ'],['Kinetic friction','f_k = μ_k N, opposing the motion'],['Static friction','f_s ≤ μ_s N'],['Slip angle','tan θ = μ_s'],['Sliding down','a = g(sin θ − μ_k cos θ)']],
 ex:[{q:'A block slides down a 30° incline with μ_k = 0.20. Find a.',s:['a = g(sin 30° − 0.20 cos 30°).','= 9.81(0.500 − 0.173).'],a:'3.2 m/s² down the slope'}],
 traps:['Setting N = mg on an incline.','Assuming static friction is always μ_s N. That\'s only the maximum.']});

X('phys_atwood',{
 why:'Pulley and elevator problems test free-body diagrams with more than one object.',
 idea:['Draw a free-body diagram for each mass and write ΣF = ma for each one, choosing positive directions consistently with the motion. An ideal rope (massless, over a frictionless pulley) has the same tension throughout, and the connected masses share the same magnitude of acceleration.','In an elevator, your apparent weight is the normal force: N = m(g + a), with a positive upward.'],
 keys:[['Each mass','its own FBD and ΣF = ma'],['Ideal rope','same T, same |a|'],['Atwood','a = (m₂ − m₁)g/(m₁ + m₂)'],['Tension (Atwood)','T = 2m₁m₂g/(m₁ + m₂)'],['Elevator','N = m(g + a), up positive']],
 ex:[{q:'Atwood machine with 3.0 kg and 5.0 kg masses. Find a and T.',s:['a = (5 − 3)(9.81)/8 = 2.45 m/s².','T = 3.0(9.81 + 2.45) = 36.8 N.'],a:'a = 2.45 m/s², T = 36.8 N'}],
 traps:['Assuming T = mg for a mass that is accelerating.','Inconsistent positive directions for the two masses.']});

X('phys_newton',{
 why:'Newton\'s laws concept questions catch the most common misconceptions.',
 idea:['First law: with zero net force, velocity stays constant (that includes being at rest). Second law: ΣF = ma, so the net force causes acceleration, not velocity. Third law: forces come in equal and opposite pairs acting on different objects.','A third-law pair never cancels, because the two forces act on different bodies. Weight and the normal force are not a third-law pair.'],
 keys:[['1st law','ΣF = 0 ⇔ constant velocity'],['2nd law','ΣF = ma'],['3rd law','F_{A on B} = −F_{B on A}'],['Weight','mg (Earth pulls the object)'],['Normal force','contact force, perpendicular to the surface']],
 ex:[{q:'A book rests on a table. What is the third-law partner of the table\'s normal force on the book?',s:['Normal force: the table pushes up on the book.','Partner: same pair of objects, reversed.'],a:'The book pushes down on the table.'}],
 traps:['"Motion needs a force." Only changes in motion need a net force.','Pairing weight with the normal force as action–reaction.']});

X('phys_bank',{
 why:'Banked curves and loops apply circular motion to real forces.',
 idea:['Pick the centre of the circle and add the force components pointing toward it: Σ F_in = mv²/r. For a car on a banked curve, the centre is horizontal. Don\'t tilt the axes along the bank, because the acceleration is horizontal.','Frictionless bank: N sin θ supplies the centripetal force and N cos θ balances weight, so tan θ = v²/(rg). At the top of a vertical loop, gravity alone can provide the centripetal force at the minimum speed v = √(gr).'],
 keys:[['Circular dynamics','Σ F_toward centre = mv²/r'],['Frictionless bank','tan θ = v²/(rg)'],['Flat curve with friction','μ_s mg = mv²/r'],['Loop top (minimum)','v = √(gr)'],['Loop top','N + mg = mv²/r'],['Loop bottom','N − mg = mv²/r']],
 ex:[{q:'What bank angle lets a car take a 100 m radius curve at 20 m/s with no friction?',s:['tan θ = v²/(rg) = 400/(100 × 9.81) = 0.408.'],a:'θ ≈ 22°'}],
 traps:['Tilting the axes along the bank. That makes the algebra much harder.','Adding "centripetal force" as an extra force on the FBD.']});

X('phys_work',{
 why:'Work and power connect forces to energy.',
 idea:['Work done by a constant force: W = Fd cos θ, where θ is the angle between the force and the displacement. A force perpendicular to the motion does no work, such as the normal force on level ground.','The work–energy theorem: W_net = ΔK. A spring\'s work comes from the area under F = kx, ½kx². Power is how fast work is done: P = W/t = Fv.'],
 keys:[['W','Fd cos θ (J)'],['W_net','ΔK = ½mv₂² − ½mv₁²'],['Spring work','½kx² (from equilibrium)'],['Power','P = W/t = Fv (W)'],['⊥ force','does no work']],
 ex:[{q:'You pull a sled 20 m with 50 N at 30° above horizontal. Find the work.',s:['W = (50)(20) cos 30°.'],a:'866 J'}],
 traps:['Using the angle to the vertical.','Saying friction does positive work.']});

X('phys_energy',{
 why:'Energy conservation solves many problems faster than forces.',
 idea:['Track energy between two moments: K₁ + U₁ + W_other = K₂ + U₂. With only gravity and springs doing work, mechanical energy is conserved: K₁ + U₁ = K₂ + U₂.','Friction removes mechanical energy as heat, W_f = −f_k d. Energy methods don\'t care about the path for gravity and springs, which is why they work so well on curved tracks.'],
 keys:[['Energy equation','K₁ + U₁ + W_other = K₂ + U₂'],['K','½mv²'],['U_g','mgh'],['U_s','½kx²'],['Friction','W = −μ_k N d'],['Path','independent for conservative forces']],
 ex:[{q:'A 2.0 kg block slides from rest down a frictionless track from a height of 5.0 m. Speed at the bottom?',s:['mgh = ½mv².','v = √(2gh) = √(2 × 9.81 × 5.0).'],a:'9.9 m/s (the mass cancels)'}],
 traps:['Forgetting friction\'s energy loss.','Measuring h from different reference levels in the same problem.']});

X('phys_mom',{
 why:'Momentum conservation handles collisions, where forces are too complicated to track.',
 idea:['Momentum p = mv is a vector. Impulse J = FΔt = Δp: a force acting over time changes momentum.','For an isolated system, total momentum is conserved in every collision. Kinetic energy is conserved only in elastic collisions. In a perfectly inelastic collision, the objects stick together and the KE loss is as large as possible.'],
 keys:[['p','mv (vector)'],['Impulse','J = FΔt = Δp = area under F–t'],['Conservation','Σp_before = Σp_after (isolated system)'],['Elastic','KE conserved too'],['Perfectly inelastic','common final velocity'],['2-D','conserve x and y separately']],
 ex:[{q:'A 1000 kg car at 20 m/s hits a stationary 1500 kg car and they lock together. Find v and the % of KE lost.',s:['1000(20) = 2500v, so v = 8.0 m/s.','KE before: ½(1000)(400) = 200 kJ. After: ½(2500)(64) = 80 kJ.'],a:'8.0 m/s; 60% of the KE is lost'}],
 traps:['Assuming KE is conserved in every collision.','Forgetting momentum is a vector, so direction signs matter.']});

X('phys_rot',{
 why:'Rotational dynamics mirrors linear motion with new variables.',
 idea:['Every linear quantity has a rotational partner: θ, ω and α for x, v and a; torque τ for force; moment of inertia I for mass. So Στ = Iα, and the constant-α kinematics equations look exactly like the linear ones.','Torque τ = rF sin φ: the force times its lever arm. For rolling without slipping, v = ωR and KE = ½mv² + ½Iω². Angular momentum L = Iω is conserved with no external torque.'],
 keys:[['Kinematics','ω = ω₀ + αt, θ = ω₀t + ½αt²'],['Torque','τ = rF sin φ'],['2nd law','Στ = Iα'],['Rolling','v = ωR, KE = ½mv² + ½Iω²'],['I','solid disk ½MR², hoop MR², solid sphere ⅖MR², rod (centre) MR²/12'],['Angular momentum','L = Iω, conserved if Στ_ext = 0']],
 ex:[{q:'A solid ball rolls from rest down a 2.0 m high ramp without slipping. Speed at the bottom?',s:['mgh = ½mv² + ½(⅖mR²)(v/R)² = (7/10)mv².','v = √(10gh/7) = √(10 × 9.81 × 2.0/7).'],a:'5.3 m/s (slower than sliding, √(2gh) = 6.3 m/s)'}],
 traps:['Forgetting rotational KE for rolling objects.','Using degrees in ω and α. Use radians.']});

X('phys_rotb',{
 why:'Rotation concept questions test intuition about I, torque and equilibrium.',
 idea:['Moment of inertia depends on how far the mass is from the axis, not only on how much mass there is. A hoop is harder to spin than a disk of the same mass and radius.','Static equilibrium needs both ΣF = 0 and Στ = 0. You may take torques about any point, so choose one that eliminates unknown forces.','A skater pulling in their arms decreases I, so ω increases (L = Iω stays the same).'],
 keys:[['I','Σmr², depends on the mass distribution'],['Equilibrium','ΣF = 0 and Στ = 0'],['Pivot choice','put it where an unknown force acts'],['Conservation','I₁ω₁ = I₂ω₂']],
 ex:[{q:'A 4.0 m plank is supported at both ends. A 600 N person stands 1.0 m from the left end. Ignoring the plank\'s weight, find the force at the right support.',s:['Take torques about the left end: R(4.0) = 600(1.0).'],a:'R = 150 N (the left support takes 450 N)'}],

X('phys_lab',{
 why:'Lab reports need uncertainty propagation and a fair comparison between results.',
 idea:['Every measurement has an uncertainty. When you combine measurements, combine their uncertainties in quadrature. For sums and differences, combine absolute uncertainties. For products and quotients, combine relative uncertainties. A power n multiplies the relative uncertainty by n.','To compare two values a ± δa and b ± δb, use t′ = |a − b|/√(δa² + δb²). The usual guideline: t′ &lt; 1 means they agree, 1 ≤ t′ ≤ 3 is inconclusive, and t′ &gt; 3 means they disagree. Check your lab manual for its exact thresholds.'],
 keys:[['Sum or difference','δs = √(δx² + δy²)'],['Product or quotient','δq/q = √((δx/x)² + (δy/y)²)'],['Power','q = xⁿ ⇒ δq/q = |n|·δx/x'],['t′','|a − b|/√(δa² + δb²)'],['Guideline','&lt; 1 agree; 1–3 inconclusive; &gt; 3 disagree'],['Reporting','uncertainty to 1–2 sig figs; value to the same decimal place']],
 ex:[{q:'Measured g = 9.70 ± 0.08 m/s². Accepted g = 9.81 ± 0.01 m/s². Compare them.',s:['|a − b| = 0.11.','√(0.08² + 0.01²) = 0.0806.','t′ = 0.11/0.0806 = 1.4.'],a:'t′ ≈ 1.4: inconclusive'}],
 traps:['Adding uncertainties directly instead of in quadrature.','Reporting 9.7034 ± 0.08. Round the value to match the uncertainty.']});

// ===== Ask: an AI tutor grounded in the course =====
// Sources, in priority order: the student's own imported notes (stored on this device only),
// then the app's lessons. Only the few most relevant passages are sent with each question.
// Model route: Claude's built-in `sample` capability in the Claude version; in the phone app, the
// student's own API key from any of several providers (stored on this device only, never in
// progress codes, sent only to the provider they picked).

let TUT={msgs:[],ctx:null,busy:false,notes:null,lessons:null,sample:undefined,abort:null,atts:[],img:false,imgMax:4};
const IN_CLAUDE=!!(window.claude&&window.claude.use);
const AIKEY='margin_ai_key',AICFG='margin_ai',AIMODEL='claude-sonnet-5-5';
// Providers. Defaults checked against each provider's model docs (Nov 2026). Each allows direct
// browser (CORS) requests; a custom server must allow them too.
const PROV={
 anthropic:{n:'Anthropic',s:'Anthropic',model:AIMODEL,ph:'sk-ant-…',get:'Get a key at console.anthropic.com and set a monthly spend limit there.'},
 openai:{n:'OpenAI',s:'OpenAI',model:'gpt-6.2-sol',ph:'sk-…',get:'Get a key at platform.openai.com, under API keys. Set a usage limit there.'},
 gemini:{n:'Google Gemini',s:'Gemini',model:'gemini-3.8-flash',ph:'AIza…',get:'Get a key in Google AI Studio (aistudio.google.com), under Get API key.'},
 openrouter:{n:'OpenRouter',s:'OpenRouter',model:'nvidia/nemotron-3.5-super-vl:free',ph:'sk-or-…',get:'Get a key at openrouter.ai, under Keys. Any model slug from openrouter.ai/models works.'},
 custom:{n:'Custom (OpenAI-compatible)',s:'Custom',model:'',ph:'Your key',get:'Any service with an OpenAI-style /chat/completions endpoint: Groq, DeepSeek, Mistral, a local server and others. Use its base URL and a model name from its docs. The server has to allow requests from web pages (CORS), or the request is blocked.'}};
function aiCfg(){let c=null;try{c=JSON.parse(localStorage.getItem(AICFG)||'null')}catch(e){}
  if(!c||!c.key){let old='';try{old=localStorage.getItem(AIKEY)||''}catch(e){}
    if(old){c={prov:'anthropic',key:old,model:AIMODEL,base:''};try{localStorage.setItem(AICFG,JSON.stringify(c));localStorage.removeItem(AIKEY)}catch(e){}}}
  return c&&c.key&&PROV[c.prov]?c:null}
const askEl=s=>document.querySelector('#modal.show '+s)||document.querySelector(s);
function tutKey(){const c=aiCfg();return c?c.key:''}
function detectProv(k){k=String(k||'').trim();if(/^sk-ant-/.test(k))return'anthropic';if(/^sk-or-/.test(k))return'openrouter';if(/^AIza/.test(k))return'gemini';if(/^sk-/.test(k))return'openai';return k?'custom':''}

// ---------- tiny search engine (BM25) ----------
const STOP=new Set('the a an and or of to in is are be for on with as by it this that at from if then so we you your can not no its into than which what when how why does do'.split(' '));
function toks(t){return String(t).toLowerCase().replace(/<[^>]+>/g,' ').replace(/[^a-z0-9α-ωσπ∗*₀-₉⁰-⁹²³ℤℂ≡∀∃⇒]+/g,' ').split(' ').filter(w=>w&&w.length>1&&!STOP.has(w))}
function mkIndex(chunks){const df=new Map();let tot=0;for(const c of chunks){c.tf=new Map();for(const w of toks(c.title+' '+c.text)){c.tf.set(w,(c.tf.get(w)||0)+1)}c.len=[...c.tf.values()].reduce((a,b)=>a+b,0);tot+=c.len;for(const w of c.tf.keys())df.set(w,(df.get(w)||0)+1)}return{chunks,df,avg:tot/Math.max(1,chunks.length),N:chunks.length}}
function search(ix,q,k){if(!ix||!ix.N)return[];const qs=[...new Set(toks(q))];const out=[];for(const c of ix.chunks){let s=0;for(const w of qs){const f=c.tf.get(w);if(!f)continue;const idf=Math.log(1+(ix.N-(ix.df.get(w)||0)+.5)/((ix.df.get(w)||0)+.5));s+=idf*f*2.2/(f+1.2*(.25+.75*c.len/ix.avg))}if(s>0)out.push([s,c])}return out.sort((a,b)=>b[0]-a[0]).slice(0,k).map(x=>x[1])}
function lessonIndex(){if(TUT.lessons)return TUT.lessons;const ch=[];for(const k in LX){const x=LX[k],n=REG[k];if(!n)continue;const t=[x.why,...(x.idea||[]),...(x.keys||[]).map(p=>p.join(': ')),...(x.ex||[]).map(e=>'Example: '+e.q+' '+e.s.join(' ')+' '+(e.a||'')),...(x.traps||[]).map(t=>'Trap: '+t),x.tip||''].join('\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>');ch.push({src:'lesson',k,title:`Lesson: ${n.name} (${n.course.name}, ${n.world.title})`,text:t})}return TUT.lessons=mkIndex(ch)}

// ---------- the student's notes, kept in IndexedDB on this device ----------
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('margin_notes',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('docs',{keyPath:'id'});d.createObjectStore('chunks',{keyPath:'id',autoIncrement:true}).createIndex('doc','doc')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbAll(store){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction(store).objectStore(store).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function notesIndex(){if(TUT.notes)return TUT.notes;try{const ch=await idbAll('chunks');TUT.notes=mkIndex(ch.map(c=>({src:'notes',title:`Notes: ${c.docName}${c.page?`, p. ${c.page}`:''}`,text:c.text})))}catch(e){TUT.notes=mkIndex([])}return TUT.notes}
function chunkText(text,maxLen=1100){const paras=text.replace(/\r/g,'').split(/\n\s*\n|(?<=\.)\s{2,}/);const out=[];let cur='';for(const p of paras){const t=p.replace(/\s+/g,' ').trim();if(!t)continue;if((cur+' '+t).length>maxLen&&cur){out.push(cur);cur=t}else cur=cur?cur+' '+t:t;while(cur.length>maxLen*1.6){out.push(cur.slice(0,maxLen));cur=cur.slice(maxLen)}}if(cur)out.push(cur);return out}
async function pdfPages(file,onProg){let lib;try{lib=await import(new URL('lib/pdf.min.mjs',location.href).href)}catch(e){throw new Error('PDF reading is only available in the phone app. Here, use a .txt or .md file, or a photo of the page.')}
  lib.GlobalWorkerOptions.workerSrc=new URL('lib/pdf.worker.min.mjs',location.href).href;const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;const pages=[];
  for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const tc=await p.getTextContent();let s='';for(const it of tc.items){s+=it.str+(it.hasEOL?'\n':' ')}pages.push(s);if(i%5===0||i===pdf.numPages)onProg(i,pdf.numPages)}return pages}

// ---------- prompt ----------
const TUTOR_SYS=`You are the tutor inside Margin, a study app for a first-year University of Waterloo student taking MATH 135 (algebra and proofs), MATH 137 (calculus), CHEM 120 and PHYS 121.
Ground every answer in the COURSE MATERIAL below. It takes priority over your general knowledge: use its notation, theorem names (TD, DIC, CAD, LDET, FℓT, IVT, MVT…), constants (R_H = 2.179 × 10⁻¹⁸ J, R = 8.3145 L·kPa/(K·mol), g = 9.81 m/s²) and conventions. "Notes" passages are the student's own course notes and outrank "Lesson" passages.
After any claim taken from the material, cite it in square brackets with its label, for example [Notes: CHEM Module 4, p. 16] or [Lesson: Bézout & EEA].
If the material does not cover the question, say so in one short line ("Not in your notes; here's the general idea."), then answer from general knowledge.
Style: informal and brief. Work step by step with short numbered steps when solving. If the student is working on graded assignment questions, guide with hints rather than giving the final answer. Write math in plain Unicode (x², √, ≤, ∑, ∫); no LaTeX. No headings.`;

// ---------- Teaching modes, alternative explanations, misconception capture ----------
const TMODES=[['explain','Explain','Answer clearly and briefly, with short numbered steps when solving.'],
 ['steps','Step by step','Break the problem into small numbered steps. Explain every operation and WHY it is needed. Never skip reasoning. After each major step, ask one quick check question before moving on, and wait for the reply.'],
 ['socratic','Socratic','Do NOT give the answer. Ask one guiding question at a time that leads the student to the next idea. When they answer, say whether it is right, probe any misunderstanding with a follow-up question, and gradually increase difficulty. Only reveal the full solution if they explicitly ask.'],
 ['concept','Big picture','Explain the underlying idea: why it is true, how it connects to other topics in the course, and an intuitive picture or analogy. Use at most a small example; focus on understanding over procedure.'],
 ['exam','Exam','Act like a university professor running an exam. Give ONE exam-style question at a time on the topic (in the format of the student\'s course tests), say how long it should take, and do not reveal the answer. When the student replies, grade it out of the stated marks like a marker, then explain the errors, then offer the next question.'],
 ['prof','Professor','Teach like a University of Waterloo professor giving a lecture at the level of this course: precise definitions first, then theorems with the exact hypotheses, a short proof or derivation, and one worked example in the notation the course uses. Be rigorous about edge cases and quantifiers. Point out which parts are typically examined.'],
 ['challenge','Challenge','Give hard problems that combine several concepts or put the idea in an unfamiliar setting. One problem at a time, no answer until the student attempts it. Then grade and explain.']];
const ALT=['a different angle: describe a picture or diagram in words','a fully worked numerical example with small numbers','an intuitive analogy from everyday life','a clean algebraic derivation','first principles, building up from the definitions','a real-world application'];
const tmode=()=>TMODES.find(m=>m[0]===(TUT.tmode||'explain'))||TMODES[0];
function sysFor(){const m=tmode();return TUTOR_SYS+`\n\nTEACHING MODE: ${m[1]}. ${m[2]}\nIf you notice a specific misconception the student holds (not just a slip), end your reply with one line exactly like: [[misconception: <one short sentence>]]. Otherwise don't add that line.`}

const RUBRIC={
 m135:`MATH 135 markers check: the proof states what is assumed and what is to be shown; every step is justified, citing results by name (Divisibility of Integer Combinations, Bounding by Divisibility, Bézout, Euclid's Lemma, CRT, FℓT, etc.); cases cover every possibility; quantifiers are handled correctly (an arbitrary element for ∀, a specific witness for ∃); no working backwards from the conclusion; induction has a base case, a clearly stated inductive hypothesis, an inductive step that uses it, and a conclusion; set equality shows both inclusions; correct notation (| vs /, ≡, ∈ vs ⊆).`,
 m137:`MATH 137 markers check: all work shown; limits written with "lim" until evaluated; ε–N and ε–δ proofs have the right structure (let ε > 0, choose N or δ in terms of ε, then show the inequality); theorems are named and their hypotheses checked (Squeeze, MCT, IVT, EVT, MVT, L'Hôpital needs 0/0 or ∞/∞); exact answers, no decimals; absolute-value inequalities solved by cases with the final set stated.`,
 chem:`CHEM 120 markers check: balanced equations with states; units carried through every step; mole ratios from the balanced equation; the limiting reagent identified when relevant; correct significant figures; a final answer with units.`,
 phys:`PHYS 121 markers check: a clear free-body or motion diagram; a coordinate system; a list of knowns and unknowns; general equations (Newton's laws, kinematics, ΔE_tot = 0, momentum conservation) before substituting; solving in symbols before numbers; a units or dimension check and special cases; the final answer boxed with units and sensible significant figures.`};

${RUBRIC[cid]||''}
Rules:
- Mark only what is written. Never invent steps that aren't there. If part of the photo is unreadable, say which part.
- Be specific: quote or paraphrase the exact line you're commenting on.
- Give partial credit the way a real marker would. If the student gives the "out of" value, use it; otherwise choose a sensible total for the question (usually 3 to 10).
- Use Unicode math (∀ ∃ ∈ ≤ ≥ ≡ √ ² ₁), never LaTeX.
- Course material may be provided; prefer its theorem names and notation.
${graded?'- This is GRADED WORK (an assignment). Do NOT write a corrected solution or the final answer. Point to each problem and say what kind of fix is needed, as hints.':'- This is practice. After the feedback you may give a short model answer.'}
Reply in exactly this format:
**Score:** <earned>/<total>
**Verdict:** <one sentence>
**Line by line:**
- ✓ or ✗ or ~ <the line or step>: <comment>
(one bullet per meaningful step)

**To get full marks:**
- <concrete fix>
${graded?'':'**Model answer:** <brief, only if marks were lost>'}`;

// ---------- 2. Learning profile ----------
const ERR_TYPES=[['concept','Didn’t understand the idea'],['formula','Wrong formula or rule'],['calc','Calculation slip'],['misread','Misread the question'],['method','Wrong method'],['prereq','Missing background']];
const CONF=[['guess','Guessed'],['unsure','Unsure'],['sure','Sure']];
function lp(k){S.lp=S.lp||{};return S.lp[k]||(S.lp[k]={n:0,c:0,ms:0,msN:0,hn:0,hc:0,cf:{},err:{},last:0,lastOk:0,fs:null})}
// on-device event log (IndexedDB). Falls back silently where IndexedDB isn't available.
const EVDB={db:null,ok:true};
function evOpen(){if(EVDB.db||!EVDB.ok)return Promise.resolve(EVDB.db);return new Promise(res=>{try{const r=indexedDB.open('margin_learn',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('ev')){const s=d.createObjectStore('ev',{keyPath:'id',autoIncrement:true});s.createIndex('k','k');s.createIndex('t','t')}if(!d.objectStoreNames.contains('bk'))d.createObjectStore('bk',{keyPath:'day'})};r.onsuccess=()=>{EVDB.db=r.result;res(EVDB.db)};r.onerror=()=>{EVDB.ok=false;res(null)}}catch(e){EVDB.ok=false;res(null)}})}
async function evAdd(e){const d=await evOpen();if(!d)return null;return new Promise(res=>{try{const tx=d.transaction('ev','readwrite');const r=tx.objectStore('ev').add(e);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(x){res(null)}})}
async function evPatch(id,patch){const d=await evOpen();if(!d||id==null)return;try{const st=d.transaction('ev','readwrite').objectStore('ev');const g=st.get(id);g.onsuccess=()=>{if(g.result)st.put(Object.assign(g.result,patch))}}catch(x){}}
async function evAll(){const d=await evOpen();if(!d)return[];return new Promise(res=>{try{const q=d.transaction('ev').objectStore('ev').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(x){res([])}})}
// record one answered question
function lpRecord(q,ok,o){const k=q.nk,a=lp(k),now=Date.now();a.n++;if(ok){a.c++;a.lastOk=now}a.last=now;
 const ms=Math.max(0,Math.min(15*60e3,o.ms||0));if(ms>0){a.ms+=ms;a.msN++}if(o.hint){a.hn++;if(ok)a.hc++}
 const s=srs(k);s.m=s.m||[];s.m.push((o.hint?1:0)|(o.hard?2:0));while(s.m.length>s.h.length)s.m.shift();
 const ev={t:now,k,ok:ok?1:0,ms,hint:o.hint?1:0,hard:o.hard?1:0,sel:q.sel?1:0,rt:o.rt||'',q:strip(q.prompt).slice(0,160)};
 RD&&(RD.lastEv=null);evAdd(ev).then(id=>{if(RD)RD.lastEv=id});return ev}
function lpConf(k,level,ok){const a=lp(k);const c=a.cf[level]||(a.cf[level]=[0,0]);c[0]++;if(ok)c[1]++;if(RD&&RD.lastEv!=null)evPatch(RD.lastEv,{conf:level});save()}
function lpErr(k,type,mid){const a=lp(k);a.err[type]=(a.err[type]||0)+1;const m=S.mistakes.find(x=>x.mid===mid)||S.mistakes.filter(x=>x.nk===k).slice(-1)[0];if(m)m.why=type;if(RD&&RD.lastEv!=null)evPatch(RD.lastEv,{err:type});save()}

// ---------- 3. Mastery estimate with uncertainty ----------
// Beta(1,1) prior; each recent answer weighted by recency (0.85 per step back),
// harder formats (typed, multi-select) count 1.25×, answers given after a hint count half.
function lpMastery(k){const s=S.srs[k];if(!s||!s.h.length)return{pct:0,lo:0,hi:0,n:0,neff:0,conf:'none'};
 const h=s.h,m=s.m||[],off=h.length-m.length;let a=1,b=1,ne=0;
 for(let i=0;i<h.length;i++){const w=Math.pow(.85,h.length-1-i);const f=i>=off?m[i-off]:0;const hint=f&1,hard=f&2;
  if(h[i]){const cr=(hint?.5:1)*(hard?1.25:1);a+=w*cr;b+=w*(1-Math.min(1,cr))}else b+=w;ne+=w}
 const mean=a/(a+b),sd=Math.sqrt(a*b/((a+b)**2*(a+b+1)));const conf=ne<2.5?'low':ne<5?'medium':'high';
 return{pct:Math.round(100*mean),lo:Math.max(0,Math.round(100*(mean-1.28*sd))),hi:Math.min(100,Math.round(100*(mean+1.28*sd))),n:h.length,neff:ne,conf}}
const confLbl={none:'No data yet',low:'Low confidence (few answers)',medium:'Medium confidence',high:'High confidence'};

// ---------- 4. FSRS-4.5-style memory model ----------
// R(t) = (1 + 19/81 · t/S)^−0.5 ; at the 90% target the interval equals the stability S (days).
const FW=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const fsR=(t,St)=>Math.pow(1+19/81*Math.max(0,t)/Math.max(.1,St),-.5);
const clampD=d=>Math.min(10,Math.max(1,d));
function fsInit(k){if(S.lp&&S.lp[k]&&S.lp[k].fs)return S.lp[k].fs;const s=S.srs[k];if(!s||!s.h.length)return null;const a=lp(k);{a.fs={S:Math.max(.5,SRS_INT[s.box||0]||1),D:5,t:s.due?s.due-(SRS_INT[s.box||0]||1):today()}}return a.fs}
function fsReview(k,G){const a=lp(k);const t0=today();let f=fsInit(k);
 if(!f){a.fs={S:FW[G-1],D:clampD(FW[4]-(G-3)*FW[5]),t:t0};return a.fs}
 const el=Math.max(0,t0-f.t),R=fsR(el,f.S);let D=f.D-FW[6]*(G-3);D=clampD(FW[7]*(FW[4])+(1-FW[7])*D);
 let Sn;if(G===1)Sn=FW[11]*Math.pow(f.D,-FW[12])*(Math.pow(f.S+1,FW[13])-1)*Math.exp(FW[14]*(1-R));
 else if(el===0)Sn=f.S*(G>=3?1.15:1); // same-day repeat: small gain only
 else Sn=f.S*(Math.exp(FW[8])*(11-f.D)*Math.pow(f.S,-FW[9])*(Math.exp(FW[10]*(1-R))-1)*(G===2?FW[15]:1)*(G===4?FW[16]:1)+1);
 a.fs={S:Math.max(.2,Math.min(3650,Sn)),D,t:t0};return a.fs}
function recallShown(k){const M=lpMastery(k);return M.n&&M.pct>=50?recall(k):null}
function recall(k,atDay){const f=(S.lp&&S.lp[k]&&S.lp[k].fs)||fsInit(k);if(!f)return null;return fsR((atDay==null?today():atDay)-f.t,f.S)}
function nextInterval(k){const f=lp(k).fs;return f?Math.max(1,Math.round(f.S)):1}

// ---------- 5a. Diagnosis ----------
const statusOf=k=>{const M=lpMastery(k),R=recall(k);if(!M.n)return'new';if(M.pct>=80&&M.conf!=='low'&&(R==null||R>=.7))return'mastered';if(M.pct>=50)return'developing';return'weak'};
function weakPrereqs(k,depth=2,seen=new Set()){return wpRaw(k,depth,seen).sort((a,b)=>(statusOf(a)==='weak'?0:1)-(statusOf(b)==='weak'?0:1))}
function wpRaw(k,depth=2,seen=new Set()){const out=[];for(const p of PRE()[k]||[]){if(seen.has(p))continue;seen.add(p);const st=statusOf(p);if(st==='weak'||(st==='new'&&statusOf(k)!=='new'))out.push(p);if(depth>1)out.push(...wpRaw(p,depth-1,seen))}return[...new Set(out)]}

// ---------- 5b. Exam readiness (an estimate, with its basis) ----------
function readiness(e){const ks=e.worlds.flatMap(w=>WREG[w]?WREG[w].nodes.map(n=>n.key):[]);if(!ks.length)return{pct:0,cov:0,conf:'none',n:0,ks};
 const exDay=dayNum(e.date);let sum=0,tried=0,nAns=0;for(const k of ks){const M=lpMastery(k);if(!M.n)continue;tried++;nAns+=M.n;const R=recall(k,exDay);sum+=M.pct*(R==null?.6:.5+.5*R)}
 const cov=tried/ks.length;let pct=Math.round(sum/ks.length);const mk=(S.mocks||[]).filter(m=>(m.ex===e.id||(m.c===e.course&&(m.mode==='mid'||m.mode==='final')))&&Date.now()-m.at<14*864e5).slice(-1)[0];if(mk)pct=Math.round(.75*pct+.25*100*mk.score/mk.n);const conf=cov<.5||nAns<ks.length*3?'low':cov<.9||nAns<ks.length*6?'medium':'high';
 return{pct,cov,conf,n:nAns,ks,tried,mock:mk||null}}

// ---------- 5c. Daily plan: what to study today, and why ----------
function planToday(){const d=ensureDaily();d.pd=d.pd||{};const budget=S.dailyMin||45;const t=today();const cands=[];
 const exs=(S.exams||[]).filter(e=>daysUntil(e.date)>=0&&daysUntil(e.date)<=21).sort((a,b)=>a.date.localeCompare(b.date));
 const exOf=k=>exs.find(e=>e.worlds.some(w=>WREG[w]&&WREG[w].nodes.some(n=>n.key===k)));
 for(const k in REG){const n=REG[k];const M=lpMastery(k),R=recall(k),st=statusOf(k),ex=exOf(k);let sc=0,why=[],kind='practice',min=10,out='';
  const inPlay=(S.lp&&S.lp[k]&&S.lp[k].n)||ex||n.course.id===S.course;if(!inPlay)continue;
  if(ex){const dl=daysUntil(ex.date);sc+=40*(1-M.pct/100)*Math.min(3,14/(dl+1));why.push(`${ex.title} is ${dl===0?'today':dl===1?'tomorrow':`in ${dl} days`} and this topic is on it`)}
  if(R!=null&&R<.9&&M.n){sc+=10+30*(.9-R);kind=M.pct>=70?'review':'practice';min=kind==='review'?5:10;why.push(`predicted recall has dropped to about ${Math.round(R*100)}%`)}
  if(st==='weak'){sc+=18;why.push(`you've got ${Math.round(M.pct)}% mastery from ${M.n} answer${M.n===1?'':'s'}`)}
  const deps=dependents(k).filter(x=>statusOf(x)==='weak'||(S.lp&&S.lp[x]&&S.lp[x].n>0&&lpMastery(x).pct<60));
  if(deps.length&&st!=='mastered'){sc+=22;kind='prereq';why.unshift(`${deps.slice(0,2).map(x=>REG[x].name).join(' and ')} build${deps.length===1?'s':''} on it and ${deps.length===1?'is':'are'} weak`)}
  if(st==='new'){kind='learn';min=12;const wp=(PRE()[k]||[]).filter(p=>statusOf(p)==='weak');if((PRE()[k]||[]).some(p=>statusOf(p)==='new'))sc-=45;if(wp.length){sc-=25;}else if(ex||n.course.id===S.course){sc+=ex?12:4;why.push(ex?'you haven’t started it yet':'it’s the next new topic on your path')}}
  if(st==='mastered'&&(R==null||R>=.9))sc-=30;
  if(sc<=5||!why.length)continue;
  out=kind==='review'?'Bring recall back above 90%':kind==='learn'?'Get a first look and a first mastery estimate':kind==='prereq'?'Fix the foundation the weak topics depend on':'Move mastery toward 80%';
  cands.push({k,sc,why,kind,min,out,done:!!d.pd[k],pri:sc>=45?'High':sc>=25?'Medium':'Low'})}
 cands.sort((a,b)=>b.sc-a.sc);const items=[];let used=0;const pickNew=new Set();
 for(const c of cands){if(used+c.min>budget&&items.length)continue;if(c.kind==='learn'){const w=REG[c.k].world.key;if(pickNew.has(w))continue;pickNew.add(w)}items.push(c);used+=c.min;if(items.length>=7)break}
 return{items,used,budget}}

// ---------- 5d. Insights from recorded activity only ----------
function insights(cid){const out=[];const ks=Object.keys(REG).filter(k=>REG[k].course.id===cid&&S.lp&&S.lp[k]&&S.lp[k].n>0);
 const name=k=>REG[k].name;
 // prerequisite gaps
 for(const k of ks){if(statusOf(k)!=='weak')continue;const wp=weakPrereqs(k).filter(p=>S.lp[p]&&S.lp[p].n>=2);if(wp.length){out.push({t:`Your trouble with ${name(k)} may come from ${name(wp[0])}, which it builds on. ${name(wp[0])} is at ${lpMastery(wp[0]).pct}% from ${S.lp[wp[0]].n} answers.`,b:'Prerequisite map + your answers',a:{k:wp[0]}});break}}
 // hint reliance
 const hk=ks.filter(k=>S.lp[k].hn>=3&&S.lp[k].n-S.lp[k].hn>=3).map(k=>{const a=S.lp[k];return{k,hAcc:a.hc/a.hn,nAcc:(a.c-a.hc)/(a.n-a.hn)}}).filter(x=>x.hAcc-x.nAcc>=.25).sort((a,b)=>(b.hAcc-b.nAcc)-(a.hAcc-a.nAcc));
 if(hk[0])out.push({t:`In ${name(hk[0].k)} you get ${Math.round(hk[0].hAcc*100)}% right with a hint but ${Math.round(hk[0].nAcc*100)}% without. The hint is doing work you'll need to do alone on the test.`,b:`${S.lp[hk[0].k].hn} hinted and ${S.lp[hk[0].k].n-S.lp[hk[0].k].hn} unhinted answers`,a:{k:hk[0].k}});
 // calibration
 let sure=[0,0],guess=[0,0];for(const k of ks){const c=S.lp[k].cf||{};if(c.sure){sure[0]+=c.sure[0];sure[1]+=c.sure[1]}if(c.guess){guess[0]+=c.guess[0];guess[1]+=c.guess[1]}}
 if(sure[0]>=8){const acc=sure[1]/sure[0];out.push({t:acc>=.85?`When you mark an answer “Sure”, you're right ${Math.round(acc*100)}% of the time. Your confidence is well calibrated.`:`When you mark an answer “Sure”, you're right only ${Math.round(acc*100)}% of the time. Slow down on questions that feel easy.`,b:`${sure[0]} answers marked Sure`})}
 // speed
 const tk=ks.filter(k=>S.lp[k].msN>=4).map(k=>({k,avg:S.lp[k].ms/S.lp[k].msN}));if(tk.length>=4){const med=tk.map(x=>x.avg).sort((a,b)=>a-b)[Math.floor(tk.length/2)];const slow=tk.filter(x=>x.avg>2*med).sort((a,b)=>b.avg-a.avg)[0];if(slow)out.push({t:`${name(slow.k)} takes you about ${Math.round(slow.avg/1000)} s per question, over twice your usual ${Math.round(med/1000)} s. On a timed test that costs you.`,b:`${S.lp[slow.k].msN} timed answers`,a:{k:slow.k}})}
 // trend
 for(const k of ks){const h=(S.srs[k]||{}).h||[];if(h.length<10)continue;const a1=h.slice(0,5).reduce((x,y)=>x+y,0)/5,a2=h.slice(-5).reduce((x,y)=>x+y,0)/5;if(a2-a1>=.4){out.push({t:`${name(k)} is improving: ${Math.round(a1*5)}/5 on your earlier answers, ${Math.round(a2*5)}/5 on your latest five.`,b:`last ${h.length} answers`});break}if(a1-a2>=.4){out.push({t:`${name(k)} is slipping: ${Math.round(a1*5)}/5 earlier, ${Math.round(a2*5)}/5 on your latest five.`,b:`last ${h.length} answers`,a:{k}});break}}
 // mistake types
 const et={};for(const k of ks)for(const [t,n] of Object.entries(S.lp[k].err||{}))et[t]=(et[t]||0)+n;const tot=Object.values(et).reduce((a,b)=>a+b,0);
 if(tot>=5){const top=Object.entries(et).sort((a,b)=>b[1]-a[1])[0];const lbl=(ERR_TYPES.find(x=>x[0]===top[0])||[0,top[0]])[1];out.push({t:`Your most common reason for a mistake is “${lbl.toLowerCase()}” (${top[1]} of ${tot} tagged mistakes).`,b:'Mistakes you tagged'})}
 // forgetting
 const fade=ks.filter(k=>{const R=recall(k);return R!=null&&R<.7&&lpMastery(k).pct>=60});if(fade.length)out.push({t:`${fade.length} topic${fade.length>1?'s you knew are':' you knew is'} fading: ${fade.slice(0,3).map(name).join(', ')}. A 5-minute review now is cheaper than relearning later.`,b:'Memory model (an estimate)',a:{k:fade[0]}});
 return out}

// ---------- 5e. Tutor memory: a compact learner profile for the AI ----------
function learnerBrief(cid){const ks=Object.keys(REG).filter(k=>(!cid||REG[k].course.id===cid)&&S.lp&&S.lp[k]&&S.lp[k].n>0);if(!ks.length)return'';
 const rows=ks.map(k=>({k,M:lpMastery(k)})).sort((a,b)=>a.M.pct-b.M.pct);const weak=rows.filter(r=>r.M.pct<60).slice(0,6),strong=rows.filter(r=>r.M.pct>=80&&r.M.conf!=='low').slice(-6);
 const et={};for(const k of ks)for(const [t,n] of Object.entries(S.lp[k].err||{}))et[t]=(et[t]||0)+n;
 const recentMist=S.mistakes.filter(m=>REG[m.nk]&&(!cid||REG[m.nk].course.id===cid)).slice(-4).map(m=>`${REG[m.nk].name}${m.why?` (${m.why})`:''}: ${strip(m.prompt).slice(0,90)}`);
 return`LEARNER PROFILE (from recorded practice; estimates, not facts)
Weak topics: ${weak.map(r=>`${REG[r.k].name} ${r.M.pct}% (${r.M.n} answers)`).join('; ')||'none recorded'}
Strong topics: ${strong.map(r=>REG[r.k].name).join(', ')||'none yet'}
Mistake types the student tagged: ${Object.entries(et).map(([t,n])=>`${t} ×${n}`).join(', ')||'none'}
Recent mistakes: ${recentMist.join(' | ')||'none'}
Misconceptions noticed before: ${(S.miscon||[]).slice(-5).map(x=>x.t).join(' | ')||'none'}
Use this to pitch explanations: revisit weak prerequisites when relevant; don't assume a topic is understood from one correct answer.`}

const KIND_LBL={review:'Review',practice:'Practise',learn:'Learn',prereq:'Fix the foundation'};

 // new cards: prefer topics you've started, mistakes first
 fresh.sort((a,b)=>(b.src==='Your mistake')-(a.src==='Your mistake')||((S.lp&&S.lp[b.k]&&S.lp[b.k].n)?1:0)-((S.lp&&S.lp[a.k]&&S.lp[a.k].n)?1:0));
 const dd=ensureDaily();dd.fcNew=dd.fcNew||0;return{due,fresh:fresh.slice(0,Math.max(0,15-dd.fcNew)),total:d.length}}
function fcStep(st,G){const t0=today();if(!st)return{S:FW[G-1],D:clampD(FW[4]-(G-3)*FW[5]),t:t0};const el=Math.max(0,t0-st.t),R=fsR(el,st.S);let D=clampD(FW[7]*FW[4]+(1-FW[7])*(st.D-FW[6]*(G-3)));let Sn;
 if(G===1)Sn=FW[11]*Math.pow(st.D,-FW[12])*(Math.pow(st.S+1,FW[13])-1)*Math.exp(FW[14]*(1-R));else if(el===0)Sn=st.S*(G>=3?1.1:1);else Sn=st.S*(Math.exp(FW[8])*(11-st.D)*Math.pow(st.S,-FW[9])*(Math.exp(FW[10]*(1-R))-1)*(G===2?FW[15]:1)*(G===4?FW[16]:1)+1);return{S:Math.max(.2,Math.min(3650,Sn)),D,t:t0}}

  <p class="t-sub" style="font-size:12px;margin-top:16px">Knowing the definition isn't the same as using it. Practise ${n.name} to test that.</p></div>`)}
